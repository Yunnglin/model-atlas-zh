- id: qwen25-vl-teaching
  title: Qwen2.5-VL：一张发票怎样变成答案
  model: qwen-vl
  version: Qwen2.5-VL；仅静态图片教学路径
  basis: teaching
  source: https://arxiv.org/abs/2502.13923v1
  checked: 2026-10-27
  caption: 本站原创教学简图；以处理后 840×560 图片计算 patch 与合并后的数量，省略逐层注意力、位置编码及视频路径。
  alt: 发票图片切成 2400 个 patch，经视觉编码和二乘二合并得到 600 个视觉 token，再由语言模型生成含税金额 114.48。
