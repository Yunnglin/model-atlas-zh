- id: qwen3-teaching
  title: Qwen3：从已知前缀预测下一个 token
  model: qwen3
  version: 2025 年初版 Qwen3；Dense 与 MoE 为不同型号选择
  basis: teaching
  source: https://arxiv.org/abs/2505.09388v1
  checked: 2026-10-27
  caption: 本站原创教学简图；Dense 与 MoE 是两种型号选择，不是同一个模型同时走两条 FFN 路线。省略残差、归一化细节和层数。
  alt: 文字前缀进入因果 Transformer，经注意力及 Dense 或 MoE 前馈模块，得到下一 token 概率；新 token 追加到前缀继续生成。
  asset:
    src: /figures/qwen3/teaching-flow.svg
    width: 1200
    height: 450
    license: CC BY 4.0
    attribution: model-atlas-zh 贡献者；原创教学简图，非官方结构图。
