<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img"><title>Qwen3 因果生成教学图</title><desc>文字输入经过重复的 Transformer 层；每层包含因果注意力和前馈计算。Dense 与 MoE 是型号结构选择，图不表示完整执行追踪。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#39745f"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="#243b44"><text x="30" y="44" font-size="28" font-weight="650">Qwen3 初版 · 因果生成教学图（非官方层图）</text><rect x="260" y="75" width="660" height="245" rx="14" fill="#fafcfb" stroke="#8ab6a5" stroke-dasharray="7 5"/><text x="280" y="101" font-size="20" font-weight="650">下面两部分构成一层，按模型配置重复 N 层</text><rect x="30" y="120" width="200" height="180" rx="12" fill="#f0f7f3" stroke="#8ab6a5"/><text x="50" y="158" font-size="24" font-weight="650">文字输入</text><text x="50" y="202" font-size="18" font-weight="400">分词与嵌入</text><text x="50" y="244" font-size="18" font-weight="400">问题＋可见前缀</text><rect x="280" y="120" width="290" height="180" rx="12" fill="#f0f7f3" stroke="#8ab6a5"/><text x="300" y="158" font-size="24" font-weight="650">因果注意力</text><text x="300" y="202" font-size="18" font-weight="400">汇总可见位置的信息</text><text x="300" y="244" font-size="18" font-weight="400">GQA／RoPE／QK-Norm</text><rect x="620" y="120" width="280" height="180" rx="12" fill="#f0f7f3" stroke="#8ab6a5"/><text x="640" y="158" font-size="24" font-weight="650">前馈计算</text><text x="640" y="202" font-size="18" font-weight="400">Dense：稠密 FFN</text><text x="640" y="244" font-size="18" font-weight="400">或 MoE：选部分专家</text><rect x="950" y="120" width="220" height="180" rx="12" fill="#f0f7f3" stroke="#8ab6a5"/><text x="970" y="158" font-size="24" font-weight="650">输出分布</text><text x="970" y="202" font-size="18" font-weight="400">预测下一 token</text><text x="970" y="244" font-size="18" font-weight="400">按解码规则选择</text><path d="M235,210 L267,210" fill="none" stroke="#39745f" stroke-width="3" marker-end="url(#arrow)"/><path d="M575,210 L607,210" fill="none" stroke="#39745f" stroke-width="3" marker-end="url(#arrow)"/><path d="M905,210 L937,210" fill="none" stroke="#39745f" stroke-width="3" marker-end="url(#arrow)"/><path d="M1060,322 V365 H130 V307" fill="none" stroke="#39745f" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="270" y="410" font-size="20" font-weight="400">生成时将新 token 接回前缀；省略残差、归一化细节和各层参数。</text></g></svg>