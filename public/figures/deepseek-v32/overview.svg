<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="260" viewBox="0 0 1060 260" role="img" aria-labelledby="title desc"><title id="title">DeepSeek-V3.2 稀疏注意力教学示意</title><desc id="desc">当前查询和历史位置交给轻量索引器打分，选择候选历史位置，主注意力对选中位置精算，输出进入后续网络。</desc><rect width="1060" height="260" rx="16" fill="#f5faf8"/><g fill="#fff" stroke="#87b6a4"><rect x="20" y="70" width="175" height="80" rx="8"/><rect x="230" y="70" width="175" height="80" rx="8"/><rect x="440" y="70" width="175" height="80" rx="8"/><rect x="650" y="70" width="175" height="80" rx="8"/><rect x="860" y="70" width="175" height="80" rx="8"/></g><g font-family="sans-serif" text-anchor="middle" fill="#203b35"><text x="107" y="103" font-size="16">查询与历史表示</text><text x="318" y="100" font-size="16">轻量索引器</text><text x="318" y="125" font-size="14">给历史位置打分</text><text x="528" y="100" font-size="16">选择候选位置</text><text x="528" y="125" font-size="14">Top-k</text><text x="738" y="100" font-size="16">主注意力精算</text><text x="738" y="125" font-size="14">读取选中位置</text><text x="948" y="103" font-size="16">后续网络与输出</text><text x="530" y="220" font-size="13">教学简图：省略 MLA 投影、位置编码、残差与专家层；非官方原图。</text></g><g fill="none" stroke="#468b75" stroke-width="3" marker-end="url(#a)"><path d="M195 110H220"/><path d="M405 110H430"/><path d="M615 110H640"/><path d="M825 110H850"/></g><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#468b75"/></marker></defs></svg>
