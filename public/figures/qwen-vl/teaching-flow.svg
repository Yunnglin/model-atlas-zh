<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img"><title>Qwen2.5-VL 教学流程：一张发票怎样变成答案</title><desc>依据原始报告的教学简图，省略完整层内算子和视频路径；840乘560像素示例产生2400块、合并为600个视觉token。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#39745f"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="#243b44"><text x="30" y="44" font-size="28" font-weight="650">Qwen2.5-VL · 依据论文核对的教学流程图</text><rect x="30" y="85" width="330" height="325" rx="12" fill="#f0f7f3" stroke="#8ab6a5"/><text x="50" y="125" font-size="24" font-weight="650">输入：图像与问题</text><text x="50" y="170" font-size="18" font-weight="400">发票：840 × 560 像素</text><text x="50" y="212" font-size="18" font-weight="400">合计 108.00 ／ 税额 6.48</text><text x="50" y="254" font-size="18" font-weight="400">价税合计 114.48</text><text x="50" y="296" font-size="18" font-weight="400">问：含税一共付多少钱？</text><rect x="435" y="85" width="330" height="325" rx="12" fill="#f0f7f3" stroke="#8ab6a5"/><text x="455" y="125" font-size="24" font-weight="650">视觉编码与 Merger</text><text x="455" y="170" font-size="18" font-weight="400">14 × 14 → 2,400 个块</text><text x="455" y="212" font-size="18" font-weight="400">ViT：局部＋全局交流</text><text x="455" y="254" font-size="18" font-weight="400">2 × 2 合并 → 600 token</text><text x="455" y="296" font-size="18" font-weight="400">MLP：对齐输入维度</text><rect x="840" y="85" width="330" height="325" rx="12" fill="#f0f7f3" stroke="#8ab6a5"/><text x="860" y="125" font-size="24" font-weight="650">语言模型生成</text><text x="860" y="170" font-size="18" font-weight="400">视觉表示＋问题文字</text><text x="860" y="212" font-size="18" font-weight="400">Qwen2.5 因果语言模型</text><text x="860" y="254" font-size="18" font-weight="400">逐步生成答案</text><text x="860" y="296" font-size="18" font-weight="400">答：价税合计 114.48 元</text><path d="M370,240 L422,240" fill="none" stroke="#39745f" stroke-width="3" marker-end="url(#arrow)"/><path d="M775,240 L827,240" fill="none" stroke="#39745f" stroke-width="3" marker-end="url(#arrow)"/><text x="30" y="454" font-size="20" font-weight="400">图中尺寸、发票与答案是教学构造，未执行模型；600 不包含文字和特殊标记。</text><text x="30" y="494" font-size="18" font-weight="400">省略：位置编码细节、残差与归一化、各层算子、视频时间路径。</text></g></svg>