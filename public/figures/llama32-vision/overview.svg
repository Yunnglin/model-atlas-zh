<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 410" role="img" aria-labelledby="title desc"><title id="title">Llama 3.2 Vision 图像与文字连接示意</title><desc id="desc">图像经视觉编码器形成视觉表示，通过交叉注意力接入处理问题的 Llama 3.1 语言模型，生成文字回答。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#62978a"/></marker></defs><rect width="1050" height="410" rx="20" fill="#f5f9f8"/><text x="35" y="48" font-family="sans-serif" font-size="23" font-weight="700" fill="#173e45">让语言模型参考图像</text><g font-family="sans-serif" fill="#183e46"><rect x="35" y="92" width="172" height="88" rx="12" fill="#fff" stroke="#a3c6be"/><text x="54" y="126" font-size="18" font-weight="700">输入图表</text><text x="54" y="155" font-size="15">柱子、图例、标签</text><rect x="256" y="92" width="182" height="88" rx="12" fill="#e6f2ed" stroke="#89bba9"/><text x="275" y="126" font-size="18" font-weight="700">视觉编码器</text><text x="275" y="155" font-size="15">提取图像表示</text><rect x="486" y="92" width="225" height="88" rx="12" fill="#e7effc" stroke="#9cb6da"/><text x="505" y="126" font-size="18" font-weight="700">交叉注意力适配器</text><text x="505" y="155" font-size="15">向语言模型提供图像信息</text><rect x="35" y="231" width="172" height="88" rx="12" fill="#fff" stroke="#a3c6be"/><text x="54" y="265" font-size="18" font-weight="700">输入问题</text><text x="54" y="294" font-size="15">“哪个月最高？”</text><rect x="486" y="231" width="225" height="88" rx="12" fill="#e6f2ed" stroke="#89bba9"/><text x="505" y="265" font-size="18" font-weight="700">Llama 3.1 语言模型</text><text x="505" y="294" font-size="15">结合问题与图像生成文字</text><rect x="789" y="231" width="220" height="88" rx="12" fill="#fff4e6" stroke="#d9b778"/><text x="808" y="265" font-size="18" font-weight="700">文字答案</text><text x="808" y="294" font-size="15">需独立核对月份与数字</text></g><g stroke="#64988b" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M207 136 H254"/><path d="M438 136 H484"/><path d="M599 180 V229"/><path d="M207 275 H484"/><path d="M711 275 H787"/></g><text x="35" y="378" font-family="sans-serif" font-size="14" fill="#59736e">教学示意：省略具体网络层、图像预处理及生成细节，非官方逐层架构图。</text></svg>
