<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc"><title id="title">QwQ 预览版推理与验证</title><desc id="desc">题目经过分词和因果语言模型，逐步生成推理文本与答案，外部程序或人工可独立复核。</desc><rect width="1200" height="390" rx="20" fill="#f5f9f8"/><text x="45" y="50" font-family="sans-serif" font-size="24" font-weight="700" fill="#183a40">生成推理文字，再独立核对答案</text><g font-family="sans-serif" fill="#183a40" text-anchor="middle"><g fill="#fff" stroke="#a5c9c1" stroke-width="2"><rect x="45" y="105" width="180" height="100" rx="12"/><rect x="280" y="105" width="180" height="100" rx="12"/><rect x="515" y="105" width="230" height="100" rx="12"/><rect x="800" y="105" width="170" height="100" rx="12"/><rect x="1025" y="105" width="130" height="100" rx="12"/></g><g font-size="18" font-weight="700"><text x="135" y="144">问题与条件</text><text x="370" y="144">分词与输入</text><text x="630" y="144">因果语言模型</text><text x="885" y="144">推理与答案</text><text x="1090" y="144">外部复核</text></g><g font-size="15" fill="#4b676b"><text x="135" y="174">折扣顺序</text><text x="370" y="174">形成 token</text><text x="630" y="174">逐步生成后续 token</text><text x="885" y="174">可能出错或截断</text><text x="1090" y="174">程序或人工</text></g></g><g fill="none" stroke="#468d83" stroke-width="3" marker-end="url(#a)"><path d="M225 155h55"/><path d="M460 155h55"/><path d="M745 155h55"/><path d="M970 155h55"/></g><text x="45" y="285" font-family="sans-serif" font-size="16" fill="#4b676b">教学示意：模型生成推理文字；独立计算或测试需要外部系统实际执行。</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#468d83"/></marker></defs></svg>
