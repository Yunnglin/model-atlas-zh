<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" role="img" aria-labelledby="title desc">
<title id="title">MoE 中一个 token 的路由示例</title><desc id="desc">路由器从四个专家中选择专家一与专家三，各自计算后按权重零点六与零点四合并。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#087b7c"/></marker></defs><rect width="960" height="290" rx="18" fill="#f5f9f8"/>
<g font-family="system-ui, sans-serif" fill="#183b45"><text x="28" y="38" font-size="23" font-weight="700">MoE：每个 token 选择部分专家</text>
<g stroke="#c5ded8"><rect x="30" y="120" width="135" height="55" rx="10" fill="#fff"/><rect x="215" y="120" width="140" height="55" rx="10" fill="#fff"/><rect x="435" y="60" width="145" height="42" rx="8" fill="#dff3ee"/><rect x="435" y="112" width="145" height="42" rx="8" fill="#fff"/><rect x="435" y="164" width="145" height="42" rx="8" fill="#dff3ee"/><rect x="435" y="216" width="145" height="42" rx="8" fill="#fff"/><rect x="735" y="120" width="190" height="55" rx="10" fill="#fff"/></g>
<g fill="none" stroke="#087b7c" stroke-width="2.5" marker-end="url(#arrow)"><path d="M165 147 H207"/><path d="M355 137 L427 82"/><path d="M355 158 L427 185"/><path d="M580 82 L727 135"/><path d="M580 185 L727 160"/></g>
<g font-size="18"><text x="53" y="153">输入 token</text><text x="247" y="153">路由器</text><text x="461" y="87">专家 1 ✓</text><text x="461" y="139">专家 2</text><text x="461" y="191">专家 3 ✓</text><text x="461" y="243">专家 4</text><text x="765" y="153">加权合并输出</text></g>
<text x="610" y="91" font-size="15">权重 0.6</text><text x="610" y="196" font-size="15">权重 0.4</text><text x="30" y="273" font-size="14" fill="#526b72">教学示例：每个 token 的选择可能不同；实际模型可有共享专家。</text></g></svg>
