<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-labelledby="title desc">
<title id="title">RoPE 二维旋转示例</title><desc id="desc">假设每移动一个位置旋转 90 度，查询在位置零沿右，键在位置一朝上。点积由同向时的 1 变为 0。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#087b7c"/></marker></defs>
<rect width="900" height="280" rx="18" fill="#f5f9f8"/>
<g font-family="system-ui, sans-serif" fill="#183b45"><text x="30" y="40" font-size="23" font-weight="700">RoPE：把位置变成旋转角度</text><text x="30" y="70" font-size="16">教学示例：两个初始向量相同，假设每个位置旋转 90°</text>
<rect x="30" y="90" width="390" height="135" rx="10" fill="#fff" stroke="#c5ded8"/><rect x="480" y="90" width="390" height="135" rx="10" fill="#fff" stroke="#c5ded8"/>
<g stroke="#087b7c" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M85 185 H165"/><path d="M535 185 H615"/><path d="M535 185 V115"/></g>
<g font-size="17"><text x="190" y="138">位置相同：方向相同</text><text x="190" y="174">点积 = 1</text><text x="640" y="138">相隔一个位置：相差 90°</text><text x="640" y="174">点积 = 0</text></g>
<text x="30" y="258" font-size="15" fill="#526b72">真实模型使用多组维度与频率；查询和键的内容也会影响点积。</text></g></svg>
