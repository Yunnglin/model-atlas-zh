<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 245" role="img" aria-labelledby="title desc">
<title id="title">注意力加权求和示例</title><desc id="desc">两个位置的权重分别为 0.75 和 0.25，对应值为 2 和 6，加权结果为 3。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#087b7c"/></marker></defs><rect width="920" height="245" rx="18" fill="#f5f9f8"/>
<g font-family="system-ui,sans-serif" fill="#183b45"><text x="30" y="42" font-size="23" font-weight="700">注意力：先算权重，再汇总信息</text>
<g fill="#fff" stroke="#c5ded8"><rect x="30" y="80" width="230" height="90" rx="10"/><rect x="345" y="80" width="230" height="90" rx="10"/><rect x="660" y="80" width="230" height="90" rx="10"/></g>
<g font-size="17"><text x="50" y="113">两个匹配分数</text><text x="50" y="145">ln 3　和　0</text><text x="365" y="113">softmax 后的权重</text><text x="365" y="145">0.75　和　0.25</text><text x="680" y="113">值分别是 2 和 6</text><text x="680" y="145">加权结果 = 3</text></g>
<g fill="none" stroke="#087b7c" stroke-width="2.5" marker-end="url(#a)"><path d="M270 125 H335"/><path d="M585 125 H650"/></g><text x="30" y="211" font-size="15" fill="#526b72">教学示例：真实模型对向量计算，并通常并行使用多个注意力头。</text></g></svg>
