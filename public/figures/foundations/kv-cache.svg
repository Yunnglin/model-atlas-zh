<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 255" role="img" aria-labelledby="title desc">
<title id="title">KV Cache 的建立与复用</title><desc id="desc">提示词 A、B 经预填充产生它们的键值缓存；处理后续 token C 时复用旧缓存、添加 C 的键值，再预测 D。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#087b7c"/></marker></defs><rect width="960" height="255" rx="18" fill="#f5f9f8"/>
<g font-family="system-ui,sans-serif" fill="#183b45"><text x="30" y="42" font-size="23" font-weight="700">KV Cache：已经算过的键和值可以复用</text>
<g fill="#fff" stroke="#c5ded8"><rect x="30" y="80" width="190" height="90" rx="10"/><rect x="275" y="80" width="190" height="90" rx="10"/><rect x="520" y="80" width="190" height="90" rx="10"/><rect x="765" y="80" width="165" height="90" rx="10"/></g>
<g font-size="17"><text x="50" y="112">预填充</text><text x="50" y="145">读入 A、B</text><text x="295" y="112">建立缓存</text><text x="295" y="145">保存 A、B 的 K/V</text><text x="540" y="112">处理新 token C</text><text x="540" y="145">复用并追加 C 的 K/V</text><text x="785" y="112">继续生成</text><text x="785" y="145">预测 D</text></g>
<g fill="none" stroke="#087b7c" stroke-width="2.5" marker-end="url(#arrow)"><path d="M225 125 H265"/><path d="M470 125 H510"/><path d="M715 125 H755"/></g><text x="30" y="215" font-size="15" fill="#526b72">每层维护自己的缓存；图中 A、B、C、D 是示意 token。</text></g></svg>
