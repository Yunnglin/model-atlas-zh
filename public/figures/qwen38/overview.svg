<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="300" viewBox="0 0 1060 300" role="img" aria-labelledby="title desc"><title id="title">Qwen3.8 两种开放型号</title><desc id="desc">27B 接收图文视频，使用稠密混合注意力；2.4T-A95B 权重接收文本，使用混合注意力和专家路由。</desc><rect width="1060" height="300" rx="18" fill="#f4f8f7"/><g font-family="system-ui, sans-serif" fill="#17364b"><text x="30" y="40" font-size="20" font-weight="700">Qwen3.8：先分清两个开放型号</text><text x="30" y="68" font-size="14">教学示意：仅展示输入与语言骨干差异，省略网络层内细节</text></g><g fill="#fff" stroke="#9ecac3" stroke-width="2"><rect x="32" y="96" width="475" height="126" rx="12"/><rect x="553" y="96" width="475" height="126" rx="12"/></g><g font-family="system-ui, sans-serif" fill="#17364b"><text x="55" y="128" font-size="18" font-weight="700">27B · 稠密视觉语言模型</text><text x="55" y="160" font-size="15">文字直入；图片、视频 → 视觉编码</text><text x="55" y="190" font-size="15">汇合 → 混合注意力 + 稠密前馈层 → 文本</text><text x="576" y="128" font-size="18" font-weight="700">2.4T-A95B · 稀疏专家文本模型</text><text x="576" y="160" font-size="15">文本 → 混合注意力 + 专家路由 → 文本</text><text x="576" y="190" font-size="15">总参数 2.4T，官方标注激活 95B</text></g><text x="32" y="267" fill="#52716d" font-family="system-ui, sans-serif" font-size="14">云服务可能提供额外能力；工具请求需要外部执行与核验。</text></svg>
