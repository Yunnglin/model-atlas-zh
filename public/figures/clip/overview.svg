<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="260" viewBox="0 0 1060 260" role="img" aria-labelledby="title desc"><title id="title">CLIP 双编码器和图文对比示意</title><desc id="desc">猫图片和猫描述分别进入图像编码器及文字编码器，得到归一化向量后比较相似度。</desc><rect width="1060" height="260" rx="16" fill="#f5f9f7"/><text x="30" y="36" fill="#193d38" font-size="20" font-family="sans-serif" font-weight="bold">CLIP：图片和文字分别编码，再比较匹配程度（教学示意）</text><g font-family="sans-serif" fill="#183a35" text-anchor="middle"><rect x="30" y="64" width="160" height="58" rx="10" fill="#fff" stroke="#86aaa0"/><text x="110" y="100" font-size="17">猫图片</text><rect x="30" y="150" width="160" height="58" rx="10" fill="#fff" stroke="#86aaa0"/><text x="110" y="186" font-size="17">“一只猫”</text><rect x="246" y="64" width="170" height="58" rx="10" fill="#e6f3ef" stroke="#77aa99"/><text x="331" y="100" font-size="17">图像编码器</text><rect x="246" y="150" width="170" height="58" rx="10" fill="#f1ecfa" stroke="#aa9ac5"/><text x="331" y="186" font-size="17">文本编码器</text><rect x="472" y="64" width="165" height="58" rx="10" fill="#fff" stroke="#86aaa0"/><text x="554" y="100" font-size="17">图像向量</text><rect x="472" y="150" width="165" height="58" rx="10" fill="#fff" stroke="#86aaa0"/><text x="554" y="186" font-size="17">文本向量</text><rect x="723" y="103" width="270" height="67" rx="10" fill="#fff5e8" stroke="#c9a679"/><text x="858" y="132" font-size="17">相似度比较</text><text x="858" y="155" font-size="14">同批次双向对比训练</text></g><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#527f73"/></marker></defs><g stroke="#527f73" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M190 93h56"/><path d="M190 179h56"/><path d="M416 93h56"/><path d="M416 179h56"/><path d="M637 93h40l46 35"/><path d="M637 179h40l46 -35"/></g><text x="530" y="239" text-anchor="middle" fill="#52706a" font-size="13" font-family="sans-serif">图示仅展示一对输入；训练还需比较同批次其他配对，并非官方结构图</text></svg>
