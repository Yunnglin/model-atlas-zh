<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 345" role="img" aria-labelledby="title desc"><title id="title">MiniMax M3 的稀疏注意力示意</title><desc id="desc">文本、图片和视频经输入处理后进入语言模型。稀疏层中的索引分支选择上下文块，主注意力读取选中内容；专家前馈及后续层参与计算，最终生成文本或工具请求。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#527a73"/></marker></defs><rect width="1080" height="345" rx="20" fill="#f5f9f7"/><g font-family="system-ui,sans-serif" fill="#163e39"><text x="28" y="37" font-size="22" font-weight="700">M3：先选择上下文块，再计算注意力</text><rect x="220" y="54" width="850" height="225" rx="14" fill="none" stroke="#99b7ac" stroke-dasharray="6 4"/><text x="235" y="298" font-size="14" fill="#526a67">语言模型中的稀疏层及后续计算（简化）</text><g font-size="16"><rect x="30" y="113" width="150" height="75" rx="10" fill="#e2f1ea"/><text x="50" y="143">文本 / 图片</text><text x="50" y="166">/ 视频输入</text><rect x="240" y="72" width="210" height="76" rx="10" fill="#e2edef"/><text x="258" y="102">索引分支：为各组</text><text x="258" y="126">选择相关 KV 块</text><rect x="240" y="188" width="210" height="76" rx="10" fill="#f0e9dc"/><text x="258" y="218">上下文分块</text><text x="258" y="242">保留当前所在块</text><rect x="520" y="113" width="225" height="75" rx="10" fill="#d9ebe3"/><text x="538" y="143">主注意力分支</text><text x="538" y="166">只计算选中块内内容</text><rect x="805" y="113" width="245" height="75" rx="10" fill="#e4eff1"/><text x="823" y="143">专家前馈与后续层</text><text x="823" y="166">最终生成文本 / 工具请求</text></g><g fill="none" stroke="#527a73" stroke-width="2.5" marker-end="url(#arrow)"><path d="M180 140H240"/><path d="M180 162H210V226H240"/><path d="M450 110H485V137H520"/><path d="M450 226H485V163H520"/><path d="M745 150H805"/></g><text x="30" y="318" font-size="14" fill="#526a67">教学简图：仅展示稀疏层示意；前三层为全注意力，视觉编码与外部工具流程已简化。</text></g></svg>
