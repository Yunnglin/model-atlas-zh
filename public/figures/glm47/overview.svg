<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="260" viewBox="0 0 1060 260" role="img" aria-labelledby="title desc"><title id="title">GLM-4.7 交错思考与工具交互</title><desc id="desc">用户需求进入模型，模型按需思考并请求工具，外部工具返回结果，模型继续处理并给出回答。</desc><rect width="1060" height="260" rx="16" fill="#f5faf8"/><g fill="#fff" stroke="#87b6a4"><rect x="20" y="65" width="170" height="90" rx="8"/><rect x="225" y="65" width="220" height="90" rx="8"/><rect x="480" y="65" width="230" height="90" rx="8"/><rect x="745" y="65" width="295" height="90" rx="8"/></g><g font-family="sans-serif" text-anchor="middle" fill="#203b35"><text x="105" y="100" font-size="16">用户与上下文</text><text x="105" y="125" font-size="13">任务、文件、历史记录</text><text x="335" y="100" font-size="16">模型思考与决策</text><text x="335" y="125" font-size="13">按轮控制思考模式</text><text x="595" y="100" font-size="16">外部工具</text><text x="595" y="125" font-size="13">真实运行并返回结果</text><text x="892" y="100" font-size="16">继续处理与回答</text><text x="892" y="125" font-size="13">必要时保留思考块</text><text x="530" y="220" font-size="13">教学简图：工具调用和思考保留由应用配置，省略模型层内结构及权限检查。</text></g><g fill="none" stroke="#468b75" stroke-width="3" marker-end="url(#a)"><path d="M190 110H215"/><path d="M445 100H470"/><path d="M480 135H455"/><path d="M335 155V185H892V165"/></g><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#468b75"/></marker></defs></svg>
