<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="300" viewBox="0 0 1060 300" role="img" aria-labelledby="title desc">
<title id="title">BERT 阅读和任务输出示意</title><desc id="desc">文字分词后进入双向编码器，输出每个位置的上下文向量，再按任务交给不同的输出头。</desc>
<rect width="1060" height="300" rx="18" fill="#f4f8f7"/><g font-family="system-ui, sans-serif" fill="#17364b"><text x="32" y="42" font-size="20" font-weight="700">BERT：读完整段，再按任务答题</text><text x="32" y="72" font-size="14">教学示意：省略各层内部细节；输出头通常需针对任务微调</text></g>
<g fill="#fff" stroke="#9ecac3" stroke-width="2"><rect x="35" y="112" width="220" height="104" rx="12"/><rect x="330" y="100" width="280" height="128" rx="12"/><rect x="685" y="96" width="334" height="136" rx="12"/></g>
<g font-family="system-ui, sans-serif" fill="#17364b" text-anchor="middle"><text x="145" y="148" font-size="18" font-weight="700">文字 + 特殊标记</text><text x="145" y="180" font-size="15">[CLS] 内容 [SEP]</text><text x="470" y="140" font-size="18" font-weight="700">双向 Transformer 编码器</text><text x="470" y="174" font-size="15">每个位置参考左右上下文</text><text x="470" y="200" font-size="14">输出逐 token 表示</text><text x="852" y="132" font-size="18" font-weight="700">任务头</text><text x="852" y="164" font-size="15">[CLS] → 句子分类</text><text x="852" y="190" font-size="15">每个位置 → 实体或答案边界</text></g>
<g fill="none" stroke="#168779" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M 260 164 H 316 M 307 156 L 316 164 L 307 172"/><path d="M 615 164 H 671 M 662 156 L 671 164 L 662 172"/></g>
<text x="35" y="268" fill="#52716d" font-family="system-ui, sans-serif" font-size="14">预训练：遮盖预测 + 下一句预测；任务输出并非无需标注即可保证可靠。</text></svg>
