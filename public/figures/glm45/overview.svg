<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="260" viewBox="0 0 1060 260" role="img" aria-labelledby="title desc"><title id="title">GLM-4.5 专家模型迭代与工具交互</title><desc id="desc">基础模型经过推理、智能体和通用专家训练，统一模型学习其输出，应用按需调用外部工具并反馈结果。</desc><rect width="1060" height="260" rx="16" fill="#f5faf8"/><g fill="#fff" stroke="#87b6a4"><rect x="20" y="65" width="185" height="90" rx="8"/><rect x="240" y="65" width="250" height="90" rx="8"/><rect x="525" y="65" width="220" height="90" rx="8"/><rect x="780" y="65" width="260" height="90" rx="8"/></g><g font-family="sans-serif" text-anchor="middle" fill="#203b35"><text x="112" y="100" font-size="16">基础模型</text><text x="112" y="125" font-size="13">预训练与中期训练</text><text x="365" y="100" font-size="16">任务专家模型</text><text x="365" y="125" font-size="13">推理 / 智能体 / 通用</text><text x="635" y="100" font-size="16">统一模型</text><text x="635" y="125" font-size="13">学习多种任务能力</text><text x="910" y="100" font-size="16">外部工具与环境</text><text x="910" y="125" font-size="13">按需调用并返回结果</text><text x="530" y="220" font-size="13">教学简图：任务专家模型与 MoE 层内路由专家不同；省略多轮交互和训练细节。</text></g><g fill="none" stroke="#468b75" stroke-width="3" marker-end="url(#a)"><path d="M205 110H230"/><path d="M490 110H515"/><path d="M745 110H770"/><path d="M910 155V185H635V160"/></g><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#468b75"/></marker></defs></svg>
