<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="260" viewBox="0 0 1060 260" role="img" aria-labelledby="title desc">
<title id="title">GLM-5.1 长任务交互示意</title><desc id="desc">需求和工具结果进入混合专家语言模型，模型发出工具请求，外部执行器返回真实结果，模型再根据结果继续生成。</desc><rect width="1060" height="260" rx="16" fill="#f5f9f7"/><text x="30" y="37" fill="#193d38" font-size="20" font-family="sans-serif" font-weight="bold">GLM-5.1：模型与工具共同完成长任务（教学示意）</text>
<g font-family="sans-serif" text-anchor="middle" fill="#183a35"><rect x="28" y="78" width="160" height="84" rx="12" fill="#fff" stroke="#86aaa0"/><text x="108" y="110" font-size="17">需求与历史</text><text x="108" y="138" font-size="14">文本 / 工具结果</text><rect x="238" y="78" width="220" height="84" rx="12" fill="#e6f3ef" stroke="#77aa99"/><text x="348" y="110" font-size="17">稀疏注意力 + MoE</text><text x="348" y="138" font-size="14">选择线索、路由专家</text><rect x="508" y="78" width="165" height="84" rx="12" fill="#fff" stroke="#86aaa0"/><text x="590" y="110" font-size="17">生成请求</text><text x="590" y="138" font-size="14">读取 / 修改 / 测试</text><rect x="723" y="78" width="155" height="84" rx="12" fill="#fff5e8" stroke="#c9a679"/><text x="800" y="110" font-size="17">外部执行器</text><text x="800" y="138" font-size="14">检查权限并执行</text><rect x="918" y="78" width="112" height="84" rx="12" fill="#f1ecfa" stroke="#aa9ac5"/><text x="974" y="110" font-size="17">验证结果</text><text x="974" y="138" font-size="14">日志与测试</text></g><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#527f73"/></marker></defs><g stroke="#527f73" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M188 120h44"/><path d="M458 120h44"/><path d="M673 120h44"/><path d="M878 120h34"/><path d="M974 164v42H108v-38"/></g><text x="530" y="232" text-anchor="middle" fill="#52706a" font-size="14" font-family="sans-serif">真实结果返回后再调整；图为简化说明，并非官方架构图</text></svg>
