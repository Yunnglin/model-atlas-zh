<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" role="img" aria-labelledby="title desc"><title id="title">wav2vec 2.0 自监督预训练与识别微调</title><desc id="desc">原始语音经过卷积编码后分成两支，一支遮盖后经 Transformer 得到上下文表示，另一支量化成目标，二者用于对比训练。识别微调在 Transformer 后接线性分类层，以 CTC 训练并解码得到文字。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#507a72"/></marker></defs><rect width="1100" height="380" rx="20" fill="#f6f9f8"/><g font-family="system-ui,sans-serif" fill="#173d3a"><text x="30" y="40" font-size="22" font-weight="700">预训练：从声音本身生成学习目标</text><g font-size="16"><rect x="28" y="105" width="135" height="70" rx="9" fill="#e4f1eb"/><text x="52" y="147">语音波形</text><rect x="215" y="105" width="160" height="70" rx="9" fill="#e2eef0"/><text x="235" y="135">卷积编码器</text><text x="235" y="157">连续特征 z</text><rect x="440" y="55" width="195" height="70" rx="9" fill="#e0eee8"/><text x="459" y="85">遮盖 + Transformer</text><text x="459" y="107">上下文表示 c</text><rect x="440" y="165" width="195" height="70" rx="9" fill="#f2eadd"/><text x="459" y="195">量化器：未遮盖 z</text><text x="459" y="217">目标向量 q</text><rect x="715" y="100" width="300" height="85" rx="9" fill="#e4eff1"/><text x="735" y="131">对比训练：正确目标</text><text x="735" y="154">与同一句中的干扰项比较</text><rect x="215" y="280" width="800" height="55" rx="9" fill="#edf2eb"/><text x="237" y="314">识别：波形 → 卷积 + Transformer → 线性层 → CTC 解码 → 文字</text></g><g fill="none" stroke="#507a72" stroke-width="2.5" marker-end="url(#a)"><path d="M163 140H215"/><path d="M375 125H410V90H440"/><path d="M375 155H410V200H440"/><path d="M635 90H670V125H715"/><path d="M635 200H670V160H715"/></g></g></svg>
