<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="260" viewBox="0 0 1060 260" role="img" aria-labelledby="title desc"><title id="title">GPT-2 文本生成示意</title><desc id="desc">输入文本变为 token 和位置向量，经多层因果 Transformer 得到下一 token 的概率，选择 token 后接回前文循环。</desc><rect width="1060" height="260" rx="16" fill="#f5f9f7"/><text x="30" y="37" fill="#193d38" font-size="20" font-family="sans-serif" font-weight="bold">GPT-2：从前文预测下一个 token（教学示意）</text><g font-family="sans-serif" text-anchor="middle" fill="#183a35"><rect x="28" y="78" width="155" height="84" rx="12" fill="#fff" stroke="#86aaa0"/><text x="105" y="110" font-size="17">输入前文</text><text x="105" y="138" font-size="14">文本 → token</text><rect x="233" y="78" width="155" height="84" rx="12" fill="#e6f3ef" stroke="#77aa99"/><text x="310" y="110" font-size="17">词与位置嵌入</text><text x="310" y="138" font-size="14">编号 → 向量</text><rect x="438" y="78" width="180" height="84" rx="12" fill="#f1ecfa" stroke="#aa9ac5"/><text x="528" y="110" font-size="17">因果 Transformer</text><text x="528" y="138" font-size="14">只读取当前位置及之前</text><rect x="668" y="78" width="165" height="84" rx="12" fill="#fff5e8" stroke="#c9a679"/><text x="750" y="110" font-size="17">词表概率</text><text x="750" y="138" font-size="14">选择下一个 token</text><rect x="883" y="78" width="145" height="84" rx="12" fill="#fff" stroke="#86aaa0"/><text x="955" y="110" font-size="17">接回前文</text><text x="955" y="138" font-size="14">继续生成</text></g><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#527f73"/></marker></defs><g stroke="#527f73" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M183 120h44"/><path d="M388 120h44"/><path d="M618 120h44"/><path d="M833 120h44"/><path d="M955 164v42H105v-38"/></g><text x="530" y="232" text-anchor="middle" fill="#52706a" font-size="14" font-family="sans-serif">图示省略残差、归一化与缓存细节；并非官方结构图</text></svg>
