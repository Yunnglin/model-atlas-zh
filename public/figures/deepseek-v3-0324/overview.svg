<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc"><title id="title">DeepSeek-V3-0324 生成与工具请求示意</title><desc id="desc">文字通过因果模型的注意力和专家层生成回答或工具请求；请求由外部系统执行并返回结果。</desc><rect width="1200" height="390" rx="20" fill="#f5faf8"/><g font-family="sans-serif" fill="#193b38"><text x="35" y="48" font-size="24" font-weight="700">从需求到回答：工具由应用执行</text><g fill="#fff" stroke="#96beb4"><rect x="35" y="98" width="180" height="120" rx="12"/><rect x="275" y="98" width="240" height="120" rx="12"/><rect x="575" y="98" width="205" height="120" rx="12"/><rect x="840" y="98" width="250" height="120" rx="12"/></g><g text-anchor="middle" font-size="18"><text x="125" y="140">用户需求</text><text x="125" y="176" font-size="15">网页与库存问题</text><text x="395" y="140">V3 架构模型</text><text x="395" y="176" font-size="15">MLA + 前馈 / MoE</text><text x="677" y="140">文字或工具请求</text><text x="677" y="176" font-size="15">逐 token 生成</text><text x="965" y="140">外部工具</text><text x="965" y="176" font-size="15">执行查询、返回结果</text></g><g fill="none" stroke="#43877a" stroke-width="3" marker-end="url(#arrow)"><path d="M215 158h50"/><path d="M515 158h50"/><path d="M780 158h50"/></g><text x="35" y="285" font-size="17">模型不会自行运行工具；应用需验证权限与返回结果。</text><text x="35" y="320" font-size="15" fill="#57756e">原创教学简图：省略层间残差、投影和路由细节；不代表实际运行。</text></g><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#43877a"/></marker></defs></svg>
