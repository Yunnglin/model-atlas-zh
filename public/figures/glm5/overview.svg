<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="260" viewBox="0 0 1060 260" role="img" aria-labelledby="title desc">
<title id="title">GLM-5 结构与工具交互示意</title><desc id="desc">文本进入模型，索引器挑选历史位置供稀疏注意力读取，混合专家按需计算，输出文本或交给外部执行器的工具请求；工具结果返回模型。</desc>
<rect width="1060" height="260" rx="16" fill="#f5f9f7"/><text x="30" y="37" fill="#193d38" font-size="20" font-family="sans-serif" font-weight="bold">GLM-5：从长上下文到工具交互（教学示意）</text>
<g font-family="sans-serif" text-anchor="middle" fill="#183a35"><rect x="28" y="78" width="150" height="84" rx="12" fill="#fff" stroke="#86aaa0"/><text x="103" y="111" font-size="17">文本 / 工具结果</text><text x="103" y="139" font-size="14">分成 token</text><rect x="224" y="78" width="215" height="84" rx="12" fill="#e6f3ef" stroke="#77aa99"/><text x="331" y="110" font-size="17">索引器 + 稀疏注意力</text><text x="331" y="138" font-size="14">选位置，再读取线索</text><rect x="485" y="78" width="150" height="84" rx="12" fill="#f1ecfa" stroke="#aa9ac5"/><text x="560" y="110" font-size="17">混合专家</text><text x="560" y="138" font-size="14">路由后按需计算</text><rect x="681" y="78" width="150" height="84" rx="12" fill="#fff" stroke="#86aaa0"/><text x="756" y="110" font-size="17">输出 token</text><text x="756" y="138" font-size="14">回答或工具请求</text><rect x="877" y="78" width="150" height="84" rx="12" fill="#fff5e8" stroke="#c9a679"/><text x="952" y="110" font-size="17">外部执行器</text><text x="952" y="138" font-size="14">检查权限并运行</text></g>
<g stroke="#527f73" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M178 120h40"/><path d="M439 120h40"/><path d="M635 120h40"/><path d="M831 120h40"/><path d="M952 163v43H103v-39"/></g><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#527f73"/></marker></defs><text x="530" y="231" text-anchor="middle" fill="#52706a" font-size="14" font-family="sans-serif">工具结果由执行器返回；图为简化说明，并非官方架构图</text></svg>
