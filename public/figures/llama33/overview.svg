<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
<title id="title">Llama 3.3 70B Instruct 文本生成示意</title><desc id="desc">文本输入经分词后进入自回归 Transformer，采用分组查询注意力并逐 token 生成文本或代码。128K 是上下文窗口，405B 是单独的 Llama 3.1 对照模型。</desc>
<rect width="1000" height="300" rx="20" fill="#f4f8f7"/><g font-family="sans-serif" fill="#19313d"><text x="40" y="42" font-size="23" font-weight="700">Llama 3.3 70B Instruct：文本生成示意</text><text x="40" y="72" font-size="15">教学简图，省略逐层细节；不是官方架构图</text>
<g fill="#fff" stroke="#7ca89e" stroke-width="2"><rect x="40" y="105" width="180" height="76" rx="10"/><rect x="270" y="105" width="315" height="76" rx="10"/><rect x="635" y="105" width="220" height="76" rx="10"/></g><g font-size="19" text-anchor="middle"><text x="130" y="138">输入文本</text><text x="130" y="162" font-size="14">分词 → token</text><text x="427" y="138">自回归 Transformer · 70B</text><text x="427" y="162" font-size="14">GQA · 根据已有 token 预测下一个</text><text x="745" y="138">输出文本 / 代码</text><text x="745" y="162" font-size="14">逐 token 生成</text></g><g stroke="#397e72" stroke-width="3" fill="none"><path d="M220 143h42m-10-6 10 6-10 6M585 143h42m-10-6 10 6-10 6"/><path d="M745 190v28H427v-28" stroke-dasharray="6 6"/></g><text x="40" y="255" font-size="16">上下文窗口：128K token；窗口够长不代表每个位置都能准确检索。</text><text x="40" y="279" font-size="15">评测中的 405B 属于 Llama 3.1，是独立比较对象，不是 Llama 3.3 权重。</text></g></svg>
