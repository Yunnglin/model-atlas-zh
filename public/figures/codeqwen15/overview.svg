<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="250" viewBox="0 0 1060 250" role="img" aria-labelledby="title desc"><title id="title">CodeQwen1.5 代码生成教学简图</title><desc id="desc">代码或指令经过分词与因果解码器生成文字或代码；工具执行属于模型外部。</desc><rect width="1060" height="250" rx="16" fill="#f5faf8"/><g font-family="sans-serif" text-anchor="middle" fill="#203b35"><g fill="#fff" stroke="#87b6a4"><rect x="20" y="70" width="155" height="70" rx="8"/><rect x="215" y="70" width="145" height="70" rx="8"/><rect x="400" y="35" width="275" height="140" rx="8"/><rect x="715" y="70" width="145" height="70" rx="8"/><rect x="900" y="70" width="140" height="70" rx="8"/></g><text x="98" y="112" font-size="16">代码 / 问题</text><text x="287" y="112" font-size="16">分词</text><text x="537" y="80" font-size="17">CodeQwen1.5 因果解码器</text><text x="537" y="112" font-size="15">注意力 / 前馈网络</text><text x="537" y="140" font-size="15">逐 token 预测</text><text x="787" y="112" font-size="16">代码或文字</text><text x="970" y="100" font-size="16">外部工具</text><text x="970" y="125" font-size="13">可选：运行测试</text><text x="530" y="222" font-size="13">教学简图：省略归一化、残差与参数细节；外部工具不属于模型。</text></g><g fill="none" stroke="#468b75" stroke-width="3" marker-end="url(#a)"><path d="M175 105H215"/><path d="M360 105H400"/><path d="M675 105H715"/><path d="M860 105H900"/></g><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#468b75"/></marker></defs></svg>
