<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" role="img" aria-labelledby="title desc"><title id="title">Llama 3.2 轻量文本模型训练示意</title><desc id="desc">从 Llama 3.1 8B 进行结构化剪枝，使用 8B 和 70B 教师 token 分数蒸馏，经过后训练得到 1B 与 3B 文本助手，再根据需求选用量化版本。</desc><rect width="1100" height="400" rx="20" fill="#f5f9f8"/><text x="35" y="48" font-family="sans-serif" font-size="23" font-weight="700" fill="#183e46">从较大模型到轻量文本助手</text><g font-family="sans-serif" fill="#183e46"><rect x="35" y="115" width="190" height="105" rx="12" fill="#fff" stroke="#a1c7bb"/><text x="53" y="150" font-size="18" font-weight="700">Llama 3.1 8B</text><text x="53" y="180" font-size="15">一次结构化剪枝</text><rect x="282" y="115" width="185" height="105" rx="12" fill="#e3f1eb" stroke="#88b9a8"/><text x="301" y="150" font-size="18" font-weight="700">较小网络</text><text x="301" y="180" font-size="15">1B / 3B 规模</text><rect x="520" y="115" width="225" height="105" rx="12" fill="#e8effb" stroke="#a6bbdc"/><text x="539" y="150" font-size="18" font-weight="700">继续训练与蒸馏</text><text x="539" y="180" font-size="15">8B / 70B 教师 logits</text><rect x="798" y="115" width="260" height="105" rx="12" fill="#fff" stroke="#a1c7bb"/><text x="817" y="150" font-size="18" font-weight="700">后训练 → 指令版</text><text x="817" y="180" font-size="15">SFT、拒绝采样、DPO</text><rect x="798" y="260" width="260" height="78" rx="12" fill="#fff4e6" stroke="#d8b57b"/><text x="817" y="292" font-size="17" font-weight="700">按版本评测设备表现</text><text x="817" y="319" font-size="14">核对精度、上下文、速度与质量</text></g><g stroke="#64968b" stroke-width="3" fill="none"><path d="M225 168 H280"/><path d="M467 168 H518"/><path d="M745 168 H796"/><path d="M928 220 V258"/></g><text x="35" y="370" font-family="sans-serif" font-size="14" fill="#59736e">教学示意：省略数据混合与多轮训练细节；蒸馏和量化是不同步骤。</text></svg>
