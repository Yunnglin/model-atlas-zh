<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">DeepSeek-V2.5 从需求到代码与工具</title><desc id="desc">问题通过 V2 架构的注意力与专家网络生成回答、代码或工具请求，外部应用可选择执行代码或工具请求并检验结果。</desc><rect width="1200" height="400" rx="20" fill="#f5faf8"/><g font-family="sans-serif" fill="#193b38"><text x="35" y="48" font-size="24" font-weight="700">一个模型组织回答，外部系统负责执行</text><g fill="#fff" stroke="#96beb4"><rect x="35" y="100" width="180" height="120" rx="12"/><rect x="270" y="100" width="255" height="120" rx="12"/><rect x="580" y="100" width="220" height="120" rx="12"/><rect x="855" y="100" width="280" height="120" rx="12"/></g><g text-anchor="middle" font-size="18"><text x="125" y="142">订单与代码需求</text><text x="125" y="178" font-size="15">文字 / 代码前后文</text><text x="397" y="142">DeepSeek-V2 主干</text><text x="397" y="178" font-size="15">MLA + 稠密 / MoE 层</text><text x="690" y="142">生成内容</text><text x="690" y="178" font-size="15">回答 / 代码 / 工具请求</text><text x="995" y="142">可选：外部系统执行</text><text x="995" y="178" font-size="15">订单接口 / 测试脚本</text></g><g fill="none" stroke="#43877a" stroke-width="3" marker-end="url(#arrow)"><path d="M215 160h45"/><path d="M525 160h45"/><path d="M800 160h45"/><path d="M995 220V250H397V225"/></g><text x="610" y="272" font-size="14">工具结果返回模型</text><text x="35" y="287" font-size="17">回答可直接交给用户；工具请求需外部执行，代码仍需独立测试。</text><text x="35" y="326" font-size="15" fill="#57756e">原创教学示意：省略注意力投影、路由和具体模板；不代表一次实际调用。</text></g><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#43877a"/></marker></defs></svg>
