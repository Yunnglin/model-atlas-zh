<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 280" role="img" aria-labelledby="title desc"><title id="title">Kimi k1.5 训练与推理示意</title><desc id="desc">文字与图片经过模型生成解答，训练时用验证反馈更新模型，推理时仅生成回答。</desc><rect width="1060" height="280" rx="18" fill="#f4f8f7"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#42857c"/></marker></defs><g font-family="sans-serif" text-anchor="middle" fill="#183b43"><g fill="#fff" stroke="#b6d2cd" stroke-width="2"><rect x="30" y="66" width="150" height="70" rx="10"/><rect x="228" y="66" width="200" height="70" rx="10"/><rect x="478" y="66" width="150" height="70" rx="10"/><rect x="678" y="66" width="165" height="70" rx="10"/><rect x="865" y="175" width="165" height="70" rx="10"/></g><g font-size="16" font-weight="600"><text x="105" y="96">文字题 / 图片</text><text x="105" y="119" font-size="13">训练或推理输入</text><text x="328" y="96">视觉编码 + 解码器</text><text x="328" y="119" font-size="13">多模态模型</text><text x="553" y="96">生成解答</text><text x="553" y="119" font-size="13">长或短推理</text><text x="760" y="96">结果验证</text><text x="760" y="119" font-size="13">训练时提供奖励</text><text x="948" y="204">策略更新</text><text x="948" y="227" font-size="13">仅训练时</text></g><g stroke="#42857c" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M180 101H228"/><path d="M428 101H478"/><path d="M628 101H678"/><path d="M843 101H948V175"/><path d="M865 210H328V136"/></g><text x="530" y="261" font-size="13" fill="#53736e">教学示意 · 验证和策略更新属于训练，实际推理不执行这一步</text></g></svg>
