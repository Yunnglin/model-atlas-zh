<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="300" viewBox="0 0 1060 300" role="img" aria-labelledby="title desc"><title id="title">原始 GLM 填空与 ChatGLM 对话示意</title><desc id="desc">原始 GLM 利用空白前后的已知文字，自回归生成缺失片段；ChatGLM 将对话历史和用户指令组织为输入，生成回答。</desc><rect width="1060" height="300" rx="18" fill="#f4f8f7"/><text x="32" y="42" font-family="sans-serif" font-size="23" font-weight="700" fill="#173b3d">从填空目标到对话应用：两个不同层次</text><g font-family="sans-serif" fill="#173b3d"><text x="35" y="90" font-size="16" font-weight="700">原始 GLM 训练示意</text><rect x="35" y="108" width="365" height="55" rx="10" fill="#fff" stroke="#a8c7c4"/><text x="55" y="142" font-size="16">我在［空白］买了咖啡</text><rect x="490" y="108" width="260" height="55" rx="10" fill="#dcefeb" stroke="#67a59c"/><text x="510" y="142" font-size="16">按顺序生成：楼下 → 新店</text><path d="M405 135h75" stroke="#357f77" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="35" y="207" font-size="16" font-weight="700">ChatGLM 对话示意</text><rect x="35" y="224" width="365" height="50" rx="10" fill="#fff" stroke="#a8c7c4"/><text x="55" y="255" font-size="15">对话历史 + 用户请求 + 模板</text><rect x="490" y="224" width="260" height="50" rx="10" fill="#dcefeb" stroke="#67a59c"/><text x="510" y="255" font-size="15">语言模型逐步生成回答</text><path d="M405 249h75" stroke="#357f77" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="787" y="142" font-size="13" fill="#4b6666">输入上下文含空白两侧</text><text x="787" y="255" font-size="13" fill="#4b6666">具体格式随版本不同</text></g><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#357f77"/></marker></defs></svg>
