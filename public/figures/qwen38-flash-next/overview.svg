<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Qwen3.8-Flash-Next 教学结构图</title><desc id="desc">文字、图片及视频帧分别编码后进入语言骨干。骨干有三层 Gated DeltaNet 与一层 QSA 的循环布局、每层 MoE 和四路门控残差；额外 N-gram 查表提供局部信息，模型生成文字，外部工具独立执行。</desc>
<rect width="1200" height="470" rx="20" fill="#f3f8f7"/><text x="36" y="48" font-family="sans-serif" font-size="25" font-weight="700" fill="#173b3d">Qwen3.8-Flash-Next：不同模块各做什么</text>
<g font-family="sans-serif" text-anchor="middle" fill="#173b3d"><rect x="30" y="105" width="150" height="65" rx="10" fill="white" stroke="#87b6a4"/><text x="105" y="145" font-size="14">文字 / 图片 / 视频帧</text><rect x="225" y="105" width="170" height="65" rx="10" fill="white" stroke="#87b6a4"/><text x="310" y="132" font-size="16">输入编码</text><text x="310" y="153" font-size="13">文字分词 / 视觉编码</text><rect x="435" y="90" width="480" height="190" rx="14" fill="#e2f2ec" stroke="#67a59c"/><text x="675" y="122" font-size="18" font-weight="700">语言骨干：共 48 层</text><rect x="458" y="143" width="215" height="55" rx="8" fill="white" stroke="#87b6a4"/><text x="565" y="166" font-size="15">Gated DeltaNet × 3</text><text x="565" y="186" font-size="12">更新压缩历史状态</text><rect x="690" y="143" width="195" height="55" rx="8" fill="white" stroke="#87b6a4"/><text x="787" y="166" font-size="15">QSA × 1</text><text x="787" y="186" font-size="12">选块后读取原始 token</text><text x="675" y="226" font-size="14">每层 MoE · 四路门控残差</text><text x="675" y="249" font-size="12">此组重复 12 次，省略层内细节</text><rect x="963" y="105" width="200" height="65" rx="10" fill="white" stroke="#87b6a4"/><text x="1063" y="132" font-size="16">文字 / 工具请求</text><text x="1063" y="153" font-size="13">工具由外部系统执行</text><rect x="280" y="315" width="300" height="65" rx="10" fill="white" stroke="#87b6a4"/><text x="430" y="342" font-size="16">额外 N-gram 查表</text><text x="430" y="362" font-size="13">局部上下文 · 可放主机内存</text><text x="600" y="430" font-size="13" fill="#49665f">原创教学简图：主模型 125B、约 6B 激活；另有 51B 查表和 4B MTP，统计口径不同。</text></g><g fill="none" stroke="#357f77" stroke-width="3" marker-end="url(#arrow)"><path d="M180 137H216"/><path d="M395 137H426"/><path d="M915 137H954"/><path d="M580 347H650V286"/></g><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#357f77"/></marker></defs></svg>
