<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">结果奖励模型辅助选择答案</title><desc id="desc">生成器提出多个数学解答，结果奖励模型给每条完整解答评分，系统选择候选并由规则或人工进一步检查。</desc>
<rect width="1200" height="400" rx="20" fill="#f5faf8"/><text x="42" y="50" font-family="sans-serif" font-size="25" font-weight="bold" fill="#193b38">先生成候选，再评分、选择和核验</text>
<g font-family="sans-serif" fill="#193b38" font-size="19" text-anchor="middle"><g fill="#fff" stroke="#91bfb5" stroke-width="2"><rect x="40" y="115" width="220" height="110" rx="12"/><rect x="340" y="115" width="220" height="110" rx="12"/><rect x="640" y="115" width="220" height="110" rx="12"/><rect x="940" y="115" width="220" height="110" rx="12"/></g><text x="150" y="155">数学问题</text><text x="150" y="190" font-size="16">条件与目标</text><text x="450" y="155">生成模型</text><text x="450" y="190" font-size="16">多份候选解答</text><text x="750" y="155">结果奖励模型</text><text x="750" y="190" font-size="16">整份解答评分</text><text x="1050" y="155">选择与复核</text><text x="1050" y="190" font-size="16">规则或人工检查</text></g>
<g fill="none" stroke="#43877a" stroke-width="3" marker-end="url(#arrow)"><path d="M260 170h68"/><path d="M560 170h68"/><path d="M860 170h68"/></g><text x="42" y="305" font-family="sans-serif" font-size="18" fill="#42625d">评分是模型判断；没有正确候选时，排序无法凭空造出答案。</text><text x="42" y="340" font-family="sans-serif" font-size="15" fill="#55736e">原创教学简图，省略训练细节，不代表一次实际推理。</text><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#43877a"/></marker></defs></svg>
