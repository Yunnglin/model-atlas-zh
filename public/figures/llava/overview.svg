<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="290" viewBox="0 0 1060 290" role="img" aria-labelledby="title desc"><title id="title">LLaVA 原始图文处理流程</title><desc id="desc">图片经过 CLIP 视觉编码器和线性投影，与文字问题一起进入语言模型，逐步生成文字答案。</desc><rect width="1060" height="290" rx="18" fill="#f4f8f7"/><text x="32" y="42" font-family="sans-serif" font-size="23" font-weight="700" fill="#173b3d">LLaVA：把视觉特征接入语言模型</text><g font-family="sans-serif" text-anchor="middle" fill="#173b3d"><rect x="30" y="90" width="130" height="50" rx="10" fill="#fff" stroke="#a8c7c4"/><text x="95" y="121" font-size="16">图片</text><rect x="30" y="164" width="130" height="50" rx="10" fill="#fff" stroke="#a8c7c4"/><text x="95" y="195" font-size="16">文字问题</text><rect x="205" y="90" width="165" height="50" rx="10" fill="#fff" stroke="#a8c7c4"/><text x="287" y="121" font-size="15">CLIP ViT-L/14</text><rect x="415" y="90" width="150" height="50" rx="10" fill="#fff" stroke="#a8c7c4"/><text x="490" y="121" font-size="15">线性投影</text><rect x="615" y="88" width="185" height="128" rx="12" fill="#dcefeb" stroke="#67a59c"/><text x="707" y="143" font-size="16">Vicuna 语言模型</text><text x="707" y="169" font-size="13">结合图文逐步生成</text><rect x="850" y="120" width="160" height="65" rx="10" fill="#fff" stroke="#a8c7c4"/><text x="930" y="159" font-size="16">文字回答</text><path d="M160 115h39" fill="none" stroke="#357f77" stroke-width="2" marker-end="url(#a)"/><path d="M370 115h39" fill="none" stroke="#357f77" stroke-width="2" marker-end="url(#a)"/><path d="M565 115h44" fill="none" stroke="#357f77" stroke-width="2" marker-end="url(#a)"/><path d="M160 189h449" fill="none" stroke="#357f77" stroke-width="2" marker-end="url(#a)"/><path d="M800 152h44" fill="none" stroke="#357f77" stroke-width="2" marker-end="url(#a)"/><text x="520" y="258" font-size="13" fill="#4b6666">原版以线性投影连接视觉与语言；后续版本的连接器可能不同</text></g><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#357f77"/></marker></defs></svg>
