<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="260" viewBox="0 0 1060 260" role="img" aria-labelledby="title desc"><title id="title">Llama 3.1 训练与生成示意</title><desc id="desc">公开文本经预训练得到基础模型，再经示范和偏好后训练得到指令模型，结合输入和上下文逐 token 生成。</desc><rect width="1060" height="260" rx="16" fill="#f5f9f7"/><text x="30" y="37" fill="#193d38" font-size="20" font-family="sans-serif" font-weight="bold">Llama 3.1：从预训练到指令模型（教学示意）</text><g font-family="sans-serif" text-anchor="middle" fill="#183a35"><rect x="30" y="78" width="155" height="82" rx="10" fill="#fff" stroke="#86aaa0"/><text x="107" y="110" font-size="16">文本数据</text><text x="107" y="137" font-size="13">清理、去重与混合</text><rect x="235" y="78" width="170" height="82" rx="10" fill="#e6f3ef" stroke="#77aa99"/><text x="320" y="110" font-size="16">基础模型</text><text x="320" y="137" font-size="13">下一 token 预训练</text><rect x="455" y="78" width="190" height="82" rx="10" fill="#f1ecfa" stroke="#aa9ac5"/><text x="550" y="110" font-size="16">多轮后训练</text><text x="550" y="137" font-size="13">SFT、筛选、DPO</text><rect x="695" y="78" width="155" height="82" rx="10" fill="#fff5e8" stroke="#c9a679"/><text x="772" y="110" font-size="16">指令模型</text><text x="772" y="137" font-size="13">对齐后的模型</text><rect x="900" y="78" width="130" height="82" rx="10" fill="#fff" stroke="#86aaa0"/><text x="965" y="110" font-size="16">生成回答</text><text x="965" y="137" font-size="13">逐 token 输出</text></g><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#527f73"/></marker></defs><g stroke="#527f73" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M185 119h44"/><path d="M405 119h44"/><path d="M645 119h44"/><path d="M850 119h44"/></g><text x="530" y="219" text-anchor="middle" fill="#52706a" font-size="13" font-family="sans-serif">基础与指令模型都使用因果注意力和 GQA；省略长上下文训练等细节；非官方图</text></svg>
