<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="280" viewBox="0 0 1060 280" role="img" aria-labelledby="title desc"><title id="title">GLM-5.2 跨层复用索引示意</title><desc id="desc">长历史经过索引器选择候选位置，同一候选索引供多个稀疏注意力层复用，各层仍分别计算。</desc><rect width="1060" height="280" rx="18" fill="#f4f8f7"/><text x="32" y="42" font-family="sans-serif" font-size="23" font-weight="700" fill="#173b3d">IndexShare：复用位置索引，各层分别计算</text><g font-family="sans-serif" text-anchor="middle" fill="#173b3d"><rect x="35" y="100" width="175" height="80" rx="12" fill="#fff" stroke="#a8c7c4"/><text x="122" y="134" font-size="17">长历史</text><text x="122" y="158" font-size="13">文档、代码与日志</text><rect x="253" y="100" width="190" height="80" rx="12" fill="#dcefeb" stroke="#67a59c"/><text x="348" y="134" font-size="17">索引器</text><text x="348" y="158" font-size="13">挑选相关位置</text><rect x="500" y="80" width="125" height="55" rx="10" fill="#fff" stroke="#a8c7c4"/><text x="562" y="113" font-size="15">注意力层 1</text><rect x="645" y="80" width="125" height="55" rx="10" fill="#fff" stroke="#a8c7c4"/><text x="707" y="113" font-size="15">注意力层 2</text><rect x="500" y="155" width="125" height="55" rx="10" fill="#fff" stroke="#a8c7c4"/><text x="562" y="188" font-size="15">注意力层 3</text><rect x="645" y="155" width="125" height="55" rx="10" fill="#fff" stroke="#a8c7c4"/><text x="707" y="188" font-size="15">注意力层 4</text><path d="M210 140h37" fill="none" stroke="#357f77" stroke-width="2" marker-end="url(#a)"/><path d="M443 140h34" fill="none" stroke="#357f77" stroke-width="2" marker-end="url(#a)"/><path d="M477 140v-32h17" fill="none" stroke="#357f77" stroke-width="2" marker-end="url(#a)"/><path d="M477 140v42h17" fill="none" stroke="#357f77" stroke-width="2" marker-end="url(#a)"/><path d="M625 108h14" fill="none" stroke="#357f77" stroke-width="2" marker-end="url(#a)"/><path d="M625 183h14" fill="none" stroke="#357f77" stroke-width="2" marker-end="url(#a)"/><text x="854" y="130" font-size="15">复用的是索引</text><text x="854" y="157" font-size="13">不是复制层输出</text><text x="515" y="250" font-size="13" fill="#4b6666">示意图简化了数据流；不是官方网络结构图</text></g><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#357f77"/></marker></defs></svg>
