<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="260" viewBox="0 0 1060 260" role="img" aria-labelledby="title desc"><title id="title">DiT 潜空间去噪和图像生成</title><desc id="desc">从随机潜噪声出发，DiT 接收时间步和类别条件预测去噪信息，采样器反复更新潜表示，完成最后一步后再由解码器生成图片。</desc><rect width="1060" height="260" rx="16" fill="#f5f9f7"/><text x="30" y="37" fill="#193d38" font-size="20" font-family="sans-serif" font-weight="bold">DiT：在潜空间反复去噪，再解码为图片（教学示意）</text><g font-family="sans-serif" text-anchor="middle" fill="#183a35"><rect x="30" y="90" width="165" height="70" rx="10" fill="#fff" stroke="#86aaa0"/><text x="112" y="120" font-size="17">随机潜噪声</text><text x="112" y="145" font-size="14">生成起点</text><rect x="250" y="90" width="180" height="70" rx="10" fill="#e6f3ef" stroke="#77aa99"/><text x="340" y="120" font-size="17">切块与位置编码</text><text x="340" y="145" font-size="14">潜表示 → token</text><rect x="485" y="90" width="190" height="70" rx="10" fill="#f1ecfa" stroke="#aa9ac5"/><text x="580" y="120" font-size="17">DiT 去噪骨干</text><text x="580" y="145" font-size="14">时间步 + 类别条件</text><rect x="730" y="90" width="135" height="70" rx="10" fill="#fff5e8" stroke="#c9a679"/><text x="797" y="120" font-size="17">采样更新</text><text x="797" y="145" font-size="14">重复多步</text><rect x="920" y="90" width="110" height="70" rx="10" fill="#fff" stroke="#86aaa0"/><text x="975" y="120" font-size="17">解码器</text><text x="975" y="145" font-size="14">输出图片</text></g><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#527f73"/></marker></defs><g stroke="#527f73" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M195 125h49"/><path d="M430 125h49"/><path d="M675 125h49"/><path d="M865 125h49"/><path d="M797 163v38H340v-35"/></g><text x="892" y="84" text-anchor="middle" fill="#52706a" font-size="13" font-family="sans-serif">最后一步</text><text x="530" y="232" text-anchor="middle" fill="#52706a" font-size="13" font-family="sans-serif">训练时另有真实图片的编码与加噪；图示省略细节，并非官方结构图</text></svg>
