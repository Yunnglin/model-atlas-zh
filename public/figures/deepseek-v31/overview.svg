<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="260" viewBox="0 0 1060 260" role="img" aria-labelledby="title desc"><title id="title">DeepSeek-V3.1 思考模式与外部工具</title><desc id="desc">输入经过对话模板选择思考或非思考模式，由共享语言模型生成答案；工具调用需外部执行并返回结果。</desc><rect width="1060" height="260" rx="16" fill="#f5faf8"/><g fill="#fff" stroke="#87b6a4"><rect x="20" y="70" width="165" height="80" rx="8"/><rect x="220" y="70" width="200" height="80" rx="8"/><rect x="455" y="70" width="220" height="80" rx="8"/><rect x="710" y="70" width="155" height="80" rx="8"/><rect x="900" y="70" width="140" height="80" rx="8"/></g><g font-family="sans-serif" text-anchor="middle" fill="#203b35"><text x="102" y="105" font-size="16">用户问题</text><text x="320" y="102" font-size="16">对话模板</text><text x="320" y="126" font-size="13">选择思考 / 非思考</text><text x="565" y="102" font-size="16">共享语言模型</text><text x="565" y="126" font-size="13">MoE 与注意力</text><text x="787" y="102" font-size="15">工具请求</text><text x="787" y="126" font-size="13">按需生成</text><text x="970" y="102" font-size="15">外部执行器</text><text x="970" y="126" font-size="13">结果返回模型</text><text x="790" y="178" font-size="13">工具结果</text><text x="530" y="220" font-size="13">教学简图：工具调用是可选流程；省略多轮交互、校验和层内结构。</text></g><g fill="none" stroke="#468b75" stroke-width="3" marker-end="url(#a)"><path d="M185 110H210"/><path d="M420 110H445"/><path d="M675 110H700"/><path d="M865 110H890"/><path d="M970 150V190H565V160"/></g><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#468b75"/></marker></defs></svg>
