<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 330" role="img" aria-labelledby="title desc"><title id="title">GLM-ASR-Nano 语音转文字示意</title><desc id="desc">语音波形经过特征提取、声学编码和投影，转写提示作为文本另行输入语言解码器；解码器生成转写，业务系统可做后处理和复核。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#527a73"/></marker></defs><rect width="1080" height="330" rx="20" fill="#f6f9f8"/><g font-family="system-ui,sans-serif" fill="#173d3a"><text x="30" y="38" font-size="22" font-weight="700">从声音到转写文字</text><g font-size="16"><rect x="25" y="105" width="140" height="75" rx="10" fill="#e4f1eb"/><text x="45" y="136">录音波形</text><text x="45" y="159">16 kHz 输入</text><rect x="205" y="105" width="150" height="75" rx="10" fill="#e2eef0"/><text x="224" y="136">特征提取</text><text x="224" y="159">Log-Mel</text><rect x="395" y="105" width="150" height="75" rx="10" fill="#e2eef0"/><text x="414" y="136">声学编码器</text><text x="414" y="159">提取声音特征</text><rect x="585" y="105" width="150" height="75" rx="10" fill="#f1eadc"/><text x="608" y="136">投影连接</text><text x="608" y="159">对齐表示</text><rect x="775" y="105" width="260" height="75" rx="10" fill="#dcece4"/><text x="794" y="136">语言解码器</text><text x="794" y="159">逐步生成转写文本</text></g><g stroke="#527a73" stroke-width="2.5" fill="none" marker-end="url(#a)"><path d="M165 142H205"/><path d="M355 142H395"/><path d="M545 142H585"/><path d="M735 142H775"/><path d="M905 202V184"/></g><rect x="795" y="205" width="220" height="42" rx="9" fill="#f1eadc"/><text x="815" y="232" font-size="16">转写提示（文本）</text><text x="30" y="255" font-size="16">后续应用可增加分段、时间信息、人工复核和错例分析。</text><text x="30" y="289" font-size="14" fill="#526b68">教学简图：根据配置与 Transformers 实现整理，未展示所有层次和预处理细节。</text></g></svg>
