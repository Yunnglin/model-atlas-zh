<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">KTO 非配对偏好优化</title><desc id="desc">两个不同问题的回答分别得到可取和不可取标签，当前模型与参考模型共同计算损失，更新当前模型。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#628088"/></marker></defs>
<rect width="1200" height="430" rx="24" fill="#f3f8f8"/><g font-family="sans-serif" fill="#203745"><text x="48" y="53" font-size="25" font-weight="700">单条反馈，不必拼成同题答案对</text><rect x="48" y="93" width="235" height="86" rx="12" fill="#fff" stroke="#bed4d4"/><text x="67" y="127" font-size="20">问题 A ＋ 回答 A</text><text x="67" y="157" font-size="17" fill="#247a68">可取 ✓</text><rect x="48" y="211" width="235" height="86" rx="12" fill="#fff" stroke="#bed4d4"/><text x="67" y="245" font-size="20">问题 B ＋ 回答 B</text><text x="67" y="275" font-size="17" fill="#a35454">不可取 ×</text>
<rect x="362" y="105" width="200" height="70" rx="12" fill="#fff" stroke="#bed4d4"/><text x="401" y="148" font-size="21">当前模型</text><rect x="362" y="218" width="200" height="70" rx="12" fill="#fff" stroke="#bed4d4"/><text x="401" y="261" font-size="21">参考模型</text><text x="398" y="312" font-size="16" fill="#55707a">通常保持冻结</text>
<rect x="650" y="145" width="240" height="100" rx="12" fill="#e2f1ef" stroke="#7bb8ae"/><text x="678" y="185" font-size="21">相对概率与参考点</text><text x="678" y="216" font-size="17">结合正负标签计算损失</text><rect x="977" y="155" width="175" height="80" rx="12" fill="#fff" stroke="#bed4d4"/><text x="1007" y="191" font-size="20">更新当前</text><text x="1027" y="218" font-size="20">模型</text><g stroke="#628088" stroke-width="2" fill="none"><path d="M283 136 H312 V195 M283 254 H312 V195"/><g marker-end="url(#arr)"><path d="M312 195 H330 V140 H350"/><path d="M330 195 V253 H350"/><path d="M562 140 L638 177"/><path d="M562 253 L638 213"/><path d="M890 195 H965"/></g></g><text x="49" y="376" font-size="16" fill="#55707a">教学简图；参考点估计、批次和模型配置以论文与具体实现为准。</text></g></svg>
