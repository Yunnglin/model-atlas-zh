<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 265" role="img" aria-labelledby="title desc"><title id="title">ORPO 教学示意</title><desc id="desc">同题优选回答参与监督损失，优选与劣选回答共同参与赔率比偏好损失，两个损失加权求和。</desc><rect width="960" height="265" rx="20" fill="#f2f8f6"/><g font-family="sans-serif" fill="#183d39"><text x="32" y="39" font-size="21" font-weight="bold">同一问题的优劣回答</text><rect x="32" y="65" width="210" height="55" rx="10" fill="#fff" stroke="#80b4aa"/><text x="52" y="99" font-size="17">优选 A：准确解释</text><rect x="32" y="150" width="210" height="55" rx="10" fill="#fff" stroke="#80b4aa"/><text x="52" y="184" font-size="17">劣选 B：错误解释</text><rect x="320" y="65" width="230" height="55" rx="10" fill="#fff" stroke="#80b4aa"/><text x="340" y="99" font-size="17">A 的监督损失</text><rect x="320" y="150" width="230" height="55" rx="10" fill="#fff" stroke="#80b4aa"/><text x="340" y="184" font-size="17">A、B 的赔率比损失</text><rect x="660" y="103" width="260" height="65" rx="12" fill="#e2f0ed" stroke="#80b4aa"/><text x="682" y="143" font-size="17">监督损失 + 加权偏好损失</text><text x="32" y="240" font-size="14" fill="#526e69">教学示意：两个信号共同更新当前模型，不需参考模型。</text></g><g fill="none" stroke="#4b7772" stroke-width="2"><path d="M242 92H320M242 92H278V176H320M242 177H320M550 92H610L660 122M550 177H610L660 150"/></g></svg>
