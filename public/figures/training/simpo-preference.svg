<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" role="img" aria-labelledby="title desc">
<title id="title">SimPO 偏好对教学示意</title><desc id="desc">同一问题的优选和劣选回答分别计算平均 token 对数概率，比较分差与目标间隔形成训练损失。</desc>
<rect width="960" height="250" rx="20" fill="#f2f8f6"/><g font-family="sans-serif" fill="#183d39"><text x="32" y="39" font-size="21" font-weight="bold">同一个问题，两份回答</text><rect x="32" y="65" width="230" height="55" rx="10" fill="#fff" stroke="#80b4aa"/><text x="52" y="99" font-size="17">优选 A：准确解释</text><rect x="32" y="142" width="230" height="55" rx="10" fill="#fff" stroke="#80b4aa"/><text x="52" y="176" font-size="17">劣选 B：错误解释</text><rect x="340" y="82" width="230" height="100" rx="12" fill="#fff" stroke="#80b4aa"/><text x="362" y="119" font-size="17">当前模型分别计分</text><text x="362" y="153" font-size="16">总对数概率 ÷ token 数</text><rect x="650" y="82" width="270" height="100" rx="12" fill="#e2f0ed" stroke="#80b4aa"/><text x="672" y="119" font-size="17">优选分 − 劣选分</text><text x="672" y="153" font-size="16">结合目标间隔计算损失</text><text x="32" y="229" font-size="14" fill="#526e69">教学示意：同一模型分别处理两条回答，无需参考模型参与损失。</text></g><g fill="none" stroke="#4b7772" stroke-width="2"><path d="M262 92H305L340 112"/><path d="M262 170H305L340 152"/><path d="M570 132H650"/></g></svg>
