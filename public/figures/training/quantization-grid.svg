<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" role="img" aria-labelledby="title desc">
  <title id="title">量化中的舍入和裁剪</title>
  <desc id="desc">以尺度零点一、四位有符号整数范围负八到七为例。零点三一经舍入得到三，还原为零点三；零点七六舍入得到八，因超出范围裁剪到七，还原为零点七。</desc>
  <rect width="600" height="430" rx="18" fill="#f4f8f7"/>
  <g font-family="system-ui, sans-serif" fill="#173b3d">
    <text x="24" y="44" font-size="25" font-weight="700">用一把更粗的尺表示权重</text>
    <text x="24" y="78" font-size="18" fill="#486460">教学例子：尺度 0.1，整数范围 −8 到 7</text>
    <g text-anchor="middle" font-size="19">
      <text x="98" y="120">原始权重</text>
      <text x="300" y="115">除以 0.1，舍入</text>
      <text x="300" y="140">再裁剪到范围内</text>
      <text x="502" y="120">乘以 0.1，还原</text>
    </g>
    <g fill="#fff" stroke="#a8c7c4" stroke-width="2">
      <rect x="20" y="163" width="156" height="68" rx="12"/>
      <rect x="222" y="163" width="156" height="68" rx="12"/>
      <rect x="424" y="163" width="156" height="68" rx="12"/>
      <rect x="20" y="268" width="156" height="68" rx="12"/>
      <rect x="222" y="268" width="156" height="68" rx="12"/>
      <rect x="424" y="268" width="156" height="68" rx="12"/>
    </g>
    <g text-anchor="middle" font-size="27" font-weight="600">
      <text x="98" y="207">0.31</text><text x="300" y="207">3</text><text x="502" y="207">0.30</text>
      <text x="98" y="312">0.76</text><text x="300" y="312">8 → 7</text><text x="502" y="312">0.70</text>
    </g>
    <g fill="none" stroke="#357f77" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M180 197h34"/><path d="M382 197h34"/><path d="M180 302h34"/><path d="M382 302h34"/>
    </g>
    <text x="24" y="382" font-size="19" fill="#486460">第一行有舍入误差；第二行超过上限，</text>
    <text x="24" y="409" font-size="19" fill="#486460">从 8 裁剪成 7 后再还原。</text>
  </g>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#357f77"/></marker></defs>
</svg>
