<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" aria-labelledby="title desc">
<title id="title">pass@2 组合示例</title><desc id="desc">四个候选中 A 和 B 通过测试，C 和 D 未通过。从四个候选选两个共有六种组合，其中五种至少有一个通过，估计值为六分之五。</desc>
<rect width="900" height="310" rx="18" fill="#f5f9f8"/><g font-family="system-ui,sans-serif" fill="#183b45"><text x="30" y="40" font-size="23" font-weight="700">四个候选中选两个：有多少组至少成功一次？</text><text x="30" y="72" font-size="17">A、B 通过测试；C、D 未通过。</text>
<g stroke="#c5ded8" fill="#e1f2ed"><rect x="30" y="95" width="250" height="64" rx="10"/><rect x="325" y="95" width="250" height="64" rx="10"/><rect x="620" y="95" width="250" height="64" rx="10"/><rect x="30" y="175" width="250" height="64" rx="10"/><rect x="325" y="175" width="250" height="64" rx="10"/></g><rect x="620" y="175" width="250" height="64" rx="10" fill="#fff0ec" stroke="#e8c8bc"/>
<g font-size="19"><text x="52" y="134">A + B　通过</text><text x="347" y="134">A + C　通过</text><text x="642" y="134">A + D　通过</text><text x="52" y="214">B + C　通过</text><text x="347" y="214">B + D　通过</text><text x="642" y="214">C + D　未通过</text></g><text x="30" y="282" font-size="17">六种组合中五种通过：pass@2 估计为 5/6。</text></g></svg>
