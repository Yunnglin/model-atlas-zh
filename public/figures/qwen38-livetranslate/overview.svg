<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
<title id="title">Qwen3.8-LiveTranslate 流式同传教学图</title><desc id="desc">会议音视频输入混合专家 Thinker，按时间组织音频、画面、原文与译文；Talker 结合译文与源音频生成译音，同步显示原文、译文与说话人。</desc>
<rect width="1200" height="410" rx="20" fill="#f4f9f7"/>
<g font-family="sans-serif" fill="#193d38"><text x="32" y="42" font-size="23" font-weight="700">实时同传：边听边译，区分是谁在说话</text><text x="32" y="72" font-size="14">原创教学简图 · 外部采集、网络、字幕和播放属于系统，实际接口能力以服务文档为准</text></g>
<g fill="#fff" stroke="#8cb6a9" stroke-width="2"><rect x="30" y="135" width="170" height="90" rx="12"/><rect x="275" y="120" width="325" height="120" rx="12"/><rect x="690" y="120" width="235" height="120" rx="12"/><rect x="1000" y="135" width="170" height="90" rx="12"/><rect x="400" y="280" width="390" height="60" rx="12"/></g>
<g font-family="sans-serif" text-anchor="middle" fill="#193d38"><text x="115" y="169" font-size="19">会议音视频</text><text x="115" y="198" font-size="14">声源、画面与时间</text><text x="437" y="155" font-size="19" font-weight="700">Thinker</text><text x="437" y="181" font-size="14">混合专家；按时间交错</text><text x="437" y="204" font-size="14">音频、画面、原文与译文</text><text x="807" y="155" font-size="19" font-weight="700">Talker</text><text x="807" y="181" font-size="14">结合译文与源音频</text><text x="807" y="204" font-size="14">生成译文语音</text><text x="1085" y="169" font-size="19">译文声音</text><text x="1085" y="198" font-size="14">外部播放器播放</text><text x="595" y="307" font-size="16">原文、译文与说话人同步显示</text><text x="595" y="328" font-size="13">文本与声学输出需分别评估</text><text x="600" y="385" font-size="13">模型可以增量输出；采样、网络、分段和播放同样影响实际延迟</text></g>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#388170"/></marker></defs><g stroke="#388170" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M200 180H265"/><path d="M600 180H680"/><path d="M925 180H990"/><path d="M437 240V280"/><path d="M115 225V260H807V250" stroke-dasharray="7 5"/></g>
</svg>
