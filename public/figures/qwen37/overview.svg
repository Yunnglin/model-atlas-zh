<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 260" role="img" aria-labelledby="title desc"><title id="title">Qwen3.7-Max 与外部工具协作</title><desc id="desc">模型生成工具请求，由应用检查并执行工具，工具结果返回模型，最终由应用验收。</desc><rect width="1060" height="260" rx="18" fill="#f4f8f7"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#42857c"/></marker></defs><g font-family="sans-serif" text-anchor="middle" fill="#183b43"><g fill="#fff" stroke="#b6d2cd" stroke-width="2"><rect x="25" y="60" width="170" height="74" rx="10"/><rect x="245" y="60" width="190" height="74" rx="10"/><rect x="485" y="60" width="200" height="74" rx="10"/><rect x="735" y="60" width="200" height="74" rx="10"/></g><g font-size="16" font-weight="600"><text x="110" y="91">任务与材料</text><text x="110" y="115" font-size="13">用户或应用输入</text><text x="340" y="91">Qwen3.7-Max</text><text x="340" y="115" font-size="13">生成回答或工具请求</text><text x="585" y="91">应用与权限检查</text><text x="585" y="115" font-size="13">决定是否执行</text><text x="835" y="91">外部工具</text><text x="835" y="115" font-size="13">执行并返回结果</text></g><g stroke="#42857c" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M195 97H245"/><path d="M435 97H485"/><path d="M685 97H735"/><path d="M835 134V176H340V134"/></g><text x="595" y="198" font-size="13">执行结果返回模型，按需要继续；成果由应用或用户验收</text><text x="530" y="232" font-size="13" fill="#53736e">教学示意 · 展示外部流程，不代表模型内部结构</text></g></svg>
