<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="260" viewBox="0 0 1060 260" role="img" aria-labelledby="title desc"><title id="title">GLM-4.6 代码智能体交互示意</title><desc id="desc">用户任务和代码上下文进入语言模型，模型按需请求外部工具，工具结果返回模型，最终输出补丁和说明。</desc><rect width="1060" height="260" rx="16" fill="#f5faf8"/><g fill="#fff" stroke="#87b6a4"><rect x="20" y="65" width="190" height="90" rx="8"/><rect x="245" y="65" width="215" height="90" rx="8"/><rect x="495" y="65" width="235" height="90" rx="8"/><rect x="765" y="65" width="275" height="90" rx="8"/></g><g font-family="sans-serif" text-anchor="middle" fill="#203b35"><text x="115" y="100" font-size="16">任务与代码上下文</text><text x="115" y="125" font-size="13">需求、文件、历史记录</text><text x="352" y="100" font-size="16">GLM-4.6</text><text x="352" y="125" font-size="13">MoE 解码器逐 token 生成</text><text x="612" y="100" font-size="16">外部工具与环境</text><text x="612" y="125" font-size="13">读取、执行、返回日志</text><text x="902" y="100" font-size="16">补丁与结果</text><text x="902" y="125" font-size="13">独立测试与人工审查</text><text x="530" y="220" font-size="13">教学简图：工具调用为可选的多轮交互，需将结果返回模型；省略权限与层内细节。</text></g><g fill="none" stroke="#468b75" stroke-width="3" marker-end="url(#a)"><path d="M210 110H235"/><path d="M460 100H485"/><path d="M495 135H470"/><path d="M352 155V185H902V165"/></g><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#468b75"/></marker></defs></svg>
