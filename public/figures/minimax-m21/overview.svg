<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="280" viewBox="0 0 1060 280" role="img" aria-labelledby="title desc"><title id="title">MiniMax-M2.1 智能体训练与执行示意</title><desc id="desc">任务与仓库进入模型，模型生成工具请求，外部沙盒执行并反馈；测试和评分用于训练与验证。</desc><rect width="1060" height="280" rx="16" fill="#f5faf8"/><g fill="#fff" stroke="#87b6a4"><rect x="20" y="75" width="165" height="80" rx="8"/><rect x="220" y="75" width="190" height="80" rx="8"/><rect x="445" y="75" width="190" height="80" rx="8"/><rect x="670" y="75" width="180" height="80" rx="8"/><rect x="885" y="75" width="155" height="80" rx="8"/></g><g font-family="sans-serif" text-anchor="middle" fill="#203b35"><text x="102" y="107" font-size="16">任务与代码</text><text x="315" y="106" font-size="16">M2.1 模型</text><text x="315" y="130" font-size="13">思考和生成请求</text><text x="540" y="106" font-size="16">外部沙盒与工具</text><text x="540" y="130" font-size="13">执行并返回结果</text><text x="760" y="106" font-size="16">测试 / 评分</text><text x="760" y="130" font-size="13">检查任务产物</text><text x="962" y="106" font-size="16">修订与训练</text><text x="530" y="225" font-size="13">教学简图：推理时是否使用工具由应用控制；训练评分与运行时行为分开。</text><text x="530" y="248" font-size="13">省略多轮轨迹、过滤、专家标注和具体奖励公式；非官方结构图。</text></g><g fill="none" stroke="#468b75" stroke-width="3" marker-end="url(#a)"><path d="M185 115H210"/><path d="M410 115H435"/><path d="M635 115H660"/><path d="M850 115H875"/><path d="M540 155V190H315V163"/></g><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#468b75"/></marker></defs></svg>
