<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">Qwen-VLA：从观察到动作的教学示意</title><desc id="desc">相机图像、任务文字和机器人描述进入 Qwen3.5 视觉语言骨干；其隐藏状态与噪声动作片段共同进入流匹配动作专家，生成一段连续动作，再经机器人控制系统执行并重新观察。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#4b7772"/></marker></defs>
<rect width="1200" height="480" rx="24" fill="#f6faf9"/><text x="48" y="55" font-family="sans-serif" font-size="25" font-weight="700" fill="#193e3a">一次抓取：从看到杯子到伸手</text>
<g font-family="sans-serif" fill="#183b38"><rect x="48" y="108" width="205" height="175" rx="16" fill="#e4f1ee" stroke="#91bab2"/><text x="70" y="143" font-size="19" font-weight="700">观察与条件</text><text x="70" y="180" font-size="16">相机：桌上有杯子</text><text x="70" y="210" font-size="16">指令：拿起红杯</text><text x="70" y="240" font-size="16">机器人及控制约定</text>
<rect x="314" y="108" width="220" height="175" rx="16" fill="#fff" stroke="#91bab2"/><text x="337" y="148" font-size="19" font-weight="700">Qwen3.5 骨干</text><text x="337" y="188" font-size="16">联合理解图像与文字</text><text x="337" y="220" font-size="16">输出隐藏状态</text>
<rect x="597" y="108" width="236" height="175" rx="16" fill="#fff" stroke="#91bab2"/><text x="620" y="148" font-size="19" font-weight="700">DiT 动作专家</text><text x="620" y="185" font-size="16">结合骨干隐藏状态</text><text x="620" y="215" font-size="16">和噪声动作片段</text><text x="620" y="245" font-size="16">流匹配迭代生成轨迹</text>
<rect x="896" y="108" width="248" height="175" rx="16" fill="#e4f1ee" stroke="#91bab2"/><text x="918" y="148" font-size="19" font-weight="700">机器人系统</text><text x="918" y="185" font-size="16">动作接口与控制器</text><text x="918" y="215" font-size="16">执行、观察、再规划</text><text x="918" y="245" font-size="16">安全约束与急停</text></g>
<g stroke="#4b7772" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M253 195H307"/><path d="M534 195H590"/><path d="M833 195H889"/><path d="M1020 288V345H150V291"/></g><text x="455" y="380" font-family="sans-serif" font-size="17" fill="#436b66">环境发生变化后，新的观察进入下一轮</text><text x="48" y="435" font-family="sans-serif" font-size="14" fill="#617d79">教学示意：基于 Qwen-VLA 论文第 2 节重绘；不表示全部工程接口。</text></svg>
