<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" role="img" aria-labelledby="title desc"><title id="title">Kimi K2.7 Code 多模态模型与工具执行循环</title><desc id="desc">文本直接输入语言主干，图片和视频经视觉编码后输入语言主干；模型输出工具请求，外部执行器读文件或运行测试，再将结果返回模型。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#527a73"/></marker></defs><rect width="1100" height="350" rx="20" fill="#f6f9f8"/><g font-family="system-ui,sans-serif" fill="#173d3a"><text x="30" y="40" font-size="22" font-weight="700">模型提出请求，外部工具提供执行结果</text><g font-size="16"><rect x="30" y="100" width="195" height="75" rx="10" fill="#e5f2ec"/><text x="50" y="131">文本 / 代码 / 图片</text><text x="50" y="155">以及视频输入</text><rect x="285" y="100" width="215" height="75" rx="10" fill="#dcece4"/><text x="305" y="131">视觉编码 + MoE 主干</text><text x="305" y="155">文字直接进入主干</text><rect x="560" y="100" width="185" height="75" rx="10" fill="#e3eff0"/><text x="580" y="131">文本回答</text><text x="580" y="155">或工具请求</text><rect x="805" y="100" width="245" height="75" rx="10" fill="#f1eadc"/><text x="825" y="131">外部工具与运行环境</text><text x="825" y="155">读取文件 / 运行测试</text></g><g fill="none" stroke="#527a73" stroke-width="2.5" marker-end="url(#a)"><path d="M225 137H285"/><path d="M500 137H560"/><path d="M745 137H805"/><path d="M925 175V235H390V181"/></g><text x="30" y="300" font-size="15" fill="#526b68">教学简图：反馈进入后续上下文；工具权限、执行、日志与验证属于模型外的系统。</text></g></svg>
