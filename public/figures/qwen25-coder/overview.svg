<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="250" viewBox="0 0 1060 250" role="img" aria-labelledby="title desc"><title id="title">Qwen2.5-Coder 中间补全教学简图</title><desc id="desc">代码前缀和后缀被按 FIM 约定组织为输入，因果语言模型生成缺失的中间代码，外部执行器可以运行测试。</desc><rect width="1060" height="250" rx="16" fill="#f5faf8"/><g font-family="sans-serif" text-anchor="middle" fill="#203b35"><g fill="#fff" stroke="#87b6a4"><rect x="20" y="68" width="175" height="80" rx="8"/><rect x="235" y="68" width="170" height="80" rx="8"/><rect x="445" y="45" width="225" height="125" rx="8"/><rect x="710" y="68" width="145" height="80" rx="8"/><rect x="895" y="68" width="145" height="80" rx="8"/></g><text x="107" y="100" font-size="16">前缀 / 后缀</text><text x="107" y="126" font-size="14">待补位置</text><text x="320" y="100" font-size="16">FIM 格式组织</text><text x="320" y="126" font-size="14">特殊标记 / 分词</text><text x="557" y="92" font-size="16">Qwen2.5 解码器</text><text x="557" y="120" font-size="14">逐 token 生成</text><text x="782" y="114" font-size="16">补全片段</text><text x="967" y="100" font-size="16">外部执行器</text><text x="967" y="126" font-size="14">可运行测试</text><text x="530" y="222" font-size="13">教学简图：FIM 是输入组织方式；省略网络层内细节，非官方图。</text></g><g fill="none" stroke="#468b75" stroke-width="3" marker-end="url(#a)"><path d="M195 108H225"/><path d="M405 108H435"/><path d="M670 108H700"/><path d="M855 108H885"/></g><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#468b75"/></marker></defs></svg>
