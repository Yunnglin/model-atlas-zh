<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">初代 LLaMA 自回归文本生成教学示意</title><desc id="desc">前文经过分词、Transformer 中的因果注意力和前馈网络，预测后续 token；模型采用 RMSNorm、SwiGLU 与 RoPE 等设计。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#35796e"/></marker></defs><rect width="1200" height="420" rx="20" fill="#f4f9f7"/>
<g font-family="sans-serif" fill="#173b38"><text x="35" y="46" font-size="24" font-weight="700">已有前文 → 模型逐步预测后续文字</text>
<rect x="35" y="110" width="210" height="125" rx="14" fill="#fff" stroke="#a6c9bf"/><text x="140" y="151" text-anchor="middle" font-size="18" font-weight="700">文字与分词</text><text x="140" y="188" text-anchor="middle" font-size="15">输入转换为 token</text>
<rect x="310" y="90" width="480" height="165" rx="14" fill="#e7f3ef" stroke="#8bb8aa"/><text x="550" y="125" text-anchor="middle" font-size="19" font-weight="700">因果 Transformer 多层处理</text><text x="550" y="163" text-anchor="middle" font-size="16">RMSNorm → 注意力（RoPE）→ RMSNorm → 前馈（SwiGLU）</text><text x="550" y="201" text-anchor="middle" font-size="15">只能利用当前位置及以前的上下文</text><text x="550" y="229" text-anchor="middle" font-size="13">教学简化，省略残差及层内部细节</text>
<rect x="855" y="110" width="310" height="125" rx="14" fill="#fff" stroke="#a6c9bf"/><text x="1010" y="151" text-anchor="middle" font-size="18" font-weight="700">预测下一个 token</text><text x="1010" y="188" text-anchor="middle" font-size="15">接到前文，再继续生成</text>
<g fill="none" stroke="#35796e" stroke-width="3" marker-end="url(#arrow)"><path d="M245 172 H300"/><path d="M790 172 H845"/></g><text x="35" y="327" font-size="16">图展示基础模型的生成方式；不同任务和版本的训练、适配及许可需要分别核对。</text><text x="35" y="370" font-size="14" fill="#58746d">原创教学示意，依据初代 LLaMA 论文；不是官方逐层结构图。</text></g></svg>
