<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="260" viewBox="0 0 1060 260" role="img" aria-labelledby="title desc"><title id="title">DeepSeekMath 训练流程教学示意</title><desc id="desc">代码底座继续学习数学等语料，经过数学指令微调，再以组内相对奖励训练得到 RL 模型。</desc><rect width="1060" height="260" rx="16" fill="#f5faf8"/><g fill="#fff" stroke="#87b6a4"><rect x="20" y="65" width="195" height="90" rx="8"/><rect x="250" y="65" width="225" height="90" rx="8"/><rect x="510" y="65" width="185" height="90" rx="8"/><rect x="730" y="65" width="300" height="90" rx="8"/></g><g font-family="sans-serif" text-anchor="middle" fill="#203b35"><text x="117" y="100" font-size="16">代码预训练底座</text><text x="117" y="125" font-size="13">Coder-Base-v1.5 7B</text><text x="362" y="100" font-size="16">继续预训练</text><text x="362" y="125" font-size="13">数学、代码和自然语言</text><text x="602" y="100" font-size="16">数学指令微调</text><text x="602" y="125" font-size="13">Base → Instruct</text><text x="880" y="100" font-size="16">GRPO 强化学习</text><text x="880" y="125" font-size="13">一题多答 → 奖励评分 → 相对更新</text><text x="530" y="220" font-size="13">教学简图：展示主要训练阶段；省略采样、约束、奖励模型训练等细节。</text></g><g fill="none" stroke="#468b75" stroke-width="3" marker-end="url(#a)"><path d="M215 110H240"/><path d="M475 110H500"/><path d="M695 110H720"/></g><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#468b75"/></marker></defs></svg>
