<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="260" viewBox="0 0 1060 260" role="img" aria-labelledby="title desc">
<title id="title">Kimi Linear 的分层混合注意力</title>
<desc id="desc">输入进入二十七层语言骨干。前三层 KDA 各接前馈，随后一层 MLA 接前馈；后续层按近似三比一排列。第一层前馈稠密，其余层采用 MoE。最后预测下一个 token。</desc>
<rect width="1060" height="260" rx="16" fill="#f5faf8"/>
<g fill="#fff" stroke="#87b6a4"><rect x="20" y="72" width="125" height="75" rx="8"/><rect x="180" y="45" width="285" height="125" rx="8"/><rect x="500" y="45" width="245" height="125" rx="8"/><rect x="780" y="72" width="260" height="75" rx="8"/></g>
<g font-family="sans-serif" text-anchor="middle" fill="#203b35"><text x="82" y="115" font-size="16">输入 token</text><text x="322" y="77" font-size="16">前三层：KDA + 前馈</text><text x="322" y="105" font-size="13">每层都有自己的前馈模块</text><text x="322" y="131" font-size="13">第 1 层稠密，其余层为 MoE</text><text x="622" y="77" font-size="16">第 4 层：MLA + MoE</text><text x="622" y="105" font-size="13">注意力读取历史缓存</text><text x="622" y="131" font-size="13">再经过该层前馈模块</text><text x="910" y="102" font-size="15">后续分层交替</text><text x="910" y="128" font-size="13">直到预测下一个 token</text><text x="530" y="208" font-size="13">共 27 层：20 层 KDA、7 层 MLA；前三层 KDA 后接一层 MLA 的模式近似重复。</text><text x="530" y="231" font-size="13">教学简图：省略残差、归一化与输出投影。实际模型以官方配置为准。</text></g>
<g fill="none" stroke="#468b75" stroke-width="3" marker-end="url(#a)"><path d="M145 109 H170"/><path d="M465 109 H490"/><path d="M745 109 H770"/></g><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#468b75"/></marker></defs></svg>
