<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc"><title id="title">VALL-E 条件音频编码生成示意</title><desc id="desc">参考语音转成音频码，文本转成音素，音素和声学提示都作为条件，模型先自回归生成第一层音频码，再逐层非自回归生成后续码，最后用编解码器解码波形。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#527a73"/></marker></defs><rect width="1100" height="360" rx="20" fill="#f6f9f8"/><g font-family="system-ui,sans-serif" fill="#173d3a"><text x="30" y="40" font-size="22" font-weight="700">文字与参考声音，怎样生成新语音</text><g font-size="16"><rect x="30" y="70" width="210" height="70" rx="10" fill="#e5f2ec"/><text x="48" y="101">目标文字及参考转写</text><text x="48" y="124">转换成音素提示</text><rect x="30" y="200" width="210" height="70" rx="10" fill="#e3eff0"/><text x="48" y="231">参考声音 → EnCodec</text><text x="48" y="254">得到声学提示</text><rect x="300" y="130" width="230" height="85" rx="10" fill="#e2eee7"/><text x="320" y="160">自回归生成</text><text x="320" y="187">第一层声学码</text><rect x="590" y="130" width="220" height="85" rx="10" fill="#f1eadc"/><text x="610" y="160">逐层非自回归</text><text x="610" y="187">补全其余声学码</text><rect x="870" y="130" width="205" height="85" rx="10" fill="#e3eff0"/><text x="890" y="160">EnCodec 解码器</text><text x="890" y="187">生成波形</text></g><g fill="none" stroke="#527a73" stroke-width="2.5" marker-end="url(#a)"><path d="M240 105H270V155H300"/><path d="M240 84H700V130"/><path d="M240 235H270V190H300"/><path d="M530 172H590"/><path d="M810 172H870"/><path d="M240 230H265V285H700V215"/></g><text x="30" y="328" font-size="14" fill="#526b68">教学简图：音素与参考声音均用于两阶段；不展示所有训练和采样细节。</text></g></svg>
