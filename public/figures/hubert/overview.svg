<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 365" role="img" aria-labelledby="title desc"><title id="title">HuBERT 聚类标签与遮盖预测</title><desc id="desc">语音一支离线提取特征并聚类产生伪标签；另一支经卷积编码、遮盖与 Transformer 预测对应标签，后续可用学到的表示再次聚类。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#507a72"/></marker></defs><rect width="1080" height="365" rx="20" fill="#f6f9f8"/><g font-family="system-ui,sans-serif" fill="#173d3a"><text x="30" y="39" font-size="22" font-weight="700">HuBERT：先造临时标签，再预测被遮住的部分</text><g font-size="16"><rect x="30" y="130" width="140" height="65" rx="10" fill="#e5f2ec"/><text x="52" y="169">原始语音</text><rect x="220" y="65" width="235" height="70" rx="10" fill="#f2eadc"/><text x="239" y="95">离线特征 + K-means</text><text x="239" y="118">生成每个位置的伪标签</text><rect x="220" y="195" width="235" height="70" rx="10" fill="#e2eef0"/><text x="239" y="225">卷积特征 + 遮盖</text><text x="239" y="248">保留未遮盖的上下文</text><rect x="520" y="195" width="200" height="70" rx="10" fill="#dbece5"/><text x="541" y="225">Transformer</text><text x="541" y="248">预测遮盖位置标签</text><rect x="795" y="120" width="245" height="80" rx="10" fill="#e5eff1"/><text x="815" y="151">对照离线标签训练</text><text x="815" y="176">下一轮可重新聚类</text></g><g stroke="#507a72" stroke-width="2.5" fill="none" marker-end="url(#a)"><path d="M170 145H195V100H220"/><path d="M170 180H195V230H220"/><path d="M455 100H760V145H795"/><path d="M455 230H520"/><path d="M720 230H760V175H795"/></g><text x="30" y="325" font-size="14" fill="#526b68">教学示意：伪标签并非人工文字或音素；识别时仍需转写监督与解码。</text></g></svg>
