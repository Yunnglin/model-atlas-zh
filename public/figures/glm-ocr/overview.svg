<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 350" role="img" aria-labelledby="title desc"><title id="title">GLM-OCR 文档解析与字段提取示意</title><desc id="desc">复杂文档可先经过外部版面分析与分块，再通过 OCR 核心模型识别并合并；字段提取也可直接将整页输入核心模型。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#567b76"/></marker></defs><rect width="1080" height="350" rx="20" fill="#f6f9f8"/><g font-family="system-ui,sans-serif" fill="#183d3a"><text x="32" y="38" font-size="22" font-weight="700">一张文档的两条处理路径</text><g font-size="16"><text x="32" y="79" font-weight="700">文档解析</text><rect x="32" y="93" width="130" height="60" rx="9" fill="#e4f0eb"/><text x="55" y="129">页面图片</text><rect x="205" y="93" width="175" height="60" rx="9" fill="#f2eadb"/><text x="220" y="120">外部版面分析</text><text x="220" y="141">检测并裁剪区域</text><rect x="425" y="93" width="290" height="60" rx="9" fill="#dcece7"/><text x="443" y="120">GLM-OCR 核心模型</text><text x="443" y="141">CogViT → 连接器 → GLM 解码器</text><rect x="760" y="93" width="270" height="60" rx="9" fill="#e4eff1"/><text x="777" y="120">按阅读顺序合并</text><text x="777" y="141">生成 Markdown / JSON</text><text x="32" y="210" font-weight="700">字段提取</text><rect x="32" y="224" width="245" height="60" rx="9" fill="#e4f0eb"/><text x="48" y="260">整页图片 + 字段提示</text><rect x="425" y="224" width="290" height="60" rx="9" fill="#dcece7"/><text x="445" y="260">GLM-OCR 核心模型</text><rect x="760" y="224" width="270" height="60" rx="9" fill="#e4eff1"/><text x="780" y="260">输出字段，程序再校验</text></g><g stroke="#567b76" stroke-width="2.5" fill="none" marker-end="url(#a)"><path d="M162 123H205"/><path d="M380 123H425"/><path d="M715 123H760"/><path d="M277 254H425"/><path d="M715 254H760"/></g><text x="32" y="325" font-size="14" fill="#516a67">教学示意：版面检测、裁剪与合并是系统流水线；并非每种调用都必须经过这些步骤。</text></g></svg>
