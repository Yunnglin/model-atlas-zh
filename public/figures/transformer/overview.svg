<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="300" viewBox="0 0 1060 300" role="img" aria-labelledby="t d"><title id="t">原始 Transformer 编码器与解码器</title><desc id="d">源句编码得到表示，解码器利用已生成目标前缀进行带掩码自注意力，再通过交叉注意力读取源句表示并生成下一个词。</desc><rect width="1060" height="300" rx="16" fill="#f5faf8"/><g fill="#fff" stroke="#87b6a4"><rect x="20" y="50" width="170" height="70" rx="8"/><rect x="225" y="50" width="220" height="70" rx="8"/><rect x="20" y="170" width="170" height="70" rx="8"/><rect x="225" y="170" width="220" height="70" rx="8"/><rect x="500" y="170" width="220" height="70" rx="8"/><rect x="755" y="170" width="280" height="70" rx="8"/></g><g font-family="sans-serif" text-anchor="middle" fill="#203b35"><text x="105" y="90" font-size="16">源句</text><text x="335" y="80" font-size="16">编码器</text><text x="335" y="103" font-size="13">自注意力 + 前馈</text><text x="105" y="210" font-size="16">已生成前缀</text><text x="335" y="200" font-size="16">解码器自注意力</text><text x="335" y="223" font-size="13">掩码禁止查看未来</text><text x="610" y="200" font-size="16">交叉注意力</text><text x="610" y="223" font-size="13">读取源句表示</text><text x="895" y="200" font-size="16">词表投影</text><text x="895" y="223" font-size="13">生成下一个 token</text><text x="530" y="278" font-size="13">教学简图：前馈在每层内；编码器和解码器多层堆叠，省略位置编码、残差和归一化。</text></g><g fill="none" stroke="#468b75" stroke-width="3" marker-end="url(#a)"><path d="M190 85H225"/><path d="M190 205H225"/><path d="M445 205H500"/><path d="M720 205H755"/><path d="M445 85H610V170"/></g><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#468b75"/></marker></defs></svg>
