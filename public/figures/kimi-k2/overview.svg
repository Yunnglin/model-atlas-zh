<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="290" viewBox="0 0 1060 290" role="img" aria-labelledby="title desc"><title id="title">Kimi K2 模型与工具交互示意</title><desc id="desc">需求与工具结果进入 Kimi K2，模型利用注意力和混合专家生成文字或工具请求，外部工具执行并回传结果。</desc><rect width="1060" height="290" rx="18" fill="#f4f8f7"/><text x="32" y="42" font-family="sans-serif" font-size="23" font-weight="700" fill="#173b3d">从任务到工具结果：模型与执行器各司其职</text><g font-family="sans-serif" text-anchor="middle" fill="#173b3d"><rect x="30" y="100" width="170" height="85" rx="10" fill="#fff" stroke="#a8c7c4"/><text x="115" y="134" font-size="16">用户任务</text><text x="115" y="160" font-size="13">需求 + 已有上下文</text><rect x="250" y="83" width="235" height="120" rx="12" fill="#dcefeb" stroke="#67a59c"/><text x="367" y="120" font-size="17">Kimi K2</text><text x="367" y="148" font-size="14">注意力 / MLA</text><text x="367" y="174" font-size="14">稀疏专家 MoE</text><rect x="545" y="100" width="200" height="85" rx="10" fill="#fff" stroke="#a8c7c4"/><text x="645" y="134" font-size="16">工具请求</text><text x="645" y="160" font-size="13">文本或结构化参数</text><rect x="805" y="100" width="205" height="85" rx="10" fill="#fff" stroke="#a8c7c4"/><text x="907" y="134" font-size="16">外部执行器</text><text x="907" y="160" font-size="13">读文件、运行测试</text><path d="M200 142h43" fill="none" stroke="#357f77" stroke-width="2" marker-end="url(#a)"/><path d="M485 142h53" fill="none" stroke="#357f77" stroke-width="2" marker-end="url(#a)"/><path d="M745 142h53" fill="none" stroke="#357f77" stroke-width="2" marker-end="url(#a)"/><path d="M907 191v38H367v-20" fill="none" stroke="#357f77" stroke-width="2" marker-end="url(#a)"/><text x="640" y="252" font-size="13" fill="#4b6666">工具结果回到上下文，模型再决定下一步</text></g><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#357f77"/></marker></defs></svg>
