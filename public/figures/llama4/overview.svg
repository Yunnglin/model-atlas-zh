<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc"><title id="title">Llama 4 图文输入与专家模型示意</title><desc id="desc">文本和图片输入经视觉及文本处理后送入自回归混合专家模型，由路由选择部分专家；Maverick 在 MoE 层中每个 token 同时使用共享专家和一个路由专家；输出文字并进行独立核验。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#62978a"/></marker></defs><rect width="1100" height="420" rx="20" fill="#f5f9f8"/><text x="35" y="45" font-family="sans-serif" font-size="23" font-weight="700" fill="#183e46">图文理解与混合专家：从发票到回答</text>
<g font-family="sans-serif" fill="#183e46"><rect x="35" y="90" width="195" height="90" rx="12" fill="#fff" stroke="#a0c6bc"/><text x="53" y="125" font-size="18" font-weight="700">发票图片</text><text x="53" y="154" font-size="15">视觉组件处理</text><rect x="35" y="210" width="195" height="90" rx="12" fill="#fff" stroke="#a0c6bc"/><text x="53" y="245" font-size="18" font-weight="700">文字问题</text><text x="53" y="274" font-size="15">“合计金额多少？”</text><rect x="300" y="92" width="440" height="208" rx="14" fill="#e3f1ec" stroke="#69a995"/><text x="320" y="126" font-size="19" font-weight="700">自回归语言模型 · 图文融合</text><rect x="320" y="150" width="145" height="55" rx="9" fill="#fff" stroke="#9cc4b9"/><text x="339" y="183" font-size="16">路由选择</text><rect x="510" y="142" width="205" height="45" rx="8" fill="#d4e8fd" stroke="#a3bbda"/><text x="526" y="171" font-size="15">部分专家参与计算</text><rect x="510" y="199" width="205" height="45" rx="8" fill="#fff" stroke="#a3bbda"/><text x="526" y="228" font-size="15">其他专家本次不参与</text><text x="320" y="277" font-size="14">Maverick 的 MoE 层：共享专家 + 1 个路由专家。</text><rect x="810" y="100" width="255" height="85" rx="12" fill="#fff" stroke="#a0c6bc"/><text x="828" y="133" font-size="18" font-weight="700">生成文字回答</text><text x="828" y="160" font-size="15">金额、日期或不确定</text><rect x="810" y="215" width="255" height="85" rx="12" fill="#fff4e6" stroke="#d7b77d"/><text x="828" y="248" font-size="18" font-weight="700">独立核对</text><text x="828" y="275" font-size="15">检查原图、金额与证据</text></g><g stroke="#62978a" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M230 135 H270 V175 H299"/><path d="M230 255 H270 V220 H299"/><path d="M465 177 H509"/><path d="M740 143 H809"/><path d="M938 185 V214"/></g><text x="35" y="385" font-family="sans-serif" font-size="14" fill="#59736e">教学示意，非官方逐层架构图；独立核验不属于模型内部组件。</text></svg>
