<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 310" role="img" aria-labelledby="title desc">
<title id="title">InstructGPT 的三阶段训练</title><desc id="desc">人写示范用于训练 SFT 模型，人排序模型候选答案用于训练奖励模型，PPO 使用奖励模型与参考模型的偏离惩罚更新策略，PPO-ptx 再混合预训练梯度。</desc>
<rect width="1050" height="310" rx="20" fill="#f4f8f7"/><g font-family="sans-serif" fill="#19313d"><text x="40" y="40" font-size="23" font-weight="700">从示范到偏好：InstructGPT 的训练流程</text><text x="40" y="67" font-size="15">原创教学示意，依据 2022 论文；每阶段数据作用不同</text>
<g fill="#fff" stroke="#83aaa0" stroke-width="2"><rect x="40" y="96" width="285" height="118" rx="10"/><rect x="382" y="96" width="285" height="118" rx="10"/><rect x="724" y="96" width="285" height="118" rx="10"/></g><g font-size="18" text-anchor="middle"><text x="182" y="126" font-weight="700">① 监督微调 SFT</text><text x="182" y="155" font-size="15">人写示范 → 训练回答模型</text><text x="182" y="182" font-size="15">得到初始策略与参考策略</text><text x="524" y="126" font-weight="700">② 训练奖励模型 RM</text><text x="524" y="155" font-size="15">人给候选回答排序</text><text x="524" y="182" font-size="15">RM 学习预测相对偏好</text><text x="866" y="126" font-weight="700">③ PPO 更新策略</text><text x="866" y="155" font-size="15">采样回答 → RM 打分 → 更新</text><text x="866" y="182" font-size="15">加入相对 SFT 的偏离惩罚</text></g><g stroke="#397e72" stroke-width="3" fill="none"><path d="M326 155h48m-10-6 10 6-10 6M668 155h48m-10-6 10 6-10 6"/></g><text x="40" y="254" font-size="16">PPO-ptx 还混合预训练梯度，以缓解部分基准上的能力下降。</text><text x="40" y="280" font-size="15">RM 的评分是学习到的代理信号，不能替代独立的人类评测。</text></g></svg>
