<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Qwen3-VL 多模态召回与重排</title><desc id="desc">查询与候选资料分别经同一 Embedding 模型编码，向量检索筛选候选，随后 Reranker 联合查看原查询和候选，产生排序。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#44796f"/></marker></defs>
<rect width="1200" height="460" rx="20" fill="#f3f8f6"/><text x="36" y="49" fill="#193c39" font-family="sans-serif" font-size="25" font-weight="700">先海选，再复核</text><text x="36" y="78" fill="#56736d" font-family="sans-serif" font-size="15">两种模型使用不同权重；图为流程示意，省略具体网络层</text>
<g font-family="sans-serif" text-anchor="middle"><g fill="#fff" stroke="#a4c8be" stroke-width="2"><rect x="40" y="112" width="160" height="76" rx="12"/><rect x="40" y="222" width="160" height="76" rx="12"/><rect x="250" y="112" width="180" height="76" rx="12"/><rect x="250" y="222" width="180" height="76" rx="12"/><rect x="485" y="167" width="185" height="76" rx="12"/><rect x="725" y="167" width="190" height="76" rx="12"/><rect x="970" y="167" width="180" height="76" rx="12"/></g>
<g fill="#173f39" font-size="18" font-weight="700"><text x="120" y="144">查询</text><text x="120" y="254">资料库</text><text x="340" y="144">Embedding</text><text x="340" y="254">Embedding</text><text x="577" y="199">向量检索</text><text x="820" y="199">Reranker</text><text x="1060" y="199">排序结果</text></g>
<g fill="#56736d" font-size="14"><text x="120" y="169">文字 / 图片</text><text x="120" y="279">图文 / 文档 / 视频</text><text x="340" y="169">问题向量</text><text x="340" y="279">资料向量，可提前建库</text><text x="577" y="225">选出前 K 个候选</text><text x="820" y="225">查询与候选一起评分</text><text x="1060" y="225">保留原始出处</text></g></g>
<g fill="none" stroke="#44796f" stroke-width="2.5" marker-end="url(#arrow)"><path d="M200 150H250"/><path d="M200 260H250"/><path d="M430 150H455V185H485"/><path d="M430 260H455V225H485"/><path d="M670 205H725"/><path d="M915 205H970"/><path d="M120 112V100H820V167"/></g><text x="510" y="96" fill="#56736d" font-family="sans-serif" font-size="13">原始查询送入重排</text><text x="40" y="374" fill="#345d56" font-family="sans-serif" font-size="16">海选漏掉的资料无法靠重排找回；评价时分别检查召回、排序和延迟。</text><text x="40" y="407" fill="#67817a" font-family="sans-serif" font-size="13">原创教学示意 · 基于 Qwen3-VL-Embedding 官方技术报告</text>
</svg>
