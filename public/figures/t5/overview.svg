<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="300" viewBox="0 0 1060 300" role="img" aria-labelledby="title desc">
<title id="title">T5 编码器和解码器示意</title><desc id="desc">任务前缀和输入经编码器，解码器通过交叉注意力读取输入，并逐步生成输出文字。</desc><rect width="1060" height="300" rx="18" fill="#f4f8f7"/>
<g font-family="system-ui, sans-serif" fill="#17364b"><text x="32" y="42" font-size="20" font-weight="700">T5：把任务写成文字输入和文字输出</text><text x="32" y="72" font-size="14">教学示意：训练看正确前缀，生成看已生成前缀；均不能看未来目标</text></g>
<g fill="#fff" stroke="#9ecac3" stroke-width="2"><rect x="30" y="110" width="215" height="112" rx="12"/><rect x="300" y="110" width="200" height="112" rx="12"/><rect x="555" y="110" width="220" height="112" rx="12"/><rect x="830" y="110" width="200" height="112" rx="12"/></g>
<g font-family="system-ui, sans-serif" fill="#17364b" text-anchor="middle"><text x="137" y="150" font-size="18" font-weight="700">任务 + 输入</text><text x="137" y="182" font-size="14">summarize: 原文</text><text x="400" y="150" font-size="18" font-weight="700">编码器</text><text x="400" y="182" font-size="14">双向读取输入</text><text x="665" y="150" font-size="18" font-weight="700">解码器</text><text x="665" y="182" font-size="14">读取输入并逐步生成</text><text x="930" y="150" font-size="18" font-weight="700">文字输出</text><text x="930" y="182" font-size="14">摘要 / 标签 / 译文</text></g>
<g fill="none" stroke="#168779" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M 250 166 H 286 M 277 158 L 286 166 L 277 174"/><path d="M 505 166 H 541 M 532 158 L 541 166 L 532 174"/><path d="M 780 166 H 816 M 807 158 L 816 166 L 807 174"/></g><text x="35" y="268" fill="#52716d" font-family="system-ui, sans-serif" font-size="14">预训练用片段破坏与重建；下游任务仍需对应数据和评测。</text></svg>
