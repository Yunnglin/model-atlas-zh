<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="300" viewBox="0 0 1060 300" role="img" aria-labelledby="title desc">
<title id="title">MiniMax-M2 模型与工具循环</title><desc id="desc">任务与上下文进入模型，模型发出工具请求，外部执行器运行工具并将结果返回模型，模型继续处理或生成答案。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#468b75"/></marker></defs><rect width="1060" height="300" rx="16" fill="#f5faf8"/>
<g fill="#fff" stroke="#87b6a4"><rect x="20" y="80" width="150" height="80" rx="8"/><rect x="205" y="70" width="275" height="100" rx="8"/><rect x="515" y="80" width="170" height="80" rx="8"/><rect x="720" y="80" width="160" height="80" rx="8"/><rect x="915" y="80" width="125" height="80" rx="8"/></g>
<g font-family="sans-serif" text-anchor="middle" fill="#203b35"><text x="95" y="116" font-size="16">任务与上下文</text><text x="342" y="106" font-size="16">M2 解码器</text><text x="342" y="130" font-size="13">全注意力 + MoE 专家</text><text x="342" y="150" font-size="13">逐 token 生成</text><text x="600" y="116" font-size="15">工具请求</text><text x="800" y="112" font-size="15">外部执行器</text><text x="800" y="135" font-size="13">执行并返回结果</text><text x="977" y="112" font-size="15">模型输出</text><text x="977" y="135" font-size="13">继续处理或回答</text><text x="550" y="223" font-size="13">工具结果返回模型</text><text x="530" y="261" font-size="13">教学简图：工具位于模型之外，省略权限管理与网络内部细节。</text></g>
