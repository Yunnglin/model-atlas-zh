<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Qwen2-Math 训练路线示意</title><desc id="desc">Qwen2 基座经过数学继续预训练得到 Math Base，之后通过筛选数据监督微调和 GRPO 得到指令模型；奖励模型与答案正确性为训练提供信号。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#60807e"/></marker></defs>
<rect width="1200" height="390" rx="22" fill="#f3f8f7"/>
<text x="40" y="46" font-size="23" font-weight="700" fill="#153f42">从通用语言模型到数学解题模型</text>
<g font-family="sans-serif" text-anchor="middle" fill="#183f42"><rect x="38" y="106" width="195" height="92" rx="12" fill="#fff" stroke="#a5c8c1"/><text x="135" y="143" font-size="20" font-weight="700">Qwen2</text><text x="135" y="173" font-size="15">通用语言底座</text><rect x="303" y="106" width="195" height="92" rx="12" fill="#e0f2ed" stroke="#72b5a4"/><text x="400" y="143" font-size="20" font-weight="700">数学继续预训练</text><text x="400" y="173" font-size="15">数学文本、代码等</text><rect x="568" y="106" width="195" height="92" rx="12" fill="#fff" stroke="#a5c8c1"/><text x="665" y="143" font-size="20" font-weight="700">Math Base</text><text x="665" y="173" font-size="15">数学领域基础模型</text><rect x="834" y="106" width="320" height="92" rx="12" fill="#e0f2ed" stroke="#72b5a4"/><text x="994" y="143" font-size="20" font-weight="700">SFT → GRPO</text><text x="994" y="173" font-size="15">学会回答，再按奖励信号优化</text><rect x="834" y="252" width="320" height="70" rx="12" fill="#fff" stroke="#a5c8c1"/><text x="994" y="281" font-size="17" font-weight="700">数学奖励模型 + 答案正确性</text><text x="994" y="306" font-size="14">为数据筛选和强化学习提供信号</text></g>
<g stroke="#60807e" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M235 152H297"/><path d="M500 152H562"/><path d="M765 152H828"/><path d="M994 248V204"/></g><text x="40" y="365" font-size="15" font-family="sans-serif" fill="#56706e">示意图：忽略训练系统细节；奖励模型是训练信号，不是推理时必需的计算器。</text></svg>
