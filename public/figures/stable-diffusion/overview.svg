<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="260" viewBox="0 0 1060 260" role="img" aria-labelledby="title desc"><title id="title">Stable Diffusion v1 文本条件生成流程</title><desc id="desc">文本经 CLIP 文本编码器成为条件，随机潜噪声进入 U-Net 和采样器反复更新，最后由 VAE 解码器生成图片。</desc><rect width="1060" height="260" rx="16" fill="#f5f9f7"/><text x="30" y="37" fill="#193d38" font-size="20" font-family="sans-serif" font-weight="bold">Stable Diffusion v1：文字引导潜空间去噪（教学示意）</text><g font-family="sans-serif" text-anchor="middle" fill="#183a35"><rect x="30" y="56" width="160" height="55" rx="10" fill="#fff" stroke="#86aaa0"/><text x="110" y="90" font-size="16">文字提示</text><rect x="30" y="146" width="160" height="55" rx="10" fill="#fff" stroke="#86aaa0"/><text x="110" y="180" font-size="16">随机潜噪声</text><rect x="250" y="56" width="180" height="55" rx="10" fill="#e6f3ef" stroke="#77aa99"/><text x="340" y="90" font-size="16">CLIP 文本编码器</text><rect x="490" y="120" width="180" height="70" rx="10" fill="#f1ecfa" stroke="#aa9ac5"/><text x="580" y="149" font-size="16">U-Net + 采样器</text><text x="580" y="173" font-size="13">预测与更新，反复多步</text><rect x="735" y="120" width="160" height="70" rx="10" fill="#fff5e8" stroke="#c9a679"/><text x="815" y="149" font-size="16">VAE 解码器</text><text x="815" y="173" font-size="13">潜表示 → 像素</text><text x="984" y="160" font-size="16">图片</text></g><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#527f73"/></marker></defs><g stroke="#527f73" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M190 83h54"/><path d="M430 83h85l40 31"/><path d="M190 173h294"/><path d="M670 155h59"/><path d="M895 155h54"/><path d="M600 192v18H465v-34h19"/></g><text x="530" y="240" text-anchor="middle" fill="#52706a" font-size="13" font-family="sans-serif">此图展示生成；训练时真实图片需先编码加噪。并非官方架构图</text></svg>
