<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
<title id="title">GPT-4o 公开输入输出示意</title><desc id="desc">模型层面的文本、图像、音频与视频输入和文本、图像、音频输出；具体产品或 API 仅开放其中一部分。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#668489"/></marker></defs>
<rect width="1100" height="360" rx="18" fill="#f4f9f8"/><g font-family="sans-serif" fill="#183d49"><text x="35" y="42" font-size="22" font-weight="700">GPT-4o：公开的多模态输入与输出</text><rect x="40" y="83" width="240" height="164" rx="12" fill="#fff" stroke="#a8ccc6"/><text x="62" y="115" font-size="17" font-weight="700">可能的输入</text><text x="62" y="150" font-size="16">文字　图片</text><text x="62" y="183" font-size="16">音频　视频</text><text x="62" y="219" font-size="13" fill="#55747a">按具体产品和接口选择</text><rect x="375" y="100" width="350" height="130" rx="14" fill="#e3f2ef" stroke="#7db5ac"/><text x="408" y="140" font-size="19" font-weight="700">GPT-4o 多模态模型</text><text x="408" y="174" font-size="15">系统卡描述：同一神经网络</text><text x="408" y="200" font-size="15">内部具体结构未公开</text><rect x="820" y="83" width="240" height="164" rx="12" fill="#fff" stroke="#a8ccc6"/><text x="842" y="115" font-size="17" font-weight="700">可能的输出</text><text x="842" y="150" font-size="16">文字　音频</text><text x="842" y="183" font-size="16">图像</text><text x="842" y="219" font-size="13" fill="#55747a">并非每个接口都开放</text><rect x="130" y="274" width="840" height="50" rx="10" fill="#eaf0f6"/><text x="152" y="305" font-size="15">应用层还负责采集、传输、播放、打断、工具和审核；模型能力不等于接口能力。</text></g><g fill="none" stroke="#668489" stroke-width="2" marker-end="url(#a)"><path d="M280 165H365"/><path d="M725 165H810"/></g></svg>
