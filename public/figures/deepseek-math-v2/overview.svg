<g font-family="sans-serif" text-anchor="middle" fill="#203b35"><text x="85" y="121" font-size="16">数学问题</text><text x="285" y="108" font-size="16">证明生成器</text><text x="285" y="130" font-size="13">生成证明与自查</text><text x="520" y="108" font-size="16">验证器</text><text x="520" y="130" font-size="13">指出问题并评分</text><text x="755" y="108" font-size="16">元验证器</text><text x="755" y="130" font-size="13">检查批评是否成立</text><text x="960" y="108" font-size="15">反馈与训练</text><text x="960" y="130" font-size="13">改进生成和验证</text><text x="530" y="225" font-size="13">训练角色教学简图；最终高计算评测用同一生成模型反复生成、验证和修订。</text><text x="530" y="247" font-size="13">自然语言验证并非形式证明，图省略标注、奖励与迭代细节。</text></g>
