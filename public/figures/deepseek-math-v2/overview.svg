<title id="title">DeepSeekMath-V2 证明与验证流程</title><desc id="desc">问题进入证明生成器，验证器分析证明，元验证器检查分析；反馈帮助改进生成器。最终推理可使用同一生成模型生成、验证和修订。</desc>
