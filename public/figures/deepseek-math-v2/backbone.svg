<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 255" role="img" aria-labelledby="title desc">
<title id="title">DeepSeekMath-V2 的语言骨干</title><desc id="desc">文本经分词进入六十一层解码器，前馈部分先是三层稠密网络再是五十八层 MoE；注意力使用 DeepSeek V3.2 稀疏注意力结构，然后预测下一个 token。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#087b7c"/></marker></defs><rect width="960" height="255" rx="18" fill="#f5f9f8"/>
<g font-family="system-ui,sans-serif" fill="#183b45"><text x="30" y="42" font-size="23" font-weight="700">DeepSeekMath-V2：沿用 V3.2 的稀疏语言骨干</text>
<g fill="#fff" stroke="#c5ded8"><rect x="30" y="78" width="175" height="100" rx="10"/><rect x="260" y="78" width="435" height="100" rx="10"/><rect x="755" y="78" width="175" height="100" rx="10"/></g>
<g font-size="17"><text x="50" y="113">问题与已有文本</text><text x="50" y="146">分词、嵌入</text><text x="280" y="111">61 层解码器：稀疏注意力 + 前馈</text><text x="280" y="146">前馈：前 3 层 Dense，后 58 层 MoE</text><text x="775" y="113">词表输出</text><text x="775" y="146">继续生成</text></g>
<g fill="none" stroke="#087b7c" stroke-width="2.5" marker-end="url(#a)"><path d="M210 128 H250"/><path d="M700 128 H745"/></g><text x="30" y="218" font-size="15" fill="#526b72">根据官方配置简化；生成与验证是同一语言骨干的不同任务。</text></g></svg>
