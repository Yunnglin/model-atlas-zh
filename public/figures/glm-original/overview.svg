<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="260" viewBox="0 0 1060 260" role="img" aria-labelledby="title desc"><title id="title">原始 GLM 自回归填空示意</title><desc id="desc">原文挖掉一个连续片段，保留上下文作为部分 A，模型从开始标记逐词生成部分 B 并输出结束标记。</desc><rect width="1060" height="260" rx="16" fill="#f5f9f7"/><text x="30" y="38" fill="#193d38" font-size="20" font-family="sans-serif" font-weight="bold">原始 GLM：先挖空，再利用上下文逐步填回（教学示意）</text><g font-family="sans-serif" fill="#183a35"><rect x="28" y="65" width="455" height="50" rx="10" fill="#fff" stroke="#86aaa0"/><text x="48" y="96" font-size="16">原文：小林带伞，因为天气预报说今天下雨</text><rect x="28" y="145" width="455" height="62" rx="10" fill="#e6f3ef" stroke="#77aa99"/><text x="48" y="172" font-size="16">Part A：小林带伞，因为 [MASK] 今天下雨</text><text x="48" y="195" font-size="13">可见上下文相互读取；看不到答案部分</text><rect x="577" y="95" width="450" height="100" rx="10" fill="#f1ecfa" stroke="#aa9ac5"/><text x="597" y="126" font-size="16">Part B： [START] → 天气 → 预报 → 说 → [END]</text><text x="597" y="155" font-size="14">读取 Part A 和已经生成的内容</text><text x="597" y="179" font-size="14">位置编码指明“哪个空”与“空内第几步”</text></g><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#527f73"/></marker></defs><g stroke="#527f73" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M255 116v24"/><path d="M483 176h88"/></g><text x="530" y="239" text-anchor="middle" fill="#52706a" font-size="13" font-family="sans-serif">单空示意，实际 token 切分与标记请以模型实现为准；并非官方架构图</text></svg>
