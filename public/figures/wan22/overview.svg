<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Wan2.2 双专家与 TI2V 路线</title><desc id="desc">A14B 使用高噪声专家与低噪声专家分别多次更新同一视频潜在状态，依次完成后再解码；TI2V-5B 是独立稠密模型，支持文字或图片条件。</desc><rect width="1200" height="430" rx="20" fill="#f5f9f8"/><text x="42" y="48" font-family="sans-serif" font-size="24" font-weight="700" fill="#183a40">Wan2.2：两种不同的视频生成路线</text><g font-family="sans-serif" fill="#183a40" text-anchor="middle"><g fill="#fff" stroke="#a5c9c1" stroke-width="2"><rect x="45" y="100" width="180" height="95" rx="12"/><rect x="270" y="100" width="210" height="95" rx="12"/><rect x="525" y="100" width="210" height="95" rx="12"/><rect x="780" y="100" width="175" height="95" rx="12"/><rect x="1000" y="100" width="155" height="95" rx="12"/><rect x="45" y="255" width="1110" height="90" rx="12" fill="#e4f1ef"/></g><g font-size="18" font-weight="700"><text x="135" y="137">文字与噪声</text><text x="375" y="137">高噪声专家</text><text x="630" y="137">低噪声专家</text><text x="867" y="137">VAE 解码</text><text x="1078" y="137">视频</text><text x="600" y="291">独立路线：TI2V-5B 稠密模型 + 高压缩 VAE</text></g><g font-size="15" fill="#4b676b"><text x="135" y="165">输入条件</text><text x="375" y="165">前期：整体布局</text><text x="630" y="165">后期：细节处理</text><text x="867" y="165">还原画面</text><text x="1078" y="165">连续画面</text><text x="600" y="321">可接收文字或图像条件；不是 A14B 的一个专家</text></g></g><g fill="none" stroke="#468d83" stroke-width="3" marker-end="url(#a)"><path d="M225 148h45"/><path d="M480 148h45"/><path d="M735 148h45"/><path d="M955 148h45"/><path d="M435 100V80H315V100"/><path d="M690 100V80H570V100"/></g><text x="45" y="390" font-family="sans-serif" font-size="15" fill="#4b676b">教学示意：循环箭头表示多次更新；专家依次处理同一潜在状态，完成后解码。</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#468d83"/></marker></defs></svg>
