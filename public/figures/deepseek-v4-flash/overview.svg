<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="260" viewBox="0 0 1060 260" role="img" aria-labelledby="title desc"><title id="title">DeepSeek-V4-Flash 混合注意力教学示意</title><desc id="desc">输入经过前两层滑动窗口注意力，后续层交替使用 CSA 和 HCA 与局部窗口；每层包含专家前馈，再逐步生成输出。</desc><rect width="1060" height="260" rx="16" fill="#f5faf8"/><g fill="#fff" stroke="#87b6a4"><rect x="20" y="70" width="145" height="80" rx="8"/><rect x="200" y="70" width="180" height="80" rx="8"/><rect x="415" y="45" width="285" height="130" rx="8"/><rect x="910" y="70" width="130" height="80" rx="8"/></g><g font-family="sans-serif" text-anchor="middle" fill="#203b35"><text x="92" y="105" font-size="16">输入 token</text><text x="290" y="100" font-size="16">前两层</text><text x="290" y="125" font-size="14">滑动窗口</text><text x="557" y="82" font-size="16">后续层交替</text><text x="557" y="108" font-size="14">CSA：压缩 + 候选筛选</text><text x="557" y="133" font-size="14">HCA：更高比例压缩</text><text x="975" y="105" font-size="16">预测输出</text><text x="530" y="220" font-size="13">教学简图：各层含 MoE，后续层有局部窗口；省略重叠压缩、mHC 与层内细节。</text></g><g fill="none" stroke="#468b75" stroke-width="3" marker-end="url(#a)"><path d="M165 110H190"/><path d="M380 110H405"/><path d="M700 110H900"/></g><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#468b75"/></marker></defs></svg>
