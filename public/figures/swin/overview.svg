<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="300" viewBox="0 0 1060 300" role="img" aria-labelledby="title desc"><title id="title">Swin 窗口移位和特征合并示意</title><desc id="desc">常规窗口内部交流，相邻层错开窗口边界进行跨窗口交流，之后合并邻近特征形成较粗尺度。</desc><rect width="1060" height="300" rx="18" fill="#f4f8f7"/><text x="32" y="42" font-family="sans-serif" font-size="23" font-weight="700" fill="#173b3d">先在窗口内交流，再错开边界，再合并特征</text><g font-family="sans-serif" fill="#173b3d" text-anchor="middle"><text x="150" y="80" font-size="16">常规窗口</text><text x="420" y="80" font-size="16">错开窗口边界</text><text x="780" y="80" font-size="16">合并邻近位置</text><rect x="70" y="100" width="160" height="160" fill="#fff" stroke="#abc8c5"/><path d="M110 100v160M150 100v160M190 100v160M70 140h160M70 180h160M70 220h160" stroke="#d2e0de"/><path d="M150 100v160M70 180h160" stroke="#238075" stroke-width="4"/><rect x="340" y="100" width="160" height="160" fill="#fff" stroke="#abc8c5"/><path d="M380 100v160M420 100v160M460 100v160M340 140h160M340 180h160M340 220h160" stroke="#d2e0de"/><path d="M380 100v160M460 100v160M340 140h160M340 220h160" stroke="#238075" stroke-width="4"/><rect x="680" y="110" width="105" height="105" fill="#fff" stroke="#abc8c5"/><path d="M732.5 110v105M680 162.5h105" stroke="#238075" stroke-width="3"/><rect x="835" y="137" width="52" height="52" fill="#dcefeb" stroke="#238075" stroke-width="2"/><path d="M235 180h90" fill="none" stroke="#357f77" stroke-width="2" marker-end="url(#a)"/><path d="M510 180h150" fill="none" stroke="#357f77" stroke-width="2" marker-end="url(#a)"/><path d="M790 164h38" fill="none" stroke="#357f77" stroke-width="2" marker-end="url(#a)"/><text x="790" y="247" font-size="13" fill="#4b6666">2 × 2 特征拼接并投影</text><text x="290" y="276" font-size="13" fill="#4b6666">绿色线表示教学用窗口边界，边缘掩码未展开</text></g><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#357f77"/></marker></defs></svg>
