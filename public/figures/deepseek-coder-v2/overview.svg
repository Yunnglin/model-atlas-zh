<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="260" viewBox="0 0 1060 260" role="img" aria-labelledby="title desc"><title id="title">DeepSeek-Coder-V2 代码生成与外部验证</title><desc id="desc">代码和指令进入解码器，经过注意力及专家网络生成代码，外部环境执行测试并反馈结果。</desc><rect width="1060" height="260" rx="16" fill="#f5faf8"/><g fill="#fff" stroke="#87b6a4"><rect x="20" y="70" width="170" height="80" rx="8"/><rect x="230" y="55" width="300" height="110" rx="8"/><rect x="570" y="70" width="170" height="80" rx="8"/><rect x="780" y="70" width="255" height="80" rx="8"/></g><g font-family="sans-serif" text-anchor="middle" fill="#203b35"><text x="105" y="105" font-size="16">问题与代码上下文</text><text x="105" y="128" font-size="13">例如函数签名和要求</text><text x="380" y="88" font-size="16">自回归解码器</text><text x="380" y="113" font-size="14">注意力（MLA） + 专家网络</text><text x="380" y="140" font-size="13">逐个预测后续 token</text><text x="655" y="105" font-size="16">生成代码</text><text x="907" y="105" font-size="16">外部执行与测试</text><text x="907" y="128" font-size="13">工具不在模型内部</text><text x="645" y="184" font-size="13">可选：工具结果返回模型</text><text x="530" y="236" font-size="13">教学简图：省略层次、残差、位置编码与路由细节；执行测试是可选的外部流程。</text></g><g fill="none" stroke="#468b75" stroke-width="3" marker-end="url(#a)"><path d="M190 110H220"/><path d="M530 110H560"/><path d="M740 110H770"/><path d="M907 150V195H380V175"/></g><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#468b75"/></marker></defs></svg>
