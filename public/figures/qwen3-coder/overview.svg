<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="260" viewBox="0 0 1060 260" role="img" aria-labelledby="title desc"><title id="title">Qwen3-Coder 与外部开发工具教学简图</title><desc id="desc">需求和代码进入因果语言模型，经注意力和稀疏专家生成代码或工具请求，外部工具执行并将结果反馈模型。</desc><rect width="1060" height="260" rx="16" fill="#f5faf8"/><g font-family="sans-serif" text-anchor="middle" fill="#203b35"><g fill="#fff" stroke="#87b6a4"><rect x="20" y="55" width="145" height="70" rx="8"/><rect x="215" y="35" width="280" height="110" rx="8"/><rect x="550" y="55" width="155" height="70" rx="8"/><rect x="770" y="55" width="265" height="70" rx="8"/></g><text x="92" y="97" font-size="16">需求与代码</text><text x="355" y="73" font-size="17">Qwen3-Coder</text><text x="355" y="102" font-size="14">因果注意力 + MoE</text><text x="627" y="97" font-size="16">代码 / 工具请求</text><text x="902" y="87" font-size="16">外部工具与环境</text><text x="902" y="110" font-size="14">读文件、修改、运行测试</text><text x="535" y="210" font-size="13">教学示意：外部工具非模型组件；省略注意力与专家层的内部细节。</text></g><g fill="none" stroke="#468b75" stroke-width="3" marker-end="url(#a)"><path d="M165 90H205"/><path d="M495 90H540"/><path d="M705 90H760"/><path d="M900 125V175H355V155"/></g><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#468b75"/></marker></defs></svg>
