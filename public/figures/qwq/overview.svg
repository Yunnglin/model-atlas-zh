<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="260" viewBox="0 0 1060 260" role="img" aria-labelledby="title desc"><title id="title">QwQ-32B 两阶段强化学习教学示意</title><desc id="desc">从冷启动检查点出发，先根据数学验证和代码测试提供奖励，再用通用奖励模型及规则验证继续训练。</desc><rect width="1060" height="260" rx="16" fill="#f5faf8"/><g fill="#fff" stroke="#87b6a4"><rect x="20" y="60" width="200" height="100" rx="8"/><rect x="255" y="60" width="275" height="100" rx="8"/><rect x="565" y="60" width="275" height="100" rx="8"/><rect x="875" y="60" width="165" height="100" rx="8"/></g><g font-family="sans-serif" text-anchor="middle" fill="#203b35"><text x="120" y="96" font-size="16">冷启动检查点</text><text x="120" y="122" font-size="13">具体构建未披露</text><text x="392" y="96" font-size="16">数学和代码强化学习</text><text x="392" y="122" font-size="13">答案验证 / 代码测试</text><text x="702" y="96" font-size="16">通用能力强化学习</text><text x="702" y="122" font-size="13">奖励模型 + 规则验证</text><text x="957" y="96" font-size="16">QwQ-32B</text><text x="957" y="122" font-size="13">生成推理和回答</text><text x="530" y="220" font-size="13">教学简图：展示官方披露的阶段；省略数据细节、更新算法和训练超参数。</text></g><g fill="none" stroke="#468b75" stroke-width="3" marker-end="url(#a)"><path d="M220 110H245"/><path d="M530 110H555"/><path d="M840 110H865"/></g><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#468b75"/></marker></defs></svg>
