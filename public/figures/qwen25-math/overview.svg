<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="280" viewBox="0 0 1060 280" role="img" aria-labelledby="title desc"><title id="title">Qwen2.5-Math 数学训练与工具推理</title><desc id="desc">数学语料用于训练底座，奖励模型辅助筛选训练数据和强化学习；推理时模型可直接回答或请求外部工具计算，工具结果返回模型。</desc><rect width="1060" height="280" rx="16" fill="#f5faf8"/><g fill="#fff" stroke="#87b6a4"><rect x="15" y="65" width="185" height="80" rx="8"/><rect x="235" y="65" width="190" height="80" rx="8"/><rect x="460" y="65" width="190" height="80" rx="8"/><rect x="685" y="65" width="160" height="80" rx="8"/><rect x="880" y="65" width="165" height="80" rx="8"/></g><g font-family="sans-serif" text-anchor="middle" fill="#203b35"><text x="108" y="97" font-size="16">数学语料</text><text x="108" y="120" font-size="13">收集 + 合成</text><text x="330" y="97" font-size="16">数学底座</text><text x="330" y="120" font-size="13">继续预训练</text><text x="555" y="97" font-size="16">指令与强化训练</text><text x="555" y="120" font-size="13">奖励模型辅助</text><text x="765" y="97" font-size="16">模型作答</text><text x="765" y="120" font-size="13">文字或工具请求</text><text x="962" y="97" font-size="16">外部工具</text><text x="962" y="120" font-size="13">可选运行代码</text><text x="530" y="215" font-size="13">教学简图：奖励模型还可用于推理阶段筛选；外部工具不是模型内部组件。</text><text x="530" y="238" font-size="13">省略数据筛选和多次迭代等细节，非官方结构图。</text></g><g fill="none" stroke="#468b75" stroke-width="3" marker-end="url(#a)"><path d="M200 105H225"/><path d="M425 105H450"/><path d="M650 105H675"/><path d="M845 105H870"/><path d="M962 145V178H765V155"/></g><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#468b75"/></marker></defs></svg>
