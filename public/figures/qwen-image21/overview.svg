<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Qwen-Image-2.1 图像生成与编辑的简化流程</title><desc id="desc">文字和参考图片经 Qwen3-VL 形成条件，参考图也经 VAE 编码；带条件的 DiT 从噪声迭代生成潜变量，VAE 解码成 RGB 或 RGBA 图片。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#52757a"/></marker></defs>
<rect width="1200" height="460" rx="22" fill="#f7faf9"/><text x="38" y="45" fill="#18353a" font-size="25" font-weight="700" font-family="sans-serif">从要求到图片：一张简化的数据流图</text><text x="38" y="75" fill="#526c70" font-size="16" font-family="sans-serif">生成和编辑共用核心生成器；输入参考图时会额外提供图片条件</text>
<g font-family="sans-serif" font-size="16" fill="#18353a"><rect x="38" y="125" width="170" height="68" rx="12" fill="#e4f3f0" stroke="#8bbab2"/><text x="57" y="154" font-weight="700">文字指令</text><text x="57" y="178" font-size="14">描述想画什么 / 改什么</text><rect x="38" y="248" width="170" height="68" rx="12" fill="#e4f3f0" stroke="#8bbab2"/><text x="57" y="278" font-weight="700">参考图片（可选）</text><text x="57" y="302" font-size="14">最多 10 张</text>
<rect x="275" y="140" width="210" height="90" rx="12" fill="#edf1fa" stroke="#9caed0"/><text x="293" y="170" font-weight="700">Qwen3-VL-8B</text><text x="293" y="195" font-size="14">编码文字与图片条件</text><text x="293" y="216" font-size="13">稳定条件可在采样中缓存</text>
<rect x="275" y="275" width="210" height="75" rx="12" fill="#faf3e6" stroke="#d5b88c"/><text x="293" y="305" font-weight="700">VAE 编码参考图</text><text x="293" y="329" font-size="14">提供压缩后的图像信息</text>
<rect x="570" y="165" width="230" height="120" rx="12" fill="#e8f2f1" stroke="#62a59c"/><text x="590" y="196" font-weight="700">图像生成器 DiT · 7B</text><text x="590" y="223" font-size="14">32 层，接收条件与噪声</text><text x="590" y="247" font-size="14">多次更新潜变量</text><text x="590" y="271" font-size="13">7B 不包括整条流水线</text>
<rect x="885" y="175" width="145" height="95" rx="12" fill="#faf3e6" stroke="#d5b88c"/><text x="905" y="207" font-weight="700">VAE 解码</text><text x="905" y="233" font-size="14">64 通道潜表示</text><text x="905" y="255" font-size="14">还原为图片</text><rect x="1060" y="188" width="105" height="70" rx="12" fill="#e4f3f0" stroke="#8bbab2"/><text x="1078" y="218" font-weight="700">输出图片</text><text x="1078" y="241" font-size="14">RGB / RGBA</text>
<rect x="570" y="345" width="230" height="55" rx="12" fill="#f0f3f3" stroke="#bbcaca"/><text x="590" y="378" font-weight="700">随机噪声：生成的起点</text></g>
<g fill="none" stroke="#52757a" stroke-width="2" marker-end="url(#arrow)"><path d="M208 158 H245 V165 H275"/><path d="M208 278 H245 V205 H275"/><path d="M208 282 H240 V313 H275"/><path d="M485 185 H535 V200 H570"/><path d="M485 313 H535 V254 H570"/><path d="M685 345 V285"/><path d="M800 225 H885"/><path d="M1030 223 H1060"/></g><text x="38" y="435" fill="#637a7d" font-size="13" font-family="sans-serif">教学示意：省略了分辨率、采样参数和部分实现细节；结构依据官方代码和模型卡。</text></svg>
