<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Qwen-Image-Layered 图层分解示意</title><desc id="desc">输入图与提示经过编码，变量层扩散模型生成多个潜图层，解码为透明图层并由外部软件叠合。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#44737a"/></marker></defs>
<rect width="1200" height="430" rx="20" fill="#f6faf9"/><g font-family="system-ui, sans-serif" fill="#183a40"><text x="36" y="48" font-size="25" font-weight="700">从一张平面图到多个可编辑图层</text><text x="36" y="77" font-size="15" fill="#536e71">教学示意：省略张量细节；图层叠合与后续编辑由外部工具完成</text>
<g fill="#fff" stroke="#aacbc9" stroke-width="2"><rect x="35" y="135" width="175" height="130" rx="12"/><rect x="270" y="135" width="190" height="130" rx="12"/><rect x="520" y="135" width="205" height="130" rx="12"/><rect x="785" y="135" width="170" height="130" rx="12"/><rect x="1015" y="135" width="150" height="130" rx="12"/></g>
<g text-anchor="middle"><text x="122" y="170" font-size="20" font-weight="700">输入条件</text><text x="122" y="201" font-size="16">RGB 原图</text><text x="122" y="229" font-size="16">整体文字描述</text><text x="365" y="170" font-size="20" font-weight="700">共享表示</text><text x="365" y="201" font-size="16">RGBA-VAE 编码</text><text x="365" y="229" font-size="16">文本条件编码</text><text x="622" y="170" font-size="20" font-weight="700">VLD-MMDiT</text><text x="622" y="201" font-size="16">图层位置 + 去噪</text><text x="622" y="229" font-size="16">联合预测多层潜变量</text><text x="870" y="170" font-size="20" font-weight="700">VAE 解码</text><text x="870" y="201" font-size="16">多个 RGBA 图层</text><text x="870" y="229" font-size="16">颜色 + 透明度</text><text x="1090" y="170" font-size="20" font-weight="700">外部编辑</text><text x="1090" y="201" font-size="16">移动 / 替换</text><text x="1090" y="229" font-size="16">按顺序叠合</text></g>
<g stroke="#44737a" stroke-width="3" marker-end="url(#arrow)"><path d="M210 200H262"/><path d="M460 200H512"/><path d="M725 200H777"/><path d="M955 200H1007"/></g><text x="36" y="330" font-size="17">关键区别：透明图层有顺序；遮挡区域的内容由模型推测，未必是真实原貌。</text><text x="36" y="366" font-size="15" fill="#536e71">依据：Qwen-Image-Layered 论文第 3 节；示意图为原创教学绘制。</text></g></svg>
