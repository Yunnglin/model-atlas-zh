<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="260" viewBox="0 0 1060 260" role="img" aria-labelledby="title desc"><title id="title">DeepSeek-V2 的注意力和专家前馈示意</title><desc id="desc">输入 token 经过多层网络后预测下一个 token。V2 共 60 层：首层使用稠密前馈，其余 59 层使用混合专家前馈。MLA 保存压缩的历史表示及位置部分，MoE 使用共享专家和选中的路由专家。</desc><rect width="1060" height="260" rx="16" fill="#f5faf8"/><g fill="#fff" stroke="#87b6a4"><rect x="20" y="70" width="155" height="80" rx="8"/><rect x="215" y="48" width="250" height="125" rx="8"/><rect x="505" y="48" width="290" height="125" rx="8"/><rect x="835" y="70" width="200" height="80" rx="8"/></g><g font-family="sans-serif" text-anchor="middle" fill="#203b35"><text x="98" y="105" font-size="16">文字与 token</text><text x="340" y="79" font-size="17">MLA 因果注意力</text><text x="340" y="108" font-size="14">压缩历史表示与位置部分</text><text x="340" y="137" font-size="14">复用缓存参与计算</text><text x="650" y="79" font-size="17">DeepSeekMoE 前馈</text><text x="650" y="108" font-size="14">共享专家 + 路由选中的专家</text><text x="650" y="137" font-size="14">每个 token 使用部分专家</text><text x="935" y="105" font-size="16">预测下一个 token</text><text x="530" y="200" font-size="14">V2 共 60 层：首层为稠密前馈，其余 59 层使用 MoE</text><text x="530" y="225" font-size="13">教学简图：省略残差、归一化及各层内部计算；非官方原图。</text></g><g fill="none" stroke="#468b75" stroke-width="3" marker-end="url(#a)"><path d="M175 110H205"/><path d="M465 110H495"/><path d="M795 110H825"/></g><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#468b75"/></marker></defs></svg>
