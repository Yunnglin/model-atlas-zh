<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="270" viewBox="0 0 1060 270" role="img" aria-labelledby="title desc">
<title id="title">Qwen2-VL 动态视觉输入教学简图</title><desc id="desc">图片或视频帧经动态尺寸处理与视觉编码，以 MLP 合并邻近视觉特征并结合时高宽位置；文字与视觉表示进入 Qwen2 语言模型生成回答。</desc>
<rect width="1060" height="270" rx="16" fill="#f5faf8"/><g font-family="sans-serif" text-anchor="middle" fill="#203b35"><g fill="#fff" stroke="#87b6a4"><rect x="20" y="40" width="150" height="65" rx="8"/><rect x="205" y="40" width="170" height="65" rx="8"/><rect x="410" y="25" width="180" height="95" rx="8"/><rect x="20" y="160" width="150" height="60" rx="8"/><rect x="635" y="40" width="220" height="140" rx="8"/><rect x="895" y="83" width="140" height="60" rx="8"/></g>
<text x="95" y="67" font-size="16">图片 / 视频帧</text><text x="95" y="89" font-size="13">动态尺寸与采样</text><text x="290" y="78" font-size="16">视觉编码器 ViT</text><text x="500" y="62" font-size="16">MLP 合并 2×2 特征</text><text x="500" y="88" font-size="14">视觉 token 数量可变</text><text x="95" y="195" font-size="16">文字问题</text><text x="745" y="83" font-size="16">Qwen2 语言模型</text><text x="745" y="111" font-size="14">M-RoPE：时间 / 高 / 宽</text><text x="745" y="138" font-size="14">结合视觉与文字</text><text x="965" y="118" font-size="16">文字回答</text><text x="530" y="249" font-size="13">教学简图：省略图像标记、视频管块细节及训练阶段，非官方原图。</text></g>
