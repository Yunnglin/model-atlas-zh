<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">GPT-4 的公开能力与未知结构</title><desc id="desc">文字和图片输入交给基于 Transformer 的模型，输出文字；内部视觉连接与参数规模未公开。图示概念并非真实结构图。</desc>
<rect width="1000" height="430" rx="24" fill="#f5f9f8"/><text x="45" y="53" font-family="sans-serif" font-size="25" font-weight="bold" fill="#163d48">GPT-4：从输入到输出（概念示意）</text>
<g font-family="sans-serif" font-size="21" fill="#173f4a"><rect x="45" y="110" width="190" height="70" rx="12" fill="#dcefeb"/><text x="90" y="154">文字输入</text><rect x="45" y="210" width="190" height="70" rx="12" fill="#e6eff9"/><text x="90" y="254">图片输入</text><rect x="335" y="120" width="300" height="160" rx="15" fill="#fff" stroke="#4e8880" stroke-width="2"/><text x="373" y="172">基于 Transformer</text><text x="373" y="210">的 GPT-4 模型</text><text x="375" y="252" font-size="16">内部连接、参数规模未公开</text><rect x="750" y="165" width="190" height="70" rx="12" fill="#e7eef7"/><text x="795" y="209">文字输出</text></g>
<g fill="none" stroke="#4c7d79" stroke-width="3"><path d="M235 145 H285 V170 H330"/><path d="M235 245 H285 V230 H330"/><path d="M635 200 H745"/></g><g fill="#4c7d79"><path d="M330 163 l10 7 -10 7z"/><path d="M330 223 l10 7 -10 7z"/><path d="M745 193 l10 7 -10 7z"/></g><text x="45" y="345" font-family="sans-serif" font-size="18" fill="#435d67">说明：这是输入输出教学图，不代表已知的模型内部结构。</text><text x="45" y="382" font-family="sans-serif" font-size="18" fill="#435d67">2023 年 3 月公布图像能力；公开发布首先提供文字输入。</text></svg>
