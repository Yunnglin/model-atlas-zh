<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" role="img" aria-labelledby="title desc">
<title id="title">SAM 2 提示分割与视频记忆流程</title><desc id="desc">当前帧经过图像编码，结合提示及先前记忆输出掩码，并编码新的记忆用于后续帧；这是简化教学示意。</desc>
<rect width="1040" height="430" rx="24" fill="#f5f9f7"/><text x="38" y="48" font-family="sans-serif" font-weight="bold" font-size="24" fill="#143d45">SAM 2：先指出目标，再沿视频传播</text>
<g font-family="sans-serif" font-size="20" fill="#173c45"><rect x="35" y="107" width="150" height="65" rx="12" fill="#daeee8"/><text x="75" y="148">当前帧</text><rect x="235" y="107" width="160" height="65" rx="12" fill="#e3eff5"/><text x="255" y="148">图像编码器</text><rect x="449" y="107" width="160" height="65" rx="12" fill="#e7eef8"/><text x="469" y="148">记忆注意力</text><rect x="660" y="107" width="160" height="65" rx="12" fill="#e4f0e6"/><text x="682" y="148">掩码解码器</text><rect x="865" y="107" width="140" height="65" rx="12" fill="#fff0dc"/><text x="895" y="148">目标掩码</text><rect x="660" y="218" width="160" height="65" rx="12" fill="#f0eaf8"/><text x="685" y="259">提示：点／框</text><rect x="449" y="218" width="160" height="65" rx="12" fill="#dcefeb"/><text x="477" y="259">记忆编码</text><rect x="235" y="218" width="160" height="65" rx="12" fill="#e8f0f1"/><text x="261" y="259">记忆库</text></g>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#54837e"/></marker></defs>
<g fill="none" stroke="#54837e" stroke-width="3" marker-end="url(#arrow)">
<path d="M185 139 H230"/><path d="M395 139 H444"/><path d="M609 139 H655"/><path d="M820 139 H860"/>
<path d="M740 218 V177"/><path d="M935 172 V330 H625 V275 H614"/><path d="M449 251 H400"/><path d="M315 218 V194 H530 V176"/>
<path d="M395 160 H420 V310 H529 V288"/>
</g><text x="38" y="355" font-family="sans-serif" font-size="17" fill="#49636a">简化示意：记忆由帧特征和掩码构成；用户可在需要时补充提示纠错。</text><text x="38" y="387" font-family="sans-serif" font-size="17" fill="#49636a">结构以 SAM 2 论文第 3 节及图 3 为准；并不展示全部计算细节。</text></svg>
