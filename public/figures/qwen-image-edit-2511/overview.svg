<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Qwen-Image-Edit-2511 多图编辑教学流程</title><desc id="desc">两张参考图和文本指令送入图像编辑模型，生成合成图，再分别检查身份、位置与细节。图不声明模型的内部逐层结构。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#347a70"/></marker></defs><rect width="1200" height="430" rx="20" fill="#f3f9f7"/>
<g font-family="sans-serif" fill="#183b38"><text x="35" y="45" font-size="24" font-weight="700">多图编辑：不只看画面，还要检查有没有保留该保留的内容</text>
<rect x="35" y="100" width="245" height="170" rx="14" fill="#fff" stroke="#a6c9bf"/><text x="58" y="137" font-size="18" font-weight="700">参考与指令</text><text x="58" y="174" font-size="16">图 1：红熊　图 2：蓝熊</text><text x="58" y="209" font-size="16">“红熊在左，蓝熊在右”</text><text x="58" y="242" font-size="14">可搭配背景、姿态要求</text>
<rect x="345" y="100" width="260" height="170" rx="14" fill="#e7f3ef" stroke="#8bb8aa"/><text x="475" y="140" text-anchor="middle" font-size="18" font-weight="700">条件图像生成</text><text x="475" y="179" text-anchor="middle" font-size="16">结合图像与文本条件</text><text x="475" y="213" text-anchor="middle" font-size="16">多步更新后输出图像</text><text x="475" y="246" text-anchor="middle" font-size="14">具体内部融合细节未完整公开</text>
<rect x="670" y="100" width="225" height="170" rx="14" fill="#fff" stroke="#a6c9bf"/><text x="782" y="141" text-anchor="middle" font-size="18" font-weight="700">生成合成图</text><text x="782" y="179" text-anchor="middle" font-size="16">两只熊和新背景</text><text x="782" y="213" text-anchor="middle" font-size="14">结果可能变化或出错</text>
<rect x="960" y="100" width="205" height="170" rx="14" fill="#fff" stroke="#a6c9bf"/><text x="1062" y="141" text-anchor="middle" font-size="18" font-weight="700">检查结果</text><text x="1062" y="180" text-anchor="middle" font-size="15">身份与左右位置</text><text x="1062" y="213" text-anchor="middle" font-size="15">文字、遮挡和细节</text>
<g fill="none" stroke="#347a70" stroke-width="3" marker-end="url(#arrow)"><path d="M280 185 H335"/><path d="M605 185 H660"/><path d="M895 185 H950"/></g><text x="35" y="334" font-size="16">固定版本、输入、步骤和种子，才能更公平地比较；仍需独立样本和人工核对。</text><text x="35" y="380" font-size="14" fill="#58746d">原创教学示意；并非官方结构图或实际生成结果。</text></g></svg>
