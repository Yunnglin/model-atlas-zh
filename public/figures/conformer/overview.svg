<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="290" viewBox="0 0 1060 290" role="img" aria-labelledby="title desc"><title id="title">Conformer 语音编码及识别示意</title><desc id="desc">声音特征下采样后进入 Conformer 块，依次经过半步前馈、自注意力、卷积和半步前馈，再由识别系统生成文字。</desc><rect width="1060" height="290" rx="18" fill="#f4f8f7"/><text x="32" y="42" font-family="sans-serif" font-size="23" font-weight="700" fill="#173b3d">声音特征 → Conformer 编码 → 识别文字</text><g font-family="sans-serif" text-anchor="middle" fill="#173b3d"><rect x="25" y="112" width="135" height="75" rx="10" fill="#fff" stroke="#a8c7c4"/><text x="92" y="142" font-size="16">声音特征</text><text x="92" y="166" font-size="13">时间下采样</text><rect x="195" y="83" width="625" height="135" rx="12" fill="#dcefeb" stroke="#67a59c"/><text x="507" y="110" font-size="16">Conformer 块（多层堆叠）</text><rect x="210" y="130" width="120" height="60" rx="8" fill="#fff" stroke="#a8c7c4"/><text x="270" y="164" font-size="14">前馈 × 1/2</text><rect x="355" y="130" width="120" height="60" rx="8" fill="#fff" stroke="#a8c7c4"/><text x="415" y="164" font-size="14">自注意力</text><rect x="500" y="130" width="120" height="60" rx="8" fill="#fff" stroke="#a8c7c4"/><text x="560" y="164" font-size="14">卷积模块</text><rect x="645" y="130" width="120" height="60" rx="8" fill="#fff" stroke="#a8c7c4"/><text x="705" y="164" font-size="14">前馈 × 1/2</text><rect x="865" y="112" width="150" height="75" rx="10" fill="#fff" stroke="#a8c7c4"/><text x="940" y="142" font-size="16">识别系统</text><text x="940" y="166" font-size="13">输出文字</text><path d="M160 150h29" fill="none" stroke="#357f77" stroke-width="2" marker-end="url(#a)"/><path d="M330 160h19" fill="none" stroke="#357f77" stroke-width="2" marker-end="url(#a)"/><path d="M475 160h19" fill="none" stroke="#357f77" stroke-width="2" marker-end="url(#a)"/><path d="M620 160h19" fill="none" stroke="#357f77" stroke-width="2" marker-end="url(#a)"/><path d="M820 150h39" fill="none" stroke="#357f77" stroke-width="2" marker-end="url(#a)"/><text x="525" y="257" font-size="13" fill="#4b6666">½ 表示前馈残差增量缩放；文字由编码器外的识别组件生成</text></g><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#357f77"/></marker></defs></svg>
