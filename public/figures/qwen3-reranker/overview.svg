<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Qwen3 Reranker 的逐对打分</title><desc id="desc">任务指令、问题和候选文档组成输入，经 Qwen3 模型分别得到 yes 与 no 的分数，归一化后为候选排序。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#607d83"/></marker></defs>
<rect width="1200" height="420" rx="20" fill="#f6faf9"/><text x="45" y="52" font-family="sans-serif" font-size="25" font-weight="700" fill="#183638">每次判断一个「问题 + 候选」</text>
<g font-family="sans-serif" fill="#183638"><rect x="45" y="85" width="265" height="240" rx="16" fill="#fff" stroke="#b7d5cf"/><text x="68" y="125" font-size="19" font-weight="700">输入模板</text><text x="68" y="164" font-size="17">任务：找能回答的段落</text><text x="68" y="205" font-size="17">问题：试用期能休假吗？</text><text x="68" y="246" font-size="17">候选：一段员工政策</text><text x="68" y="288" font-size="15" fill="#607579">同一问题逐个搭配候选</text>
<rect x="385" y="130" width="250" height="150" rx="16" fill="#e1f1ec" stroke="#9bc4b9"/><text x="510" y="181" text-anchor="middle" font-size="20" font-weight="700">Qwen3 解码器</text><text x="510" y="221" text-anchor="middle" font-size="16">读取整段上下文</text><text x="510" y="247" text-anchor="middle" font-size="16">预测下一个 token</text>
<rect x="705" y="104" width="220" height="200" rx="16" fill="#fff" stroke="#b7d5cf"/><text x="815" y="146" text-anchor="middle" font-size="19" font-weight="700">两个 token 的分数</text><text x="815" y="188" text-anchor="middle" font-size="18">yes　与　no</text><text x="815" y="226" text-anchor="middle" font-size="16">只在两者之间归一化</text><text x="815" y="266" text-anchor="middle" font-size="15" fill="#607579">得到相关性排序分数</text>
<rect x="985" y="145" width="175" height="120" rx="16" fill="#e6eef8" stroke="#b7c7dd"/><text x="1072" y="192" text-anchor="middle" font-size="19" font-weight="700">候选排序</text><text x="1072" y="228" text-anchor="middle" font-size="15">分数高的优先</text></g>
<path d="M310 205H385 " stroke="#607d83" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M635 205H705 " stroke="#607d83" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M925 205H985" stroke="#607d83" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="45" y="376" font-family="sans-serif" font-size="15" fill="#607579">教学示意：相关性分数不等于事实正确率；重排不能补回未被召回的文档。</text>
</svg>
