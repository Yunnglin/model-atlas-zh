<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="360" viewBox="0 0 1060 360" role="img" aria-labelledby="title desc"><title id="title">Janus-Pro 理解与生成双路径教学图</title><desc id="desc">理解时，输入图像通过理解编码器、适配器进入共享语言模型，文字问题直接进入语言模型并输出文字；生成时，文字送入共享语言模型，图像预测头逐步产生图像 token，由图像解码器重建图片。</desc><rect width="1060" height="360" rx="16" fill="#f5faf8"/><g fill="#fff" stroke="#87b6a4"><rect x="18" y="68" width="130" height="64" rx="8"/><rect x="185" y="68" width="175" height="64" rx="8"/><rect x="395" y="68" width="140" height="64" rx="8"/><rect x="575" y="113" width="180" height="94" rx="8"/><rect x="790" y="68" width="140" height="64" rx="8"/><rect x="18" y="140" width="130" height="48" rx="8"/><rect x="18" y="200" width="130" height="64" rx="8"/><rect x="790" y="200" width="140" height="64" rx="8"/><rect x="950" y="200" width="95" height="64" rx="8"/></g><g font-family="sans-serif" text-anchor="middle" fill="#203b35"><text x="83" y="96" font-size="15">输入图像</text><text x="272" y="94" font-size="15">理解编码器</text><text x="272" y="115" font-size="12">SigLIP 视觉特征</text><text x="465" y="105" font-size="15">理解适配器</text><text x="665" y="150" font-size="16">共享自回归</text><text x="665" y="174" font-size="16">Transformer</text><text x="860" y="105" font-size="15">文字回答</text><text x="83" y="170" font-size="15">文字问题</text><text x="83" y="228" font-size="15">绘图文字</text><text x="860" y="226" font-size="15">图像预测头</text><text x="860" y="248" font-size="12">图像 token 序列</text><text x="997" y="226" font-size="15">解码器</text><text x="997" y="248" font-size="12">重建图片</text><text x="530" y="320" font-size="13">教学简图：训练时生成编码器把参考图片编码为目标图像 token；省略适配器和自回归循环细节。</text></g><g fill="none" stroke="#468b75" stroke-width="3" marker-end="url(#a)"><path d="M148 100H175"/><path d="M360 100H385"/><path d="M535 100H550V145H565"/><path d="M755 140H775V100H780"/><path d="M148 164H565"/><path d="M148 232H550V180H565"/><path d="M755 180H775V232H780"/><path d="M930 232H940"/></g><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#468b75"/></marker></defs></svg>
