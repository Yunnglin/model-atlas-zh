<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
<title id="title">Kimi K3 结构教学示意</title><desc id="desc">文字与视觉输入进入混合注意力模型；KDA 和 MLA 处理序列，AttnRes 聚合不同网络块，MoE 选择专家，再输出文本或工具调用。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#547784"/></marker></defs>
<rect width="1100" height="360" rx="18" fill="#f4f9f8"/><text x="35" y="40" font-size="22" font-weight="700" fill="#163c48" font-family="sans-serif">Kimi K3：三个方向的信息处理</text>
<g font-family="sans-serif" fill="#173d49" font-size="16"><rect x="35" y="91" width="175" height="76" rx="12" fill="#fff" stroke="#9fc8c2"/><text x="52" y="121">文字 → token</text><text x="52" y="148">图片 / 视频 → 视觉编码</text><rect x="255" y="86" width="250" height="86" rx="12" fill="#e6f4f2" stroke="#83bdb5"/><text x="274" y="116" font-weight="700">沿序列：混合注意力</text><text x="274" y="146">3 层 KDA + 1 层 Gated MLA</text><rect x="550" y="86" width="236" height="86" rx="12" fill="#eaf0fa" stroke="#a6b8d7"/><text x="569" y="116" font-weight="700">沿深度：AttnRes</text><text x="569" y="146">按内容融合先前块表示</text><rect x="830" y="86" width="235" height="86" rx="12" fill="#f4eefb" stroke="#c0aad6"/><text x="850" y="116" font-weight="700">沿宽度：稀疏专家</text><text x="850" y="146">路由专家 + 共享专家</text><rect x="356" y="245" width="389" height="62" rx="12" fill="#fff" stroke="#9fc8c2"/><text x="376" y="282">模型输出：文本或供外部系统解析的工具调用</text><text x="35" y="339" font-size="13" fill="#55717b">教学示意；模块并非独立串行流水线。实际模型反复堆叠注意力与专家层。</text></g>
<g fill="none" stroke="#547784" stroke-width="2" marker-end="url(#arrow)"><path d="M210 130H247"/><path d="M505 130H542"/><path d="M786 130H822"/><path d="M948 172V218H550V237"/></g></svg>
