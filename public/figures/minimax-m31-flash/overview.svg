<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 360" role="img" aria-labelledby="title desc"><title id="title">M3.1 Flash 三项效率设计</title><desc id="desc">模型采用稀疏注意力选取上下文，训练时考虑量化，推理时可使用草稿头提出候选，由主模型验证。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#527a73"/></marker></defs><rect width="1080" height="360" rx="20" fill="#f5f9f7"/><g font-family="system-ui,sans-serif" fill="#173d3a"><text x="30" y="39" font-size="22" font-weight="700">同一个任务，三处不同的效率设计</text><g font-size="17"><rect x="30" y="78" width="300" height="85" rx="10" fill="#e2f0ea"/><text x="50" y="110" font-weight="700">MSA · 看哪些上下文</text><text x="50" y="139">选择相关块，再计算注意力</text><rect x="390" y="78" width="300" height="85" rx="10" fill="#e2edef"/><text x="410" y="110" font-weight="700">QAT · 如何表示权重</text><text x="410" y="139">训练时考虑低精度误差</text><rect x="750" y="78" width="300" height="85" rx="10" fill="#f1eadc"/><text x="770" y="110" font-weight="700">DSpark · 如何生成</text><text x="770" y="139">提出候选，再由主模型验证</text><rect x="100" y="222" width="235" height="60" rx="10" fill="#e5efef"/><text x="126" y="259">文字 / 图片 / 视频</text><rect x="425" y="222" width="235" height="60" rx="10" fill="#d9eae2"/><text x="450" y="259">MoE 多模态模型</text><rect x="750" y="222" width="235" height="60" rx="10" fill="#e5efef"/><text x="775" y="259">文本 / 工具请求</text></g><g stroke="#527a73" fill="none" stroke-width="2.5" marker-end="url(#arr)"><path d="M335 252H425"/><path d="M660 252H750"/></g><text x="30" y="332" font-size="14" fill="#536b67">教学示意：三项优化作用在不同环节；具体执行路径与收益取决于推理实现。</text></g></svg>
