<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="300" viewBox="0 0 1060 300" role="img" aria-labelledby="title desc"><title id="title">Jev 决策应用的数据流</title><desc id="desc">应用准备文本状态与问题，Jev 返回类型化判断和概率，应用规则决定自动处理或人工复核。</desc><rect width="1060" height="300" rx="18" fill="#f4f8f7"/><g font-family="system-ui, sans-serif" fill="#17364b"><text x="30" y="40" font-size="20" font-weight="700">Jev：有限问题与概率，交给应用决策</text><text x="30" y="68" font-size="14">仅展示公开接口的外部流程；不推断未公开的网络结构</text></g><g fill="#fff" stroke="#9ecac3" stroke-width="2"><rect x="24" y="110" width="210" height="108" rx="12"/><rect x="288" y="110" width="220" height="108" rx="12"/><rect x="562" y="110" width="210" height="108" rx="12"/><rect x="825" y="110" width="210" height="108" rx="12"/></g><g font-family="system-ui, sans-serif" fill="#17364b" text-anchor="middle"><text x="129" y="148" font-size="18" font-weight="700">state + 问题</text><text x="129" y="179" font-size="14">工单、证据、候选</text><text x="398" y="148" font-size="18" font-weight="700">Jev</text><text x="398" y="179" font-size="14">内部结构未公开</text><text x="667" y="148" font-size="18" font-weight="700">类型化结果</text><text x="667" y="179" font-size="14">判断及概率信息</text><text x="930" y="148" font-size="18" font-weight="700">应用规则</text><text x="930" y="179" font-size="14">自动处理 / 人工复核</text></g><g fill="none" stroke="#168779" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M239 164h35m-9-8 9 8-9 8M513 164h35m-9-8 9 8-9 8M777 164h35m-9-8 9 8-9 8"/></g><text x="30" y="268" fill="#52716d" font-family="system-ui, sans-serif" font-size="14">概率校准是对多次预测的统计检验，不保证单个结果正确。</text></svg>
