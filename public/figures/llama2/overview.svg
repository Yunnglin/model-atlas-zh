<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 460" role="img" aria-labelledby="title desc">
<title id="title">Llama 2 从预训练到对话的流程</title><desc id="desc">公开来源文本通过下一 token 预测训练基础模型，再以示范答案和偏好模型进行对齐，最后在应用中进行独立评测。</desc>
<rect width="1080" height="460" rx="20" fill="#f5f9f8"/><text x="35" y="48" font-family="sans-serif" font-size="23" font-weight="700" fill="#183e46">从文本续写到对话助手</text>
<g font-family="sans-serif" fill="#183e46"><rect x="35" y="100" width="200" height="110" rx="12" fill="#fff" stroke="#a3c6be"/><text x="54" y="137" font-size="19" font-weight="700">公开来源文本</text><text x="54" y="168" font-size="15">约 2 万亿 token</text><text x="54" y="193" font-size="14">完整语料未公开</text><rect x="285" y="100" width="195" height="110" rx="12" fill="#e2f1ec" stroke="#6aab99"/><text x="304" y="137" font-size="19" font-weight="700">基础模型</text><text x="304" y="168" font-size="15">预测下一个 token</text><text x="304" y="193" font-size="14">Decoder-only Transformer</text><rect x="530" y="100" width="200" height="110" rx="12" fill="#fff" stroke="#a3c6be"/><text x="549" y="137" font-size="19" font-weight="700">监督微调 SFT</text><text x="549" y="168" font-size="15">学习示范回答</text><text x="549" y="193" font-size="14">改善指令遵循</text><rect x="780" y="100" width="260" height="110" rx="12" fill="#e7effc" stroke="#9ab4d8"/><text x="799" y="137" font-size="19" font-weight="700">偏好训练 → Chat</text><text x="799" y="168" font-size="15">人类比较 → 奖励模型</text><text x="799" y="193" font-size="14">拒绝采样微调 / PPO 迭代</text><rect x="285" y="268" width="445" height="105" rx="12" fill="#fff" stroke="#a3c6be"/><text x="305" y="303" font-size="18" font-weight="700">模型内部：因果注意力 + 前馈层</text><text x="305" y="335" font-size="15">公开 70B 使用 GQA，共享部分键值头以减少缓存</text><rect x="780" y="268" width="260" height="105" rx="12" fill="#fff5e7" stroke="#dbbb85"/><text x="799" y="303" font-size="18" font-weight="700">应用中独立评测</text><text x="799" y="335" font-size="15">事实、指令、安全与成本</text></g>
<g stroke="#64958b" stroke-width="3" fill="none"><path d="M235 155 H283"/><path d="M480 155 H528"/><path d="M730 155 H778"/><path d="M910 210 V266"/></g><text x="35" y="425" font-family="sans-serif" font-size="14" fill="#58736f">教学示意，省略迭代细节；评测为模型训练之外的应用验证。</text></svg>
