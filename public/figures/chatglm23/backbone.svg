<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 300" role="img" aria-labelledby="title desc">
<title id="title">ChatGLM2 与 ChatGLM3 的语言模型骨干</title><desc id="desc">对话模板与分词生成 token，进入 28 层语言模型；每层使用 32 个查询头与两组键值头共享，经过前馈网络后预测下一 token。ChatGLM3 可按工具格式请求外部执行，接收返回后继续生成。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#087b7c"/></marker></defs><rect width="1080" height="300" rx="18" fill="#f5f9f8"/>
<g font-family="system-ui, sans-serif" fill="#183b45"><text x="30" y="40" font-size="24" font-weight="700">ChatGLM2 / 3：从对话输入到下一 token</text>
<g stroke="#c5ded8" fill="#fff"><rect x="25" y="86" width="160" height="65" rx="10"/><rect x="225" y="86" width="170" height="65" rx="10"/><rect x="435" y="72" width="290" height="95" rx="10"/><rect x="765" y="86" width="245" height="65" rx="10"/><rect x="435" y="210" width="290" height="55" rx="10"/></g>
<g fill="none" stroke="#087b7c" stroke-width="2.5" marker-end="url(#arrow)"><path d="M185 118 H215"/><path d="M395 118 H425"/><path d="M725 118 H755"/><path d="M858 151 V235 H734"/><path d="M435 237 H320 V151"/></g>
<g font-size="18"><text x="48" y="125">对话与历史</text><text x="255" y="125">模板与分词</text><text x="455" y="109">28 层语言模型</text><text x="455" y="140">32 查询头共享 2 组 KV</text><text x="793" y="125">预测下一个 token</text><text x="470" y="243">三代按需调用工具 → 返回</text></g><text x="30" y="285" font-size="14" fill="#526b72">教学示意：三代的工具流程需要外部应用；两代权重与模板各自独立。</text></g></svg>
