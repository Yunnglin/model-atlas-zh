<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">QVQ 图片问答教学流程</title><desc id="desc">图片由视觉编码器转换为视觉表示，与文字问题一起输入语言模型，生成推理和答案；需回到原图检查单位、读数及运算。</desc>
<rect width="1200" height="400" rx="20" fill="#f5f9f8"/><g font-family="sans-serif" fill="#183a40"><text x="45" y="50" font-size="24" font-weight="700">从图片与问题到推理答案</text><g fill="#fff" stroke="#b4d2cc" stroke-width="2"><rect x="45" y="95" width="180" height="95" rx="12"/><rect x="275" y="95" width="210" height="95" rx="12"/><rect x="535" y="95" width="245" height="95" rx="12"/><rect x="830" y="95" width="230" height="95" rx="12"/><rect x="275" y="225" width="210" height="65" rx="12"/></g><g text-anchor="middle" font-size="19"><text x="135" y="132">图片</text><text x="380" y="132">视觉编码</text><text x="657" y="132">语言模型</text><text x="945" y="132">文本推理与答案</text><text x="380" y="264">文字问题</text></g><g text-anchor="middle" font-size="15" fill="#4b676b"><text x="135" y="163">图表 / 几何图</text><text x="380" y="163">生成视觉表示</text><text x="657" y="163">结合图文逐步生成</text><text x="945" y="163">可能需要外部复核</text></g><g fill="none" stroke="#468d83" stroke-width="3" marker-end="url(#arr)"><path d="M225 143h40"/><path d="M485 143h40"/><path d="M780 143h40"/><path d="M485 257h90v-67"/></g><text x="45" y="343" font-size="16" fill="#4b676b">教学示意：回到原图核对读数、图例和单位；图文输入不保证结论正确。</text></g><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#468d83"/></marker></defs></svg>
