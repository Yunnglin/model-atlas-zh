<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="260" viewBox="0 0 1060 260" role="img" aria-labelledby="title desc"><title id="title">DeepSeek-Coder 初代补全流程</title><desc id="desc">前缀与后缀经过特殊标记组织后进入解码器，生成缺失代码，外部环境负责执行测试。</desc><rect width="1060" height="260" rx="16" fill="#f5faf8"/><g fill="#fff" stroke="#87b6a4"><rect x="20" y="65" width="210" height="90" rx="8"/><rect x="265" y="65" width="200" height="90" rx="8"/><rect x="500" y="65" width="220" height="90" rx="8"/><rect x="755" y="65" width="285" height="90" rx="8"/></g><g font-family="sans-serif" text-anchor="middle" fill="#203b35"><text x="125" y="100" font-size="16">前缀 + 后缀</text><text x="125" y="125" font-size="13">光标两侧已有代码</text><text x="365" y="100" font-size="16">FIM 特殊标记</text><text x="365" y="125" font-size="13">组织补全输入</text><text x="610" y="100" font-size="16">解码器逐 token 生成</text><text x="610" y="125" font-size="13">输出缺失代码</text><text x="897" y="100" font-size="16">外部执行与测试</text><text x="897" y="125" font-size="13">工具可选，需隔离与审查</text><text x="530" y="220" font-size="13">教学简图：仅展示 FIM 补全流程；省略层内计算、FIM 标记细节和其他任务。</text></g><g fill="none" stroke="#468b75" stroke-width="3" marker-end="url(#a)"><path d="M230 110H255"/><path d="M465 110H490"/><path d="M720 110H745"/></g><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#468b75"/></marker></defs></svg>
