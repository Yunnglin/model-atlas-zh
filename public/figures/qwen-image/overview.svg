<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 260" role="img" aria-labelledby="title desc">
<title id="title">Qwen-Image 文生图流程示意</title><desc id="desc">文本编码与噪声潜变量共同送入 MMDiT，采样器更新潜变量后回到 MMDiT 继续预测，完成所有采样步骤后由 VAE 解码成图。</desc>
<rect width="1060" height="260" rx="18" fill="#f4f8f7"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#42857c"/></marker></defs>
