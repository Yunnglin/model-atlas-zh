<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="260" viewBox="0 0 1060 260" role="img" aria-labelledby="t d"><title id="t">DeepSeek LLM 的学习与回答流程</title><desc id="d">文本先分词，经稠密解码器预测文字；预训练、监督微调和偏好优化是训练阶段。</desc><rect width="1060" height="260" rx="16" fill="#f5faf8"/><g fill="#fff" stroke="#87b6a4"><rect x="25" y="65" width="170" height="85" rx="8"/><rect x="235" y="65" width="185" height="85" rx="8"/><rect x="460" y="65" width="310" height="85" rx="8"/><rect x="810" y="65" width="220" height="85" rx="8"/></g><g font-family="sans-serif" text-anchor="middle" fill="#203b35"><text x="110" y="100" font-size="16">输入文本</text><text x="327" y="100" font-size="16">分词与位置</text><text x="615" y="100" font-size="16">稠密 Transformer 解码器</text><text x="615" y="125" font-size="13">注意力 + 前馈网络</text><text x="920" y="100" font-size="16">逐个生成 token</text><text x="530" y="213" font-size="13">教学简图：预训练、SFT 和 DPO 在训练时发生；省略层内投影、残差和归一化。</text></g><g fill="none" stroke="#468b75" stroke-width="3" marker-end="url(#a)"><path d="M195 107H225"/><path d="M420 107H450"/><path d="M770 107H800"/></g><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#468b75"/></marker></defs></svg>
