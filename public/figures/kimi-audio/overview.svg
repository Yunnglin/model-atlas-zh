<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="360" viewBox="0 0 1060 360" role="img" aria-labelledby="title desc"><title id="title">Kimi-Audio 输入与输出教学示意</title><desc id="desc">输入音频分别提取离散语义 token 和连续声学特征，对齐后相加输入共享层；模型分别生成文本和音频 token，音频经流匹配与声码器转为波形。</desc><rect width="1060" height="360" rx="16" fill="#f5faf8"/><g fill="#fff" stroke="#87b6a4"><rect x="15" y="115" width="110" height="65" rx="8"/><rect x="160" y="54" width="190" height="65" rx="8"/><rect x="160" y="186" width="190" height="65" rx="8"/><rect x="390" y="115" width="145" height="65" rx="8"/><rect x="570" y="115" width="145" height="65" rx="8"/><rect x="750" y="54" width="120" height="65" rx="8"/><rect x="750" y="186" width="120" height="65" rx="8"/><rect x="905" y="186" width="140" height="65" rx="8"/></g><g font-family="sans-serif" text-anchor="middle" fill="#203b35"><text x="70" y="153" font-size="15">输入音频</text><text x="255" y="80" font-size="14">离散语义 token</text><text x="255" y="101" font-size="12">12.5 Hz</text><text x="255" y="212" font-size="14">Whisper 连续特征</text><text x="255" y="234" font-size="12">50 → 12.5 Hz</text><text x="462" y="142" font-size="14">表示对齐后相加</text><text x="642" y="142" font-size="15">共享 Transformer</text><text x="810" y="92" font-size="14">文本输出头</text><text x="810" y="213" font-size="14">音频输出头</text><text x="810" y="235" font-size="12">语义 token</text><text x="975" y="212" font-size="14">流匹配 + 声码器</text><text x="975" y="235" font-size="12">生成波形</text><text x="530" y="320" font-size="13">教学简图：省略文本输入、输出时间对齐、前瞻和分块流式解码细节。</text></g><g fill="none" stroke="#468b75" stroke-width="3" marker-end="url(#a)"><path d="M125 142H140V86H150"/><path d="M125 153H140V218H150"/><path d="M350 86H370V140H380"/><path d="M350 218H370V155H380"/><path d="M535 148H560"/><path d="M715 140H730V86H740"/><path d="M715 155H730V218H740"/><path d="M870 218H895"/></g><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#468b75"/></marker></defs></svg>
