<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="280" viewBox="0 0 1060 280" role="img" aria-labelledby="title desc"><title id="title">ViT 从图像分块到分类</title><desc id="desc">图像分为图块，投影为向量并加入位置及分类 token，经过 Transformer 编码器，取分类 token 的输出交给分类头得到类别分数。</desc><rect width="1060" height="280" rx="18" fill="#f4f8f7"/><text x="32" y="42" font-family="sans-serif" font-size="23" font-weight="700" fill="#173b3d">把图片变成图块序列，再预测类别</text><g font-family="sans-serif" text-anchor="middle" fill="#173b3d"><rect x="30" y="88" width="155" height="100" rx="12" fill="#fff" stroke="#a8c7c4"/><text x="107" y="122" font-size="16">图片分块</text><text x="107" y="152" font-size="13">14 × 14 = 196 块</text><rect x="225" y="88" width="185" height="100" rx="12" fill="#fff" stroke="#a8c7c4"/><text x="317" y="122" font-size="16">投影 + 位置</text><text x="317" y="152" font-size="13">加分类 token 共 197</text><rect x="450" y="88" width="210" height="100" rx="12" fill="#dcefeb" stroke="#67a59c"/><text x="555" y="122" font-size="16">Transformer 编码器</text><text x="555" y="152" font-size="13">图块之间交换信息</text><rect x="700" y="88" width="170" height="100" rx="12" fill="#fff" stroke="#a8c7c4"/><text x="785" y="122" font-size="16">取分类 token</text><text x="785" y="152" font-size="13">分类头输出类别分数</text><path d="M185 138h40" fill="none" stroke="#357f77" stroke-width="2" marker-end="url(#a)"/><path d="M410 138h40" fill="none" stroke="#357f77" stroke-width="2" marker-end="url(#a)"/><path d="M660 138h40" fill="none" stroke="#357f77" stroke-width="2" marker-end="url(#a)"/><text x="505" y="239" font-size="13" fill="#4b6666">以 224 × 224 图片、16 × 16 图块为例；图示省略编码器内部细节</text></g><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#357f77"/></marker></defs></svg>
