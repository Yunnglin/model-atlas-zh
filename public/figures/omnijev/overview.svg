<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="300" viewBox="0 0 1060 300" role="img" aria-labelledby="title desc"><title id="title">OmniJev 多模态决策流程</title><desc id="desc">截图和文字进入 Qwen3.5 视觉语言底座及 LoRA，不同决策头输出概率，由外部工具执行并反馈。</desc><rect width="1060" height="300" rx="18" fill="#f4f8f7"/><g font-family="system-ui, sans-serif" fill="#17364b"><text x="30" y="40" font-size="20" font-weight="700">OmniJev：共享图文状态，回答多个决策问题</text><text x="30" y="68" font-size="14">v1.1 教学示意；省略具体层、缓存和标注流程</text></g><g fill="#fff" stroke="#9ecac3" stroke-width="2"><rect x="24" y="110" width="210" height="108" rx="12"/><rect x="288" y="110" width="220" height="108" rx="12"/><rect x="562" y="110" width="210" height="108" rx="12"/><rect x="825" y="110" width="210" height="108" rx="12"/></g><g font-family="system-ui, sans-serif" fill="#17364b" text-anchor="middle"><text x="129" y="148" font-size="18" font-weight="700">截图 + 问题</text><text x="129" y="179" font-size="14">目标与候选区域</text><text x="398" y="148" font-size="18" font-weight="700">Qwen3.5 + LoRA</text><text x="398" y="179" font-size="14">共享视觉语言状态</text><text x="667" y="148" font-size="18" font-weight="700">决策与评分头</text><text x="667" y="179" font-size="14">选择 / 真假 / 评分</text><text x="930" y="148" font-size="18" font-weight="700">外部应用</text><text x="930" y="179" font-size="14">执行、反馈与复核</text></g><g fill="none" stroke="#168779" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M239 164h35m-9-8 9 8-9 8M513 164h35m-9-8 9 8-9 8M777 164h35m-9-8 9 8-9 8"/></g><text x="30" y="268" fill="#52716d" font-family="system-ui, sans-serif" font-size="14">轨迹重放是离线演示，不等于在线闭环成功率。</text></svg>
