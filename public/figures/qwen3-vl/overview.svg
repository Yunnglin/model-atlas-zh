<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="300" viewBox="0 0 1060 300" role="img" aria-labelledby="title desc">
<title id="title">Qwen3-VL 视觉语言融合教学简图</title><desc id="desc">图像或视频帧经过视觉编码和融合器变为视觉 token；文本、时间戳和视觉 token 输入语言模型，多层视觉特征分别注入语言模型前三层。</desc>
<rect width="1060" height="300" rx="16" fill="#f5faf8"/><g font-family="sans-serif" text-anchor="middle" fill="#203b35"><g fill="#fff" stroke="#87b6a4"><rect x="20" y="35" width="155" height="60" rx="9"/><rect x="210" y="35" width="145" height="60" rx="9"/><rect x="390" y="35" width="155" height="60" rx="9"/><rect x="20" y="185" width="155" height="60" rx="9"/><rect x="590" y="32" width="300" height="210" rx="10"/><rect x="920" y="100" width="120" height="65" rx="9"/></g>
<text x="97" y="70" font-size="17">图像 / 视频帧</text><text x="282" y="70" font-size="17">视觉编码器</text><text x="467" y="70" font-size="17">融合器</text><text x="97" y="220" font-size="17">文字 / 时间戳</text><text x="740" y="62" font-size="17">语言模型</text><text x="740" y="99" font-size="15">视觉 token ＋ 文字 token</text><text x="740" y="135" font-size="15">前三层接收多层视觉特征</text><text x="740" y="172" font-size="15">位置编码：时间、高、宽</text><text x="980" y="138" font-size="17">文字回答</text><text x="530" y="278" font-size="13">教学简图：省略分层特征的各融合器、残差与张量形状，非官方原图。</text></g>
<g fill="none" stroke="#468b75" stroke-width="3" marker-end="url(#arrow)"><path d="M175 65H200"/><path d="M355 65H380"/><path d="M545 65H580"/><path d="M175 215H580"/><path d="M890 132H910"/><path d="M282 95V145H580" stroke-dasharray="7 5"/></g><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#468b75"/></marker></defs></svg>
