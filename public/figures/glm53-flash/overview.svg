<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="280" viewBox="0 0 1060 280" role="img" aria-labelledby="title desc"><title id="title">GLM-5.3-Flash 多模态与混合注意力示意</title><desc id="desc">文本和图像视频进入模型，视觉输入经视觉编码，与文本一起经过线性及稀疏注意力和混合专家，输出文本或工具请求。</desc><rect width="1060" height="280" rx="18" fill="#f4f8f7"/><text x="32" y="42" font-family="sans-serif" font-size="23" font-weight="700" fill="#173b3d">从截图与文字，到文本和工具请求</text><g font-family="sans-serif" text-anchor="middle" fill="#173b3d"><rect x="30" y="92" width="145" height="48" rx="10" fill="#fff" stroke="#a8c7c4"/><text x="102" y="122" font-size="16">文本</text><rect x="30" y="154" width="145" height="48" rx="10" fill="#fff" stroke="#a8c7c4"/><text x="102" y="184" font-size="16">图片 / 视频</text><rect x="215" y="154" width="135" height="48" rx="10" fill="#fff" stroke="#a8c7c4"/><text x="282" y="184" font-size="16">视觉编码</text><rect x="390" y="92" width="300" height="110" rx="12" fill="#dcefeb" stroke="#67a59c"/><text x="540" y="124" font-size="17">语言模型</text><text x="540" y="151" font-size="14">线性注意力 + 稀疏注意力</text><text x="540" y="176" font-size="14">稀疏专家 + mHC</text><rect x="740" y="110" width="205" height="75" rx="12" fill="#fff" stroke="#a8c7c4"/><text x="842" y="140" font-size="16">文本 / 工具请求</text><text x="842" y="164" font-size="13">外部执行器完成操作</text><path d="M175 116h207" fill="none" stroke="#357f77" stroke-width="2" marker-end="url(#a)"/><path d="M175 178h34" fill="none" stroke="#357f77" stroke-width="2" marker-end="url(#a)"/><path d="M350 178h34" fill="none" stroke="#357f77" stroke-width="2" marker-end="url(#a)"/><path d="M690 147h44" fill="none" stroke="#357f77" stroke-width="2" marker-end="url(#a)"/><text x="530" y="250" fill="#4b6666" font-size="13">教学示意，省略内部细节；不是官方结构图</text></g><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#357f77"/></marker></defs></svg>
