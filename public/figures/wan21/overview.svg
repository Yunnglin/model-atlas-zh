<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Wan2.1 文生视频教学流程</title><desc id="desc">文本经 umT5 编码，条件输入扩散 Transformer；Transformer 从噪声出发循环预测并更新视频潜在表示，最后由 Wan-VAE 解码为视频。训练时真实视频可以经过 VAE 编码。</desc><rect width="1200" height="400" rx="20" fill="#f5f9f8"/><text x="45" y="52" font-family="sans-serif" font-size="24" font-weight="700" fill="#183a40">从文字和噪声生成视频</text>
<g font-family="sans-serif" text-anchor="middle" fill="#183a40"><g fill="#fff" stroke="#aacdc6" stroke-width="2"><rect x="45" y="95" width="150" height="85" rx="12"/><rect x="245" y="95" width="180" height="85" rx="12"/><rect x="490" y="95" width="240" height="120" rx="12"/><rect x="795" y="95" width="170" height="120" rx="12"/><rect x="1020" y="95" width="135" height="120" rx="12"/><rect x="245" y="240" width="180" height="70" rx="12"/></g><g font-size="19" font-weight="700"><text x="120" y="131">文字提示</text><text x="335" y="131">umT5 编码</text><text x="610" y="137">扩散 Transformer</text><text x="880" y="137">Wan-VAE</text><text x="1088" y="137">视频</text><text x="335" y="281">随机噪声</text></g><g font-size="15" fill="#4b676b"><text x="120" y="158">猫跳下窗台</text><text x="335" y="158">生成文本条件</text><text x="610" y="173">多次更新潜在表示</text><text x="880" y="173">解码潜在表示</text><text x="1088" y="173">连续画面</text></g></g><g fill="none" stroke="#468d83" stroke-width="3" marker-end="url(#a)"><path d="M195 138h50"/><path d="M425 138h65"/><path d="M730 155h65"/><path d="M965 155h55"/><path d="M425 275h85v-60"/><path d="M690 95V76H530V95"/></g><text x="45" y="350" font-family="sans-serif" font-size="16" fill="#4b676b">推理示意：循环箭头表示多次更新，完成后解码；训练时真实视频先经 VAE 编码。</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#468d83"/></marker></defs></svg>
