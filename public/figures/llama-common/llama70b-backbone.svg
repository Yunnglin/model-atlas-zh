<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
<title id="title">Llama 3.1 与 3.3 的 70B 文本骨干简图</title>
<desc id="desc">文本分词并映射为向量，经过八十层包含因果分组查询注意力与前馈网络的解码层，归一化并预测下一个 token。每层包含残差连接。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#437e72"/></marker></defs>
<rect width="1000" height="300" rx="18" fill="#f5f9f8"/>
<g font-family="system-ui, sans-serif" fill="#183b45"><text x="30" y="42" font-size="24" font-weight="700">Llama 3.1 / 3.3 的 70B 文本骨干</text><text x="30" y="72" font-size="15">教学简图：两个版本有相同的主干尺寸；权重与后训练不同</text>
<g stroke="#bdd8d1" fill="#fff"><rect x="30" y="112" width="145" height="80" rx="10"/><rect x="220" y="92" width="500" height="120" rx="12"/><rect x="770" y="112" width="200" height="80" rx="10"/></g>
<g text-anchor="middle" font-size="18"><text x="102" y="143">输入文本</text><text x="102" y="170" font-size="14">分词与词向量</text><text x="470" y="123">解码层 × 80</text><text x="470" y="154" font-size="16">RMSNorm → 因果 GQA → 残差</text><text x="470" y="182" font-size="16">RMSNorm → SwiGLU 前馈网络 → 残差</text><text x="870" y="143">词表预测</text><text x="870" y="170" font-size="14">输出下一个 token</text></g>
<g stroke="#437e72" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M175 152h38"/><path d="M720 152h42"/></g>
<text x="30" y="251" font-size="16" fill="#526b72">每层 64 个查询头共享 8 组键值头；RoPE 将位置引入查询与键。</text><text x="30" y="278" font-size="14" fill="#526b72">生成时将输出 token 接回上下文，继续预测；完整实现包含缓存与模板处理。</text></g></svg>
