<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="300" viewBox="0 0 1060 300" role="img" aria-labelledby="title desc"><title id="title">Gemini 1.5 多模态长上下文输入示意</title><desc id="desc">文本、图像、音频或视频经过服务输入处理，连同问题进入模型，生成回答；实际媒体处理和窗口受具体服务约束。</desc><rect width="1060" height="300" rx="18" fill="#f4f8f7"/><text x="32" y="42" font-family="sans-serif" font-size="23" font-weight="700" fill="#173b3d">不同材料与问题进入上下文，得到文字回答</text><g font-family="sans-serif" text-anchor="middle" fill="#173b3d"><rect x="30" y="92" width="180" height="110" rx="10" fill="#fff" stroke="#a8c7c4"/><text x="120" y="126" font-size="16">文本 / 图像</text><text x="120" y="157" font-size="16">音频 / 视频</text><text x="120" y="182" font-size="13">及用户问题</text><rect x="260" y="105" width="185" height="85" rx="10" fill="#fff" stroke="#a8c7c4"/><text x="352" y="138" font-size="16">服务输入处理</text><text x="352" y="163" font-size="13">格式、采样与窗口</text><rect x="500" y="95" width="190" height="105" rx="12" fill="#dcefeb" stroke="#67a59c"/><text x="595" y="140" font-size="17">Gemini 1.5</text><text x="595" y="167" font-size="13">结合输入生成回答</text><rect x="750" y="105" width="200" height="85" rx="10" fill="#fff" stroke="#a8c7c4"/><text x="850" y="138" font-size="16">文字回答</text><text x="850" y="163" font-size="13">需要对照原始证据</text><path d="M210 147h43" fill="none" stroke="#357f77" stroke-width="2" marker-end="url(#a)"/><path d="M445 147h48" fill="none" stroke="#357f77" stroke-width="2" marker-end="url(#a)"/><path d="M690 147h53" fill="none" stroke="#357f77" stroke-width="2" marker-end="url(#a)"/><text x="520" y="258" font-size="13" fill="#4b6666">只展示公开输入输出关系，不推测模型内部结构</text></g><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#357f77"/></marker></defs></svg>
