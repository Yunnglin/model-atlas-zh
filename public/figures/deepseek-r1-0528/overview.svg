<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc"><title id="title">DeepSeek-R1-0528 生成与验证</title><desc id="desc">问题经分词与因果模型生成推理及答案，应用使用外部计算器或测试程序验证，反馈用于后续改进。</desc><rect width="1200" height="390" rx="20" fill="#f5faf8"/><g font-family="sans-serif" fill="#193b38"><text x="35" y="48" font-size="24" font-weight="700">推理模型给出答案，外部验证辅助检查</text><g fill="#fff" stroke="#96beb4"><rect x="35" y="98" width="180" height="120" rx="12"/><rect x="275" y="98" width="215" height="120" rx="12"/><rect x="550" y="98" width="205" height="120" rx="12"/><rect x="815" y="98" width="250" height="120" rx="12"/></g><g text-anchor="middle" font-size="18"><text x="125" y="140">问题与条件</text><text x="125" y="176" font-size="15">原价、成本、费用</text><text x="382" y="140">因果模型</text><text x="382" y="176" font-size="15">注意力 + 专家层</text><text x="652" y="140">生成推理与答案</text><text x="652" y="176" font-size="15">版本和预算影响结果</text><text x="940" y="140">外部程序核验</text><text x="940" y="176" font-size="15">计算器 / 测试 / 证据</text></g><g fill="none" stroke="#43877a" stroke-width="3" marker-end="url(#arrow)"><path d="M215 158h50"/><path d="M490 158h50"/><path d="M755 158h50"/></g><text x="35" y="285" font-size="17">模型生成文字；外部系统可执行计算和测试，但不能保证回答完全正确。</text><text x="35" y="320" font-size="15" fill="#57756e">原创教学示意：省略具体层、路由与采样细节；不代表一次实际调用。</text></g><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#43877a"/></marker></defs></svg>
