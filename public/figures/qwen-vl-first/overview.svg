<text x="92" y="76" font-size="16">图片与尺寸调整</text><text x="277" y="76" font-size="16">ViT 编码器</text><text x="490" y="60" font-size="16">交叉注意力适配器</text><text x="490" y="87" font-size="15">固定 256 个视觉表示</text><text x="92" y="180" font-size="16">文字问题</text><text x="727" y="99" font-size="16">Qwen-7B</text><text x="727" y="127" font-size="15">语言模型</text><text x="952" y="113" font-size="16">文字或坐标</text><text x="530" y="229" font-size="13">教学简图：省略图像标记、层内结构及训练阶段，非官方原图。</text></g>
