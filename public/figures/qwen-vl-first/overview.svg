<title id="title">Qwen-VL 第一代图像问答教学简图</title><desc id="desc">图片调整尺寸后经视觉编码器和交叉注意力适配器形成固定长度视觉表示，和问题一起输入 Qwen 语言模型，生成文字或坐标。</desc>
