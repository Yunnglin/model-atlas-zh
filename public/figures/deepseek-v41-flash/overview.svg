<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="300" viewBox="0 0 1060 300" role="img" aria-labelledby="title desc"><title id="title">DeepSeek-V4.1-Flash 图文处理与因果主干示意</title><desc id="desc">图像经视觉编码器和投影形成视觉表示，与文字表示一起进入二十层因果编码器，再进入二十层解码器生成文字；解码器读取由编码器状态构造的全局缓存。</desc><rect width="1060" height="300" rx="16" fill="#f5faf8"/><g fill="#fff" stroke="#87b6a4"><rect x="20" y="35" width="145" height="62" rx="8"/><rect x="200" y="35" width="180" height="62" rx="8"/><rect x="20" y="155" width="145" height="62" rx="8"/><rect x="420" y="90" width="200" height="80" rx="8"/><rect x="680" y="90" width="185" height="80" rx="8"/><rect x="915" y="90" width="125" height="80" rx="8"/></g><g font-family="sans-serif" text-anchor="middle" fill="#203b35"><text x="92" y="71" font-size="16">图片</text><text x="290" y="61" font-size="15">视觉编码器</text><text x="290" y="82" font-size="14">与投影</text><text x="92" y="191" font-size="16">文字</text><text x="520" y="120" font-size="16">因果编码器</text><text x="520" y="145" font-size="14">20 层</text><text x="773" y="120" font-size="16">解码器</text><text x="773" y="145" font-size="14">20 层</text><text x="977" y="125" font-size="16">文字输出</text><text x="530" y="265" font-size="13">教学简图：解码器全局缓存来自编码器状态；省略局部窗口、跨层共享与 MoE 细节。</text></g><g fill="none" stroke="#468b75" stroke-width="3" marker-end="url(#a)"><path d="M165 66H190"/><path d="M380 66H400V120H410"/><path d="M165 186H400V145H410"/><path d="M620 130H670"/><path d="M865 130H905"/></g><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#468b75"/></marker></defs></svg>
