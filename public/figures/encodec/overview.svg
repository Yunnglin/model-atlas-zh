<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" role="img" aria-labelledby="title desc"><title id="title">EnCodec 残差量化音频编解码流程</title><desc id="desc">原始波形先由编码器得到特征，多个码本依次量化残差得到离散编号，解码器根据码本向量重建波形，可选熵编码用于进一步压缩。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#527a73"/></marker></defs><rect width="1100" height="350" rx="20" fill="#f6f9f8"/><g font-family="system-ui,sans-serif" fill="#173d3a"><text x="30" y="40" font-size="22" font-weight="700">声音压缩：用多本码本逐步表示残差</text><g font-size="16"><rect x="25" y="113" width="145" height="67" rx="10" fill="#e5f2ec"/><text x="50" y="153">输入波形</text><rect x="210" y="113" width="155" height="67" rx="10" fill="#e3eff0"/><text x="231" y="140">编码器</text><text x="231" y="162">连续特征</text><rect x="405" y="78" width="300" height="137" rx="10" fill="#f1eadc"/><text x="424" y="109" font-weight="700">残差向量量化 RVQ</text><text x="424" y="141">码本 1 → 剩余误差 → 码本 2</text><text x="424" y="174">继续补充残差，得到多个编号</text><rect x="745" y="113" width="140" height="67" rx="10" fill="#dcece4"/><text x="766" y="140">解码器</text><text x="766" y="162">重建波形</text><rect x="925" y="113" width="145" height="67" rx="10" fill="#e3eff0"/><text x="947" y="153">重建声音</text></g><g fill="none" stroke="#527a73" stroke-width="2.5" marker-end="url(#a)"><path d="M170 146H210"/><path d="M365 146H405"/><path d="M705 146H745"/><path d="M885 146H925"/></g><text x="30" y="275" font-size="16">可选：对码本编号做概率建模与熵编码，进一步压缩传输数据。</text><text x="30" y="318" font-size="14" fill="#526b68">教学简图：实际编解码器还包括网络层、帧组织与必要的元信息。</text></g></svg>
