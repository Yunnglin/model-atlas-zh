<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 355" role="img" aria-labelledby="title desc"><title id="title">F5-TTS 从文字与参考音频生成语音</title><desc id="desc">参考转写与待生成文本一起填充后由 ConvNeXt 整理，参考语音转梅尔谱，两种条件和噪声进入 DiT 流匹配模型，多步积分重复调用 DiT 更新中间状态，得到梅尔谱后再经声码器生成波形。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#527a73"/></marker></defs><rect width="1100" height="355" rx="20" fill="#f6f9f8"/><g font-family="system-ui,sans-serif" fill="#173d3a"><text x="30" y="40" font-size="22" font-weight="700">从噪声到可播放的语音</text><g font-size="16"><rect x="30" y="70" width="225" height="65" rx="10" fill="#e5f2ec"/><text x="48" y="98">参考转写 + 待生成文本</text><text x="48" y="121">填充后经 ConvNeXt</text><rect x="30" y="205" width="225" height="65" rx="10" fill="#e3eff0"/><text x="48" y="233">参考音频 → 梅尔谱</text><text x="48" y="256">提供声学条件</text><rect x="320" y="130" width="240" height="82" rx="10" fill="#f1eadc"/><text x="340" y="160">随机噪声 + 条件 + 时间</text><text x="340" y="187">DiT 预测更新方向</text><rect x="620" y="130" width="190" height="82" rx="10" fill="#dcece4"/><text x="640" y="160">多步积分采样</text><text x="640" y="187">得到连续梅尔谱</text><rect x="870" y="130" width="200" height="82" rx="10" fill="#e3eff0"/><text x="890" y="160">声码器</text><text x="890" y="187">梅尔谱 → 波形</text></g><g fill="none" stroke="#527a73" stroke-width="2.5" marker-end="url(#a)"><path d="M255 102H285V150H320"/><path d="M255 237H285V190H320"/><path d="M560 170H620"/><path d="M810 170H870"/><path d="M715 214V244H440V216" stroke-dasharray="6 5"/></g><text x="495" y="267" font-size="14" fill="#526b68">中间状态反复送回 DiT</text><text x="30" y="323" font-size="14" fill="#526b68">教学简图：流采样会多次调用模型；生成长度需要估计或指定。</text></g></svg>
