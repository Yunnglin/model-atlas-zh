<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="260" viewBox="0 0 1060 260" role="img" aria-labelledby="title desc"><title id="title">GLM-5.3 同基座后训练和长任务示意</title><desc id="desc">GLM-5.2 基座经后训练形成 GLM-5.3，模型通过外部执行器读写代码并接收测试反馈。</desc><rect width="1060" height="260" rx="16" fill="#f5f9f7"/><text x="30" y="37" fill="#193d38" font-size="20" font-family="sans-serif" font-weight="bold">GLM-5.3：同基座后训练与长任务交互（教学示意）</text><g font-family="sans-serif" text-anchor="middle" fill="#183a35"><rect x="28" y="78" width="160" height="84" rx="12" fill="#fff" stroke="#86aaa0"/><text x="108" y="110" font-size="17">GLM-5.2 基座</text><text x="108" y="138" font-size="14">稀疏注意力 + MoE</text><rect x="238" y="78" width="160" height="84" rx="12" fill="#e6f3ef" stroke="#77aa99"/><text x="318" y="110" font-size="17">后训练</text><text x="318" y="138" font-size="14">任务、轨迹与反馈</text><rect x="448" y="78" width="160" height="84" rx="12" fill="#f1ecfa" stroke="#aa9ac5"/><text x="528" y="110" font-size="17">GLM-5.3</text><text x="528" y="138" font-size="14">生成工具请求</text><rect x="658" y="78" width="160" height="84" rx="12" fill="#fff5e8" stroke="#c9a679"/><text x="738" y="110" font-size="17">外部执行器</text><text x="738" y="138" font-size="14">受限修改与测试</text><rect x="868" y="78" width="160" height="84" rx="12" fill="#fff" stroke="#86aaa0"/><text x="948" y="110" font-size="17">真实结果</text><text x="948" y="138" font-size="14">日志与验证</text></g><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#527f73"/></marker></defs><g stroke="#527f73" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M188 120h44"/><path d="M398 120h44"/><path d="M608 120h44"/><path d="M818 120h44"/><path d="M948 164v42H528v-38"/></g><text x="530" y="232" text-anchor="middle" fill="#52706a" font-size="14" font-family="sans-serif">结果返回后模型再调整；此图为简化示意，并非官方架构图</text></svg>
