<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="260" viewBox="0 0 1060 260" role="img" aria-labelledby="title desc"><title id="title">DeepSeek-VL2 图像理解流程</title><desc id="desc">图像分成缩略图与局部块，视觉编码器提取特征，适配器转换，与问题一起送入语言模型生成文字。</desc><rect width="1060" height="260" rx="16" fill="#f5faf8"/><g fill="#fff" stroke="#87b6a4"><rect x="20" y="75" width="165" height="75" rx="8"/><rect x="220" y="75" width="165" height="75" rx="8"/><rect x="420" y="75" width="165" height="75" rx="8"/><rect x="620" y="75" width="195" height="75" rx="8"/><rect x="850" y="75" width="180" height="75" rx="8"/></g><g font-family="sans-serif" text-anchor="middle" fill="#203b35"><text x="102" y="103" font-size="16">图像动态分块</text><text x="102" y="126" font-size="13">局部块 + 全局缩略图</text><text x="302" y="104" font-size="16">SigLIP 编码</text><text x="302" y="126" font-size="13">提取视觉特征</text><text x="502" y="104" font-size="16">视觉适配器</text><text x="502" y="126" font-size="13">压缩并映射特征</text><text x="717" y="104" font-size="16">MoE 语言模型</text><text x="717" y="126" font-size="13">结合文字问题</text><text x="940" y="104" font-size="16">文字或定位结果</text><text x="530" y="220" font-size="13">教学简图：省略分块排列、位置分隔符、专家路由与训练阶段；非官方结构图。</text></g><g fill="none" stroke="#468b75" stroke-width="3" marker-end="url(#a)"><path d="M185 112H210"/><path d="M385 112H410"/><path d="M585 112H610"/><path d="M815 112H840"/></g><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#468b75"/></marker></defs></svg>
