<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 300" role="img" aria-labelledby="title desc">
<title id="title">Kimi K2.6 多模态与工具调用示意</title><desc id="desc">文字直接输入主模型，图片或视频通过视觉编码器后输入主模型；模型输出文字或工具请求，外部执行器返回结果。</desc>
<rect width="1060" height="300" rx="20" fill="#f6f9f8"/><g font-family="system-ui,sans-serif" fill="#173d3c"><text x="32" y="38" font-size="22" font-weight="700">从多模态输入到工具反馈</text><g font-size="17"><rect x="30" y="73" width="125" height="55" rx="10" fill="#e5f2ee"/><text x="61" y="108">文字问题</text><rect x="30" y="157" width="125" height="55" rx="10" fill="#e5f2ee"/><text x="51" y="192">图片 / 视频</text><rect x="198" y="157" width="155" height="55" rx="10" fill="#e2edef"/><text x="222" y="192">MoonViT</text><rect x="409" y="94" width="178" height="103" rx="10" fill="#d6eae3"/><text x="455" y="132" font-weight="700">K2.6</text><text x="440" y="164">MoE 主模型</text><rect x="644" y="73" width="150" height="55" rx="10" fill="#e2edef"/><text x="681" y="108">文字回答</text><rect x="644" y="157" width="150" height="55" rx="10" fill="#e2edef"/><text x="674" y="192">工具请求</text><rect x="850" y="157" width="175" height="55" rx="10" fill="#f0e9d9"/><text x="868" y="192">外部工具执行器</text></g><g stroke="#527d74" stroke-width="2.5" fill="none" marker-end="url(#a)"><path d="M155 100 H409"/><path d="M155 184 H198"/><path d="M353 184 H409"/><path d="M587 110 H644"/><path d="M587 180 H644"/><path d="M794 184 H850"/><path d="M930 212 V237 H501 V203"/></g><text x="32" y="272" font-size="15" fill="#526b69">教学简图：工具执行、权限和调度由模型外的系统提供；反馈进入下一轮输入。</text></g><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#527d74"/></marker></defs></svg>
