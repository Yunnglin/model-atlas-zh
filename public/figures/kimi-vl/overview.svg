<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="260" viewBox="0 0 1060 260" role="img" aria-labelledby="title desc"><title id="title">Kimi-VL 图像与语言处理教学示意</title><desc id="desc">图片或视频采样帧通过 MoonViT 生成视觉特征，经合并和 MLP 投影后与文本一起输入 MoE 语言模型，生成文字回答。</desc><rect width="1060" height="260" rx="16" fill="#f5faf8"/><g fill="#fff" stroke="#87b6a4"><rect x="20" y="65" width="165" height="90" rx="8"/><rect x="220" y="65" width="165" height="90" rx="8"/><rect x="420" y="65" width="165" height="90" rx="8"/><rect x="620" y="65" width="205" height="90" rx="8"/><rect x="860" y="65" width="180" height="90" rx="8"/></g><g font-family="sans-serif" text-anchor="middle" fill="#203b35"><text x="102" y="100" font-size="15">图片 / 视频采样帧</text><text x="102" y="126" font-size="13">不同尺寸与长宽比</text><text x="302" y="100" font-size="16">MoonViT</text><text x="302" y="126" font-size="13">视觉块与位置表示</text><text x="502" y="100" font-size="15">合并 + MLP 投影</text><text x="502" y="126" font-size="13">转换视觉特征</text><text x="722" y="100" font-size="16">Moonlight MoE</text><text x="722" y="126" font-size="13">结合文字问题</text><text x="950" y="100" font-size="16">文本回答</text><text x="530" y="220" font-size="13">教学简图：视频需外部采样帧；省略预处理、路由、位置编码及多轮交互细节。</text></g><g fill="none" stroke="#468b75" stroke-width="3" marker-end="url(#a)"><path d="M185 110H210"/><path d="M385 110H410"/><path d="M585 110H610"/><path d="M825 110H850"/></g><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#468b75"/></marker></defs></svg>
