<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 350" role="img" aria-labelledby="title desc">
  <title id="title">MiniMax-VL-01 图像理解流程</title>
  <desc id="desc">输入图片被缩放切成局部图块并保留整图缩略图，视觉编码后经投影与问题共同送入混合注意力语言模型，输出文字答案。</desc>
  <defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#527b79"/></marker></defs>
  <rect width="1120" height="350" rx="20" fill="#f3f8f7"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="#173a3a">
    <text x="560" y="42" font-size="25" font-weight="700">MiniMax-VL-01：从图片和问题到回答</text>
    <g fill="#fff" stroke="#94b8b3" stroke-width="2">
      <rect x="24" y="126" width="155" height="85" rx="12"/><rect x="215" y="85" width="180" height="85" rx="12"/><rect x="215" y="207" width="180" height="85" rx="12"/>
      <rect x="432" y="144" width="160" height="85" rx="12"/><rect x="628" y="144" width="160" height="85" rx="12"/><rect x="824" y="126" width="260" height="115" rx="12"/>
    </g>
    <g font-size="18" font-weight="700"><text x="102" y="159">输入图片</text><text x="305" y="118">局部图块</text><text x="305" y="240">整图缩略图</text><text x="512" y="176">ViT 编码器</text><text x="708" y="176">MLP 投影</text><text x="954" y="159">MiniMax-Text-01</text></g>
    <g font-size="15"><text x="102" y="187">按网格缩放</text><text x="305" y="145">每块 336×336</text><text x="305" y="267">保留整体信息</text><text x="512" y="204">分别提取特征</text><text x="708" y="204">对齐语言空间</text><text x="954" y="188">与文字问题一起处理</text><text x="954" y="214">生成文字回答</text></g>
    <g fill="none" stroke="#527b79" stroke-width="2.5" marker-end="url(#arr)"><path d="M179 148H195V127H215"/><path d="M179 190H195V249H215"/><path d="M395 127H414V170H432"/><path d="M395 249H414V204H432"/><path d="M592 186H628"/><path d="M788 186H824"/></g>
    <text x="560" y="327" font-size="14">教学简图；省略位置编码、块内结构与训练环节，依据 MiniMax-01 报告第 6 节</text>
  </g>
</svg>
