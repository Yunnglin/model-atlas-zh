<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">Qwen-Image-Edit-2509 多图编辑示意</title><desc id="desc">两张参考图和文字指令进入编辑生成管线，输出图片后独立检查指令、主体和文字。</desc>
<rect width="1000" height="420" rx="20" fill="#f5f9f8"/><text x="36" y="49" font-family="sans-serif" font-size="23" fill="#153c43" font-weight="700">从多图和指令到编辑结果</text>
<g font-family="sans-serif" fill="#183e46"><rect x="38" y="90" width="180" height="90" rx="12" fill="#fff" stroke="#9bc5be"/><text x="56" y="125" font-size="18" font-weight="700">参考图 1</text><text x="56" y="155" font-size="15">人物及面部特征</text><rect x="38" y="194" width="180" height="90" rx="12" fill="#fff" stroke="#9bc5be"/><text x="56" y="229" font-size="18" font-weight="700">参考图 2</text><text x="56" y="259" font-size="15">水杯与品牌图案</text><rect x="38" y="298" width="180" height="70" rx="12" fill="#e8f3ef" stroke="#9bc5be"/><text x="56" y="326" font-size="17" font-weight="700">文字指令</text><text x="56" y="351" font-size="14">让人物拿杯子</text><rect x="302" y="145" width="250" height="168" rx="14" fill="#e0f0eb" stroke="#4a9989"/><text x="323" y="182" font-size="20" font-weight="700">编辑生成管线</text><text x="323" y="214" font-size="15">结合图片和指令条件</text><text x="323" y="242" font-size="15">逐步生成图像表示</text><text x="323" y="270" font-size="15">解码成像素图片</text><rect x="630" y="145" width="150" height="168" rx="14" fill="#fff" stroke="#9bc5be"/><text x="649" y="183" font-size="19" font-weight="700">输出图片</text><text x="649" y="219" font-size="15">人物拿着杯子</text><text x="649" y="247" font-size="15">身处咖啡馆</text><rect x="824" y="145" width="145" height="168" rx="14" fill="#fff5e7" stroke="#d9b376"/><text x="842" y="183" font-size="18" font-weight="700">独立检查</text><text x="842" y="218" font-size="15">人和商品像吗</text><text x="842" y="245" font-size="15">文字有错吗</text><text x="842" y="272" font-size="15">遮挡合理吗</text></g>
<g stroke="#5a8e87" stroke-width="3" fill="none"><path d="M218 135 H262 V195 H301"/><path d="M218 239 H301"/><path d="M218 333 H262 V268 H301"/><path d="M552 229 H628"/><path d="M780 229 H823"/></g><text x="38" y="400" font-family="sans-serif" font-size="14" fill="#56716e">教学示意：省略内部网络与采样细节；检查不属于模型生成步骤。</text></svg>
