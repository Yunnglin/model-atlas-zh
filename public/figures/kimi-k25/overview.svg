<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="300" viewBox="0 0 1060 300" role="img" aria-labelledby="title desc"><title id="title">Kimi K2.5 视觉模型与外部智能体流程</title><desc id="desc">图片和视频帧经 MoonViT-3D 与投影器进入 K2 MoE 语言模型，文字问题另行进入语言模型；模型生成文字或工具请求，外部编排系统可执行工具及并行子任务。</desc><rect width="1060" height="300" rx="16" fill="#f5faf8"/><g fill="#fff" stroke="#87b6a4"><rect x="20" y="65" width="150" height="80" rx="8"/><rect x="205" y="65" width="165" height="80" rx="8"/><rect x="405" y="65" width="130" height="80" rx="8"/><rect x="570" y="65" width="170" height="80" rx="8"/><rect x="775" y="65" width="265" height="80" rx="8"/><rect x="405" y="164" width="130" height="48" rx="8"/></g><g font-family="sans-serif" text-anchor="middle" fill="#203b35"><text x="95" y="110" font-size="15">图片 / 视频帧</text><text x="470" y="194" font-size="15">文字问题</text><text x="287" y="98" font-size="15">MoonViT-3D</text><text x="287" y="121" font-size="13">视觉时空特征</text><text x="470" y="105" font-size="15">MLP 投影器</text><text x="655" y="98" font-size="15">K2 MoE 主干</text><text x="655" y="121" font-size="13">生成文字或工具请求</text><text x="907" y="98" font-size="15">外部执行与编排</text><text x="907" y="121" font-size="13">可选工具 / 并行子任务</text><text x="530" y="237" font-size="13">教学简图：输出可直接回答；工具执行和多智能体编排依赖外部系统。</text></g><g fill="none" stroke="#468b75" stroke-width="3" marker-end="url(#a)"><path d="M170 105H195"/><path d="M370 105H395"/><path d="M535 105H560"/><path d="M740 105H765"/><path d="M535 188H655V150"/></g><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#468b75"/></marker></defs></svg>
