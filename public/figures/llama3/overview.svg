<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Llama 3 分组查询注意力教学示意</title><desc id="desc">多个查询头分组共享较少的键和值头，以减少键值缓存；该图仅展示概念，不表示具体型号的头数。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#38796d"/></marker></defs><rect width="1200" height="430" rx="20" fill="#f4f9f7"/>
<g font-family="sans-serif" fill="#173b38"><text x="35" y="45" font-size="24" font-weight="700">GQA：多个查询头，共用较少的键值头</text>
<rect x="35" y="93" width="205" height="170" rx="14" fill="#fff" stroke="#a6c9bf"/><text x="137" y="132" text-anchor="middle" font-size="18" font-weight="700">已有前文</text><text x="137" y="171" text-anchor="middle" font-size="16">缓存历史键和值</text><text x="137" y="207" text-anchor="middle" font-size="14">随对话长度增加</text>
<rect x="310" y="93" width="410" height="170" rx="14" fill="#e7f3ef" stroke="#8bb8aa"/><text x="515" y="128" text-anchor="middle" font-size="18" font-weight="700">共享关系示例</text><text x="515" y="166" text-anchor="middle" font-size="16">查询头 1、2 → 键值组 A</text><text x="515" y="200" text-anchor="middle" font-size="16">查询头 3、4 → 键值组 B</text><text x="515" y="238" text-anchor="middle" font-size="13">示意数字，不代表实际头数</text>
<rect x="790" y="93" width="365" height="170" rx="14" fill="#fff" stroke="#a6c9bf"/><text x="972" y="132" text-anchor="middle" font-size="18" font-weight="700">继续预测文本</text><text x="972" y="171" text-anchor="middle" font-size="15">查询仍各自计算注意力</text><text x="972" y="208" text-anchor="middle" font-size="14">结果与成本需实测</text>
<g fill="none" stroke="#38796d" stroke-width="3" marker-end="url(#a)"><path d="M240 178 H300"/><path d="M720 178 H780"/></g><text x="35" y="324" font-size="16">较少键值头有助于降低缓存占用；上下文长度、批量、精度与硬件仍影响资源。</text><text x="35" y="373" font-size="14" fill="#58746d">原创教学示意；省略注意力内部计算，不表示整个模型的架构。</text></g></svg>
