<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc"><title id="title">Qwen-Image-2512 文生图教学流程</title><desc id="desc">文字提示经过文本编码作为条件；生成网络从噪声迭代更新图像表示，经 VAE 解码得到图片，并可通过人工或工具复核文字。</desc><rect width="1200" height="390" rx="20" fill="#f5f9f8"/><text x="45" y="50" font-family="sans-serif" font-size="24" font-weight="700" fill="#183a40">从文字提示生成图片，再核对画面</text><g font-family="sans-serif" text-anchor="middle" fill="#183a40"><g fill="#fff" stroke="#a5c9c1" stroke-width="2"><rect x="45" y="105" width="180" height="100" rx="12"/><rect x="270" y="105" width="180" height="100" rx="12"/><rect x="495" y="105" width="220" height="100" rx="12"/><rect x="760" y="105" width="175" height="100" rx="12"/><rect x="980" y="105" width="175" height="100" rx="12"/></g><g font-size="18" font-weight="700"><text x="135" y="143">文字提示</text><text x="360" y="143">文本条件</text><text x="605" y="143">生成网络</text><text x="848" y="143">VAE 解码</text><text x="1068" y="143">图片与复核</text></g><g font-size="15" fill="#4b676b"><text x="135" y="174">海报主题和文字</text><text x="360" y="174">编码提示</text><text x="605" y="174">从噪声迭代更新</text><text x="848" y="174">还原像素画面</text><text x="1068" y="174">核对文字和事实</text></g></g><g fill="none" stroke="#468d83" stroke-width="3" marker-end="url(#a)"><path d="M225 155h45"/><path d="M450 155h45"/><path d="M715 155h45"/><path d="M935 155h45"/></g><text x="45" y="285" font-family="sans-serif" font-size="16" fill="#4b676b">教学概览：省略采样器和具体网络层；生成文字不等于已核实事实。</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#468d83"/></marker></defs></svg>
