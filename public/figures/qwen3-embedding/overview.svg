<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="290" viewBox="0 0 1060 290" role="img" aria-labelledby="title desc"><title id="title">Qwen3 Embedding 与 Reranker 检索流程</title><desc id="desc">文档与问题分别转成向量，从索引召回候选；再用重排模型同时读取问题与候选，给相关性评分。</desc><rect width="1060" height="290" rx="16" fill="#f5faf8"/><g fill="#fff" stroke="#87b6a4"><rect x="20" y="70" width="160" height="80" rx="8"/><rect x="225" y="70" width="180" height="80" rx="8"/><rect x="450" y="70" width="170" height="80" rx="8"/><rect x="665" y="70" width="190" height="80" rx="8"/><rect x="900" y="70" width="140" height="80" rx="8"/></g><g font-family="sans-serif" text-anchor="middle" fill="#203b35"><text x="100" y="102" font-size="16">问题 / 文档</text><text x="100" y="125" font-size="13">分别编码</text><text x="315" y="102" font-size="16">Embedding</text><text x="315" y="125" font-size="13">生成向量</text><text x="535" y="102" font-size="16">向量检索</text><text x="535" y="125" font-size="13">召回候选</text><text x="760" y="102" font-size="16">Reranker</text><text x="760" y="125" font-size="13">问题与候选一起评分</text><text x="970" y="102" font-size="16">重排结果</text><text x="430" y="174" font-size="12">原问题传给重排模型</text><text x="530" y="222" font-size="13">教学简图：文档向量通常预先建立索引；重排按需进行，不生成最终答案。</text><text x="530" y="245" font-size="13">省略切分、权限、索引和评分细节；非官方结构图。</text></g><g fill="none" stroke="#468b75" stroke-width="3" marker-end="url(#a)"><path d="M180 110H225"/><path d="M405 110H450"/><path d="M620 110H665"/><path d="M855 110H900"/><path d="M100 150V184H760V150" stroke-dasharray="6 4"/></g><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#468b75"/></marker></defs></svg>
