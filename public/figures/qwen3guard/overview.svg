<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="300" viewBox="0 0 1060 300" role="img" aria-labelledby="title desc"><title id="title">Qwen3Guard 生成式与流式审核示意</title><desc id="desc">生成式审核完整请求或回答并生成标签；流式审核器随助手输出增量判断，上层应用决定处置。</desc><rect width="1060" height="300" rx="18" fill="#f4f8f7"/><text x="32" y="42" font-family="sans-serif" font-size="23" font-weight="700" fill="#173b3d">两种审核方式，上层应用决定如何处理</text><g font-family="sans-serif" fill="#173b3d" text-anchor="middle"><text x="92" y="103" font-size="16">生成式</text><rect x="155" y="72" width="190" height="60" rx="10" fill="#fff" stroke="#a8c7c4"/><text x="250" y="108" font-size="15">完整请求或回复</text><rect x="400" y="72" width="195" height="60" rx="10" fill="#dcefeb" stroke="#67a59c"/><text x="497" y="108" font-size="15">Gen 生成审核标签</text><text x="92" y="204" font-size="16">流式</text><rect x="155" y="173" width="190" height="60" rx="10" fill="#fff" stroke="#a8c7c4"/><text x="250" y="209" font-size="15">回复逐步输出</text><rect x="400" y="173" width="195" height="60" rx="10" fill="#dcefeb" stroke="#67a59c"/><text x="497" y="209" font-size="15">Stream 增量分类</text><rect x="720" y="119" width="220" height="75" rx="10" fill="#fff" stroke="#a8c7c4"/><text x="830" y="151" font-size="15">上层应用</text><text x="830" y="176" font-size="13">放行、拦截或复核</text><path d="M345 102h48" fill="none" stroke="#357f77" stroke-width="2" marker-end="url(#a)"/><path d="M595 102h65v54h53" fill="none" stroke="#357f77" stroke-width="2" marker-end="url(#a)"/><path d="M345 203h48" fill="none" stroke="#357f77" stroke-width="2" marker-end="url(#a)"/><path d="M595 203h65v-47h53" fill="none" stroke="#357f77" stroke-width="2" marker-end="url(#a)"/><text x="525" y="272" font-size="13" fill="#4b6666">审核是风险信号；政策映射、缓冲和最终处置由系统配置</text></g><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#357f77"/></marker></defs></svg>
