<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 380" role="img" aria-labelledby="title desc">
<title id="title">Qwen3Guard-Stream 的请求和回复分类路径</title>
<desc id="desc">Qwen3 骨干输出当前 token 的隐藏状态，分别进入请求和回复两个独立分支；每个分支计算风险等级和安全类别。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#397f77"/></marker></defs>
<rect width="1080" height="380" rx="20" fill="#f4f8f7"/>
<g font-family="system-ui, sans-serif" fill="#173b3d">
<text x="35" y="45" font-size="23" font-weight="700">Stream：请求与回复分别判断</text>
<g fill="#fff" stroke="#a8c7c4"><rect x="35" y="140" width="205" height="82" rx="10"/><rect x="315" y="62" width="205" height="82" rx="10"/><rect x="315" y="222" width="205" height="82" rx="10"/><rect x="640" y="55" width="190" height="55" rx="10"/><rect x="640" y="120" width="190" height="55" rx="10"/><rect x="640" y="205" width="190" height="55" rx="10"/><rect x="640" y="270" width="190" height="55" rx="10"/></g>
<g font-size="17" text-anchor="middle"><text x="138" y="172">Qwen3 骨干</text><text x="138" y="200">当前隐藏状态</text><text x="418" y="95">请求分支</text><text x="418" y="122">线性映射 + 归一化</text><text x="418" y="255">回复分支</text><text x="418" y="282">线性映射 + 归一化</text><text x="735" y="88">请求风险等级</text><text x="735" y="153">请求风险类别</text><text x="735" y="238">回复风险等级</text><text x="735" y="303">回复风险类别</text></g>
<g fill="none" stroke="#397f77" stroke-width="2.5" marker-end="url(#arrow)"><path d="M240 160 L305 105"/><path d="M240 202 L305 263"/><path d="M520 85 L630 82"/><path d="M520 120 L630 147"/><path d="M520 245 L630 232"/><path d="M520 280 L630 297"/></g>
<text x="35" y="353" font-size="15" fill="#4b6666">示意图：请求训练在结束位置计分，回复训练在每个 token 位置计分。</text>
</g></svg>
