name: Verify knowledge and application

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      upload_pages:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ATLAS_BASE: /model-atlas-zh/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm peers check
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: inputs.upload_pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
